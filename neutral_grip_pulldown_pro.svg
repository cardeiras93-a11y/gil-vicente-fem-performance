<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Máquina de Puxada Alta: Torre e Cabo -->
  <rect x="50" y="25" width="28" height="120" rx="3" fill="url(#machGrad)" filter="url(#dropShadow)" />
  <line x1="64" y1="25" x2="64" y2="15" stroke="#475569" stroke-width="4" />
  <line x1="64" y1="15" x2="155" y2="15" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <circle cx="155" cy="18" r="5" fill="#0284c7" />

  <!-- Banco e Rolos para as Coxas -->
  <rect x="125" y="105" width="45" height="10" rx="2" fill="#0284c7" />
  <line x1="145" y1="115" x2="145" y2="145" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <!-- Rolo das Coxas -->
  <circle cx="120" cy="100" r="7" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />

  <!-- Sombra no solo -->
  <ellipse cx="145" cy="150" rx="45" ry="6" fill="#0f172a" opacity="0.2" />

  <!-- Cabo e Pega Neutra / Triângulo em V -->
  <line x1="155" y1="18" x2="150" y2="52" stroke="#0284c7" stroke-width="2" />
  <polygon points="144,52 156,52 150,60" fill="#334155" />

  <!-- Atleta Sentada a Puxar ao Peito -->
  <!-- Canelas e Pés -->
  <line x1="115" y1="102" x2="115" y2="145" stroke="#b45309" stroke-width="7" stroke-linecap="round" />
  <ellipse cx="112" cy="144" rx="5" ry="3" fill="#ffffff" />

  <!-- Coxas Travadas no Rolo -->
  <line x1="140" y1="102" x2="115" y2="102" stroke="#d97706" stroke-width="8" stroke-linecap="round" />

  <!-- Calções / Bacia no Banco -->
  <path d="M135,96 L152,96 L148,110 L132,110 Z" fill="#0f172a" />

  <!-- Tronco Ligeiramente Inclinado para Trás (15°) -->
  <path d="M140,64 L160,62 L154,98 L136,98 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo (Olhar para o topo) -->
  <circle cx="164" cy="50" r="8" fill="#d97706" />
  <path d="M158,46 C158,40 170,40 170,46 Z" fill="#78350f" />

  <!-- Braços Fletidos a Puxar a Pega Neutra ao Esterno -->
  <!-- Cotovelos a apontar para baixo e para trás -->
  <path d="M152,66 L138,78" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <path d="M138,78 L148,56" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />
  <ellipse cx="148" cy="54" rx="3.5" ry="3.5" fill="#d97706" />

  <!-- Destaque Muscular Grande Dorsal / Escapular -->
  <path d="M142,70 Q148,78 152,86" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

  <!-- Seta Vertical de Tração Descendente -->
  <g filter="url(#dropShadow)">
    <path d="M165,36 L165,58" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="161,54 165,62 169,54" fill="#2563eb" />
  </g>
</svg>