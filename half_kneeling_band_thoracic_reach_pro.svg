<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes thoracicReach {
      0%, 100% {
        transform: rotate(0deg) translate(0px, 0px);
      }
      50% {
        transform: rotate(-10deg) translate(4px, -8px);
      }
    }
    @keyframes arrowFloat {
      0%, 100% {
        transform: translate(0, 0);
        opacity: 0.6;
      }
      50% {
        transform: translate(5px, -5px);
        opacity: 1;
      }
    }
    .anim-reach {
      transform-origin: 145px 95px;
      animation: thoracicReach 2.8s ease-in-out infinite;
    }
    .anim-arrow {
      animation: arrowFloat 2.8s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-reach, .anim-arrow {
        animation: none !important;
      }
    }
  </style>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />

  <!-- Tapete Azul -->
  <polygon points="40,122 280,122 300,165 20,165" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sombra Projetada -->
  <ellipse cx="160" cy="155" rx="75" ry="9" fill="#0f172a" opacity="0.2" />

  <!-- Poste / Âncora da Banda à esquerda -->
  <rect x="25" y="45" width="8" height="95" rx="2" fill="#475569" />
  <circle cx="29" cy="95" r="4" fill="#0284c7" />

  <!-- Banda Elástica Laranja da âncora à mão de guia -->
  <path d="M29,95 Q90,92 145,90" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Perna Traseira (Joelho esquerdo no tapete - Estável) -->
  <path d="M125,120 L115,148 L95,148" stroke="#d97706" stroke-width="7" stroke-linecap="round" fill="none" />
  <ellipse cx="95" cy="148" rx="6" ry="3.5" fill="#ffffff" />

  <!-- Calções / Bacia Base -->
  <path d="M125,110 L155,108 L150,130 L122,128 Z" fill="#0f172a" />

  <!-- Perna Dianteira (Pé apoiado firme) -->
  <path d="M152,112 L192,122 L188,152 L178,152" stroke="#d97706" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M172,154 L196,154 L194,159 L170,159 Z" fill="#ffffff" />
  <path d="M175,156 L190,156" stroke="#0284c7" stroke-width="1.5" />

  <!-- Mão de Guia na Banda -->
  <path d="M142,86 L148,91" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <circle cx="147" cy="91" r="3.5" fill="#d97706" />

  <!-- SEGMENTO DINÂMICO EM ROTAÇÃO TORÁCICA & ALCANCE -->
  <g class="anim-reach">
    <!-- Tronco / Camisola Gil Vicente FC -->
    <path d="M135,78 C135,72 155,70 157,76 L152,114 C144,116 136,116 132,114 Z" fill="url(#kitGrad)" />

    <!-- Braço Superior Elevado em Extensão (Alcance Aéreo de Guarda-Redes) -->
    <path d="M148,78 L195,42" stroke="#d97706" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="196" cy="40" r="4" fill="#d97706" />

    <!-- Cabeça e Cabelo (Olhos na mão) -->
    <circle cx="146" cy="62" r="8" fill="#d97706" />
    <path d="M140,58 C140,51 151,51 152,57 L149,65 L142,65 Z" fill="#78350f" />
  </g>

  <!-- Setas Dinâmicas de Mobilidade (Rotação Torácica + Alcance Superior) -->
  <g filter="url(#dropShadow)" class="anim-arrow">
    <!-- Rotação Torácica -->
    <path d="M158,82 C168,80 174,74 176,68" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <polygon points="179,68 174,62 173,69" fill="#38bdf8" />
    <!-- Extensão / Alcance -->
    <path d="M190,48 L204,36" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="202,33 209,32 206,39" fill="#2563eb" />
  </g>

  <!-- Tag Guarda-Redes -->
  <g opacity="0.85">
    <rect x="235" y="14" width="75" height="18" rx="4" fill="#1e293b" />
    <text x="272" y="26" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">ROTAÇÃO &amp; ALCANCE</text>
  </g>
</svg>
