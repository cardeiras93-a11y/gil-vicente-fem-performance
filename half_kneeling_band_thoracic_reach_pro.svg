<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <ellipse cx="160" cy="154" rx="45" ry="7" fill="#0f172a" opacity="0.22" />
  <rect x="35" y="30" width="14" height="120" fill="url(#poleGrad)" rx="2" />
  <circle cx="42" cy="98" r="4" fill="#0284c7" />
  <!-- Atleta em Pé com Toalha no Cotovelo -->
  <line x1="155" y1="95" x2="155" y2="148" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <line x1="168" y1="95" x2="168" y2="148" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <path d="M152,58 L170,58 L168,95 L154,95 Z" fill="url(#kitGrad)" />
  <circle cx="161" cy="46" r="7.5" fill="#d97706" />
  <!-- Toalha no Cotovelo -->
  <rect x="148" y="78" width="6" height="14" rx="2" fill="#ffffff" stroke="#94a3b8" />
  <!-- Antebraço Rodando para Fora (Rotação Externa Manguito) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 155 86; -45 155 86; -45 155 86; 0 155 86" keyTimes="0; 0.45; 0.65; 1" dur="2.6s" repeatCount="indefinite" />
    <line x1="155" y1="86" x2="185" y2="86" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <circle cx="185" cy="86" r="4.5" fill="#ea580c" />
  </g>
  <!-- Banda Elástica Esticando com a Rotação -->
  <line x1="42" y1="98" x2="185" y2="86" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round">
    <animate attributeName="x2" values="185; 176; 176; 185" keyTimes="0; 0.45; 0.65; 1" dur="2.6s" repeatCount="indefinite" />
  </line>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">MANGUITO OMBO</text>
  </g>
</svg>
