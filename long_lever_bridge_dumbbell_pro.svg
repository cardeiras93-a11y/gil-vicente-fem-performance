<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="35,122 285,122 305,162 15,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="165" cy="148" rx="95" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Cabeça e Omoplatas no Tapete -->
  <circle cx="68" cy="134" r="8" fill="#d97706" />
  <path d="M60,132 C60,126 74,126 74,132 Z" fill="#78350f" />

  <!-- Tronco em Ponte Elevada -->
  <path d="M78,132 L144,104 L150,118 L82,142 Z" fill="url(#kitGrad)" />
  <path d="M140,102 L166,98 L170,114 L144,118 Z" fill="#0f172a" />

  <!-- Haltere na Bacia -->
  <g filter="url(#dropShadow)">
    <rect x="142" y="84" width="6" height="14" rx="2" fill="#0f172a" />
    <rect x="158" y="84" width="6" height="14" rx="2" fill="#0f172a" />
    <line x1="148" y1="91" x2="158" y2="91" stroke="#94a3b8" stroke-width="4" />
  </g>

  <!-- Perna Livre Elevada -->
  <path d="M158,100 L176,68 L196,56" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Perna de Trabalho em Alavanca Longa (Joelho a ~35°, Calcanhar Cravado Longe) -->
  <path d="M162,106 L212,110 L256,142" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Destaque Vermelho nos Isquiotibiais Distais (Sinergistas do LCA) -->
  <line x1="168" y1="111" x2="210" y2="114" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

  <!-- Pé com Calcanhar Cravado no Tapete e Ponta para Cima -->
  <path d="M254,144 L266,128" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Seta de Força do Calcanhar Cravando e Puxando -->
  <g filter="url(#dropShadow)">
    <path d="M248,148 L226,148" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="228,144 220,148 228,152" fill="#dc2626" />
  </g>
</svg>
