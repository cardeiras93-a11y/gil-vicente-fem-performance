<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,162 10,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="148" rx="80" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Cabeça e Ombros Planos no Chão -->
  <circle cx="82" cy="136" r="8" fill="#d97706" />
  <path d="M75,134 C75,128 88,128 88,134 Z" fill="#78350f" />

  <!-- Braços em Cruz Apoiados no Solo -->
  <path d="M92,136 L62,112" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <path d="M92,138 L88,154" stroke="#d97706" stroke-width="5" stroke-linecap="round" />

  <!-- Tronco Superior Alinhado ao Solo -->
  <path d="M90,135 L144,136 L140,146 L88,144 Z" fill="url(#kitGrad)" />

  <!-- Bacia e Coluna Lombar em Rotação Suave -->
  <path d="M140,136 C152,134 164,124 158,114 L142,122 Z" fill="#0f172a" />

  <!-- Joelhos Unidos e Deitados para o Lado -->
  <path d="M158,122 L172,98" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <path d="M172,98 L206,104" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" />
  <ellipse cx="208" cy="104" rx="4" ry="3" fill="#ffffff" />

  <!-- Foco de Mobilidade Rotacional Lombar -->
  <path d="M142,128 Q154,118 166,112" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Seta Curva de Rotação Suave para o Lado -->
  <g filter="url(#dropShadow)">
    <path d="M152,90 Q170,82 178,94" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="174,94 182,100 182,90" fill="#2563eb" />
  </g>
</svg>