<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Banco Inclinado a 30° (Costas Apoiadas) -->
  <rect x="75" y="85" width="70" height="12" rx="3" transform="rotate(-30 110 91)" fill="#0284c7" filter="url(#dropShadow)" />
  <rect x="135" y="112" width="30" height="10" rx="2" fill="#0284c7" />
  <line x1="100" y1="105" x2="100" y2="145" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="150" y1="122" x2="150" y2="145" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Sombra no solo -->
  <ellipse cx="155" cy="150" rx="55" ry="6" fill="#0f172a" opacity="0.2" />

  <!-- Pernas Fletidas com Pés Firmes no Chão -->
  <line x1="155" y1="116" x2="185" y2="116" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <line x1="185" y1="116" x2="188" y2="145" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <rect x="182" y="142" width="16" height="5" rx="2.5" fill="#ffffff" />

  <!-- Bacia / Calções no Assento -->
  <path d="M138,110 L158,110 L154,124 L134,124 Z" fill="#0f172a" />

  <!-- Tronco Apoiado nas Costas Inclinadas -->
  <path d="M88,78 L138,108 L132,118 L82,88 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo no Encosto -->
  <circle cx="78" cy="68" r="8" fill="#d97706" />
  <path d="M72,64 C72,58 84,58 84,64 Z" fill="#78350f" />

  <!-- Braços em Press de Peito Vertical a 90° com Tronco -->
  <path d="M102,86 L112,62 L110,40" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <!-- Haltere no Topo -->
  <line x1="98" y1="38" x2="122" y2="38" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
  <circle cx="98" cy="38" r="4" fill="#334155" />
  <circle cx="122" cy="38" r="4" fill="#334155" />

  <!-- Foco no Peitoral Clavicular (Superior) -->
  <ellipse cx="106" cy="80" rx="6" ry="5" fill="#ef4444" opacity="0.8" />

  <!-- Seta de Empurrão Vertical Perpendicular ao Tronco -->
  <g filter="url(#dropShadow)">
    <path d="M122,66 L128,44" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="123,47 131,38 131,49" fill="#2563eb" />
  </g>
</svg>