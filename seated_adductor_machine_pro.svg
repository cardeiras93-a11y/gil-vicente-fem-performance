<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Fundo do Ginásio -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="150" x2="320" y2="150" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Sombra no Solo -->
  <ellipse cx="160" cy="154" rx="90" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Torre de Pesos / Seletor Lateral -->
  <rect x="22" y="32" width="28" height="118" rx="3" fill="url(#machGrad)" filter="url(#dropShadow)" />
  <line x1="28" y1="42" x2="44" y2="42" stroke="#94a3b8" stroke-width="2" />
  <line x1="28" y1="52" x2="44" y2="52" stroke="#94a3b8" stroke-width="2" />
  <line x1="28" y1="62" x2="44" y2="62" stroke="#ef4444" stroke-width="2.5" />
  <line x1="28" y1="72" x2="44" y2="72" stroke="#94a3b8" stroke-width="2" />
  <line x1="28" y1="82" x2="44" y2="82" stroke="#94a3b8" stroke-width="2" />
  <line x1="28" y1="92" x2="44" y2="92" stroke="#94a3b8" stroke-width="2" />
  <!-- Cabo da torre -->
  <line x1="36" y1="32" x2="36" y2="20" stroke="#64748b" stroke-width="2" />
  <line x1="36" y1="20" x2="160" y2="20" stroke="#64748b" stroke-width="2" />
  <line x1="160" y1="20" x2="160" y2="115" stroke="#64748b" stroke-width="2" />

  <!-- Base da Máquina e Eixo Central -->
  <rect x="75" y="144" width="170" height="8" rx="3" fill="#1e293b" />
  <line x1="160" y1="110" x2="160" y2="148" stroke="#334155" stroke-width="10" stroke-linecap="round" />

  <!-- Braços Móveis Articulados da Máquina (Levers) -->
  <!-- Alavanca Esquerda -->
  <line x1="160" y1="120" x2="110" y2="128" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <!-- Alavanca Direita -->
  <line x1="160" y1="120" x2="210" y2="128" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Rolos / Almofadas de Apoio Medial (Inner Thigh Pads) -->
  <rect x="115" y="112" width="14" height="24" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" filter="url(#dropShadow)" />
  <rect x="191" y="112" width="14" height="24" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Apoios de Pés (Foot Pegs) -->
  <rect x="96" y="140" width="16" height="5" rx="2" fill="#334155" />
  <rect x="208" y="140" width="16" height="5" rx="2" fill="#334155" />

  <!-- Encosto e Assento da Máquina (Almofadas Azuis) -->
  <rect x="146" y="45" width="28" height="60" rx="4" fill="#0284c7" filter="url(#dropShadow)" />
  <rect x="140" y="105" width="40" height="14" rx="3" fill="#0284c7" filter="url(#dropShadow)" />

  <!-- Manípulos Laterais para Apoio das Mãos -->
  <line x1="134" y1="95" x2="134" y2="110" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <circle cx="134" cy="95" r="3.5" fill="#64748b" />
  <line x1="186" y1="95" x2="186" y2="110" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <circle cx="186" cy="95" r="3.5" fill="#64748b" />

  <!-- Atleta Sentada em Adução -->
  <!-- Cabeça -->
  <circle cx="160" cy="38" r="8.5" fill="#d97706" />
  <path d="M152,34 C152,26 168,26 168,34 Z" fill="#78350f" />
  <!-- Tronco vertical bem encostado -->
  <path d="M150,48 L170,48 L168,98 L152,98 Z" fill="url(#kitGrad)" />

  <!-- Braços aos lados segurando os manípulos -->
  <path d="M150,54 L136,80 L134,95" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M170,54 L184,80 L186,95" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Quadril / Bacia nos calções -->
  <path d="M148,98 L172,98 L170,110 L150,110 Z" fill="#0f172a" />

  <!-- Pernas em Posição de Trabalho: Coxas abertas a fechar contra os rolos -->
  <!-- Coxa Esquerda -->
  <path d="M152,106 L124,120" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
  <!-- Coxa Direita -->
  <path d="M168,106 L196,120" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />

  <!-- Foco Muscular Adutores (Parte Interna das Coxas em Vermelho Ativo) -->
  <path d="M150,110 L130,121" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  <path d="M170,110 L190,121" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

  <!-- Joelhos e Pernas inferiores descendo até aos apoios -->
  <circle cx="123" cy="120" r="4.5" fill="#d97706" />
  <path d="M123,120 L108,141" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <!-- Sapatilha Esquerda -->
  <path d="M100,140 L114,140 L110,146 L98,146 Z" fill="#1e3a8a" />

  <circle cx="197" cy="120" r="4.5" fill="#d97706" />
  <path d="M197,120 L212,141" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <!-- Sapatilha Direita -->
  <path d="M206,140 L220,140 L222,146 L210,146 Z" fill="#1e3a8a" />

  <!-- Setas de Adução Consecutiva (Força de Fecho Medial) -->
  <g filter="url(#dropShadow)">
    <!-- Seta para a Direita (perna esquerda move para dentro) -->
    <path d="M96,104 Q116,104 128,108" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="135,110 125,104 126,112" fill="#2563eb" />
    
    <!-- Seta para a Esquerda (perna direita move para dentro) -->
    <path d="M224,104 Q204,104 192,108" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="185,110 194,112 195,104" fill="#2563eb" />
  </g>

  <!-- Tag Identificadora -->
  <rect x="218" y="15" width="90" height="18" rx="4" fill="#0f172a" opacity="0.85" />
  <text x="263" y="27" fill="#38bdf8" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">MÁQUINA ADUTORA</text>
</svg>
