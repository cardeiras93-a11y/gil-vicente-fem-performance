<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Fundo do Ginásio -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="150" x2="320" y2="150" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Sombra no Solo -->
  <ellipse cx="160" cy="154" rx="95" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Torre de Pesos Lateral -->
  <rect x="22" y="30" width="28" height="120" rx="3" fill="url(#machGrad)" filter="url(#dropShadow)" />
  <line x1="28" y1="42" x2="44" y2="42" stroke="#94a3b8" stroke-width="2" />
  <line x1="28" y1="52" x2="44" y2="52" stroke="#94a3b8" stroke-width="2" />
  <line x1="28" y1="62" x2="44" y2="62" stroke="#ef4444" stroke-width="2.5" />
  <line x1="28" y1="72" x2="44" y2="72" stroke="#94a3b8" stroke-width="2" />
  <line x1="28" y1="82" x2="44" y2="82" stroke="#94a3b8" stroke-width="2" />
  <!-- Cabo da torre -->
  <line x1="36" y1="30" x2="36" y2="18" stroke="#64748b" stroke-width="2" />
  <line x1="36" y1="18" x2="160" y2="18" stroke="#64748b" stroke-width="2" />
  <line x1="160" y1="18" x2="160" y2="112" stroke="#64748b" stroke-width="2" />

  <!-- Base da Máquina e Eixo Central -->
  <rect x="75" y="145" width="170" height="7" rx="3" fill="#1e293b" />
  <line x1="160" y1="110" x2="160" y2="148" stroke="#334155" stroke-width="10" stroke-linecap="round" />

  <!-- Encosto e Assento da Máquina (Almofadas Azuis) -->
  <rect x="146" y="45" width="28" height="60" rx="4" fill="#0284c7" filter="url(#dropShadow)" />
  <rect x="140" y="105" width="40" height="14" rx="3" fill="#0284c7" filter="url(#dropShadow)" />

  <!-- Manípulos Laterais -->
  <line x1="134" y1="95" x2="134" y2="110" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <circle cx="134" cy="95" r="3.5" fill="#64748b" />
  <line x1="186" y1="95" x2="186" y2="110" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <circle cx="186" cy="95" r="3.5" fill="#64748b" />

  <!-- Atleta Sentada: Cabeça e Tronco -->
  <circle cx="160" cy="38" r="8.5" fill="#d97706" />
  <path d="M152,34 C152,26 168,26 168,34 Z" fill="#78350f" />
  <path d="M150,48 L170,48 L168,98 L152,98 Z" fill="url(#kitGrad)" />

  <!-- Braços aos lados -->
  <path d="M150,54 L136,80 L134,95" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M170,54 L184,80 L186,95" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M148,98 L172,98 L170,110 L150,110 Z" fill="#0f172a" />

  <!-- ==================== POSIÇÃO GHOST INICIAL (Pernas Totalmente Abertas / Abdução Máxima) ==================== -->
  <g opacity="0.35">
    <!-- Coxas Abertas Bem para Fora -->
    <path d="M150,106 L108,118" stroke="#d97706" stroke-width="7" stroke-dasharray="3,3" stroke-linecap="round" />
    <path d="M170,106 L212,118" stroke="#d97706" stroke-width="7" stroke-dasharray="3,3" stroke-linecap="round" />
    <circle cx="108" cy="118" r="4" fill="#94a3b8" />
    <circle cx="212" cy="118" r="4" fill="#94a3b8" />
    <!-- Tíbias abertas descendo -->
    <path d="M108,118 L88,142" stroke="#d97706" stroke-width="6" stroke-dasharray="3,3" stroke-linecap="round" />
    <path d="M212,118 L232,142" stroke="#d97706" stroke-width="6" stroke-dasharray="3,3" stroke-linecap="round" />
    <!-- Rolos na posição bem aberta -->
    <rect x="98" y="110" width="12" height="20" rx="3" fill="#64748b" opacity="0.5" />
    <rect x="210" y="110" width="12" height="20" rx="3" fill="#64748b" opacity="0.5" />
  </g>

  <!-- ==================== POSIÇÃO FINAL ATIVA (Adução / Fecho no Centro) ==================== -->
  <!-- Alavancas Mecânicas Fletidas para Dentro -->
  <line x1="160" y1="120" x2="120" y2="126" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="160" y1="120" x2="200" y2="126" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Rolos / Almofadas Almofadadas Mediares -->
  <rect x="122" y="112" width="13" height="24" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" filter="url(#dropShadow)" />
  <rect x="185" y="112" width="13" height="24" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Coxas Ativas Fechadas Contra as Almofadas -->
  <path d="M152,106 L130,121" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
  <path d="M168,106 L190,121" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />

  <!-- Destaque Muscular Adutores Ativos (Vermelho Intenso) -->
  <path d="M150,111 L134,122" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
  <path d="M170,111 L186,122" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />

  <!-- Joelhos e Tíbias Fechadas -->
  <circle cx="129" cy="121" r="4.5" fill="#d97706" />
  <path d="M129,121 L115,142" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <path d="M106,141 L120,141 L116,147 L104,147 Z" fill="#1e3a8a" />

  <circle cx="191" cy="121" r="4.5" fill="#d97706" />
  <path d="M191,121 L205,142" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <path d="M200,141 L214,141 L216,147 L204,147 Z" fill="#1e3a8a" />

  <!-- ==================== VETORES DE MOVIMENTO / FECHO BILATERAL DINÂMICO ==================== -->
  <g filter="url(#dropShadow)">
    <!-- Seta Esquerda -> Direita (Perna esquerda fecha em direção ao centro) -->
    <path d="M92,98 Q114,98 126,104" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
    <polygon points="134,107 122,101 124,109" fill="#2563eb" />
    
    <!-- Seta Direita -> Esquerda (Perna direita fecha em direção ao centro) -->
    <path d="M228,98 Q206,98 194,104" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
    <polygon points="186,107 196,109 198,101" fill="#2563eb" />
  </g>

  <!-- Tag Identificadora -->
  <rect x="214" y="15" width="94" height="18" rx="4" fill="#0f172a" opacity="0.85" />
  <text x="261" y="27" fill="#38bdf8" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">MÁQUINA ADUTORA</text>
</svg>
