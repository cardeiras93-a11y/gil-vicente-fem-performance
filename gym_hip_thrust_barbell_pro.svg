<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(210, 10)">
    <rect x="0" y="0" width="102" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, sans-serif" font-weight="900" text-anchor="middle">HIP THRUST</text>
  </g>


  <rect x="70" y="98" width="35" height="48" rx="4" fill="#0284c7" filter="url(#dropShadow)" />
  <rect x="65" y="142" width="45" height="6" fill="#1e293b" />
  <ellipse cx="165" cy="154" rx="75" ry="7" fill="#0f172a" opacity="0.22" />
  <ellipse cx="205" cy="150" rx="9" ry="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <line x1="205" y1="148" x2="202" y2="108" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <g>
    <animateTransform attributeName="transform" type="rotate" values="22 95 106; 0 95 106; 0 95 106; 22 95 106" keyTimes="0; 0.42; 0.65; 1" dur="2.6s" repeatCount="indefinite" />
    <path d="M95,106 L154,106" stroke="url(#kitGrad)" stroke-width="13" stroke-linecap="round" />
    <circle cx="85" cy="100" r="7.5" fill="#d97706" />
    <ellipse cx="156" cy="106" rx="9" ry="8" fill="#0f172a" />
    <circle cx="156" cy="98" r="8.5" fill="#0f172a" stroke="#ef4444" stroke-width="2.5" />
    <line x1="156" y1="106" x2="202" y2="108" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  </g>

</svg>
