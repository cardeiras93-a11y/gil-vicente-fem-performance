<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes wallSlideWY {
      0%, 100% {
        transform: translate(-15px, 16px);
      }
      50% {
        transform: translate(6px, -6px);
      }
    }
    @keyframes arrowSlideWall {
      0%, 100% {
        transform: translate(0px, 0px);
        opacity: 0.6;
      }
      50% {
        transform: translate(12px, -10px);
        opacity: 1;
      }
    }
    .anim-forearms {
      animation: wallSlideWY 2.8s ease-in-out infinite;
    }
    .anim-arrow-wall {
      animation: arrowSlideWall 2.8s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-forearms, .anim-arrow-wall {
        animation: none !important;
      }
    }
  </style>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Parede à Direita onde os antebraços deslizam -->
  <rect x="235" y="10" width="85" height="135" fill="url(#wallGrad)" opacity="0.65" />
  <line x1="235" y1="10" x2="235" y2="145" stroke="#94a3b8" stroke-width="2" />

  <!-- Sombra Projetada -->
  <ellipse cx="145" cy="154" rx="42" ry="7" fill="#0f172a" opacity="0.22" />

  <!-- Pernas Fixas em Base Equilibrada -->
  <path d="M142,118 L136,148 L128,148" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" fill="none" />
  <path d="M154,118 L158,148 L166,148" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" fill="none" />
  <ellipse cx="130" cy="150" rx="7" ry="3.5" fill="#ffffff" />
  <ellipse cx="164" cy="150" rx="7" ry="3.5" fill="#ffffff" />

  <!-- Calções / Bacia -->
  <path d="M136,102 L160,102 L158,122 L138,122 Z" fill="#0f172a" />

  <!-- Tronco Alinhado / Camisola Gil Vicente FC -->
  <path d="M138,72 C138,67 158,67 158,72 L156,105 C150,107 144,107 140,105 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo Neutro -->
  <circle cx="148" cy="58" r="8" fill="#d97706" />
  <path d="M143,54 C143,48 153,48 153,54 L151,60 L145,60 Z" fill="#78350f" />

  <!-- Posição W Inicial (Fantasma/Ghosting Suave) -->
  <g opacity="0.3">
    <path d="M142,75 L165,85 L175,62" stroke="#d97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M152,75 L172,85 L182,62" stroke="#d97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="173" y1="64" x2="184" y2="64" stroke="#10b981" stroke-width="3" />
  </g>

  <!-- SEGMENTO DINÂMICO QUE DESLIZA NA PAREDE (WALL SLIDE W -> Y) -->
  <g class="anim-forearms">
    <!-- Braço Esquerdo -->
    <path d="M142,72 L185,48 L228,26" stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Braço Direito -->
    <path d="M154,72 L195,48 L232,24" stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="228" cy="26" r="3.5" fill="#d97706" />
    <circle cx="233" cy="24" r="3.5" fill="#d97706" />

    <!-- Mini-Banda Verde nos Pulsos (Tensão Lateral Constante) -->
    <line x1="220" y1="32" x2="228" y2="28" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <line x1="220" y1="32" x2="228" y2="28" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Setas Dinâmicas de Deslize Ascendente na Parede -->
  <g filter="url(#dropShadow)" class="anim-arrow-wall">
    <path d="M188,62 L218,38" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="215,34 223,34 220,41" fill="#2563eb" />
  </g>

  <!-- Tag Articular -->
  <g opacity="0.85">
    <rect x="18" y="14" width="100" height="18" rx="4" fill="#1e293b" />
    <text x="68" y="26" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">SERRÁTIL &amp; ESCÁPULA</text>
  </g>
</svg>
