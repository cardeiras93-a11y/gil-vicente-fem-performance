<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Guias Verticais da Máquina Smith -->
  <line x1="110" y1="15" x2="110" y2="145" stroke="#94a3b8" stroke-width="3" />
  <line x1="210" y1="15" x2="210" y2="145" stroke="#94a3b8" stroke-width="3" />

  <!-- Degrau / Bloco Elevado para os Pés -->
  <rect x="135" y="132" width="50" height="13" rx="2" fill="#1e293b" filter="url(#dropShadow)" />
  <rect x="137" y="130" width="46" height="3" fill="#cbd5e1" />

  <!-- Sombra no solo -->
  <ellipse cx="160" cy="150" rx="40" ry="6" fill="#0f172a" opacity="0.2" />

  <!-- Barra Guiada nos Trapézios com Protetor Almofadado -->
  <line x1="105" y1="52" x2="215" y2="52" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
  <rect x="145" y="48" width="30" height="9" rx="3" fill="#0284c7" />

  <!-- Cabeça e Cabelo -->
  <circle cx="160" cy="38" r="8" fill="#d97706" />
  <path d="M154,34 C154,28 166,28 166,34 Z" fill="#78350f" />

  <!-- Mãos a segurar a barra -->
  <ellipse cx="138" cy="52" rx="4" ry="4" fill="#d97706" />
  <ellipse cx="182" cy="52" rx="4" ry="4" fill="#d97706" />

  <!-- Tronco Vertical Perfeito (Zero Balanço Lombar) -->
  <path d="M148,50 L172,50 L168,88 L152,88 Z" fill="url(#kitGrad)" />

  <!-- Calções / Bacia Neutra -->
  <path d="M150,86 L170,86 L168,104 L152,104 Z" fill="#0f172a" />

  <!-- Pernas Estendidas (Joelhos quase travados a 180° para recrutar gastrocnémios) -->
  <line x1="156" y1="104" x2="156" y2="130" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <line x1="166" y1="104" x2="166" y2="130" stroke="#b45309" stroke-width="8" stroke-linecap="round" />

  <!-- Pés no Degrau (Metatarsos apoiados, Calcanhares no ar em Flexão Plantar Máxima) -->
  <ellipse cx="158" cy="126" rx="6" ry="4" fill="#ffffff" />
  <ellipse cx="168" cy="126" rx="6" ry="4" fill="#e2e8f0" />

  <!-- Destaque Muscular nos Gémeos / Sóleo -->
  <ellipse cx="156" cy="116" rx="5" ry="8" fill="#ef4444" opacity="0.8" />
  <ellipse cx="166" cy="116" rx="5" ry="8" fill="#ef4444" opacity="0.8" />

  <!-- Seta Vertical de Elevação em Bicos de Pés com Pausa no Topo -->
  <g filter="url(#dropShadow)">
    <path d="M185,125 L185,108" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="181,112 185,104 189,112" fill="#2563eb" />
    <path d="M185,128 L185,136" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,2" />
  </g>
</svg>