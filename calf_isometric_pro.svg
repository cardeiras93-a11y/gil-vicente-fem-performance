<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <ellipse cx="160" cy="154" rx="55" ry="6" fill="#0f172a" opacity="0.22" />
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -18; 0 -18; 0 0" keyTimes="0; 0.4; 0.65; 1" dur="2.4s" repeatCount="indefinite" />
    <circle cx="160" cy="132" r="10" fill="#eab308" stroke="#ca8a04" stroke-width="2">
      <animate attributeName="r" values="10; 8.5; 8.5; 10" keyTimes="0; 0.4; 0.65; 1" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <path d="M136,134 L146,134 L144,146 L130,146 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <path d="M140,70 L140,132" stroke="#d97706" stroke-width="9" stroke-linecap="round" />
    <path d="M184,134 L174,134 L176,146 L190,146 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <path d="M180,70 L180,132" stroke="#d97706" stroke-width="9" stroke-linecap="round" />
    <path d="M125,133 L142,133 M137,130 L142,133 L137,136" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M195,133 L178,133 M183,130 L178,133 L183,136" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">HEEL SQUEEZE</text>
  </g>
</svg>
