<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="postGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1" />

  <!-- Poste / Rack de Ancoragem Lateral (Esquerda) -->
  <rect x="20" y="25" width="16" height="123" rx="2" fill="url(#postGrad)" filter="url(#dropShadow)" />
  <circle cx="28" cy="72" r="5" fill="#0284c7" />
  <circle cx="28" cy="72" r="2.5" fill="#ffffff" />

  <!-- Sombra Projetada dos Pés da Atleta -->
  <ellipse cx="170" cy="151" rx="38" ry="6" fill="#0f172a" opacity="0.22" />

  <!-- Banda Elástica Tracionada a Partir da Âncora -->
  <path d="M28,72 Q105,74 185,76" stroke="#0284c7" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M28,72 Q105,76 185,78" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.9" />

  <!-- Pernas em Base Atlética Firme (Pés Paralelos, Joelhos Macios) -->
  <!-- Perna Esquerda -->
  <path d="M152,106 L150,146" stroke="#b45309" stroke-width="7" stroke-linecap="round" />
  <rect x="144" y="144" width="15" height="5" rx="2.5" fill="#ffffff" />
  <rect x="146" y="145" width="11" height="2" fill="#ef4444" />

  <!-- Perna Direita -->
  <path d="M174,106 L178,146" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <rect x="174" y="144" width="15" height="5" rx="2.5" fill="#ffffff" />
  <rect x="176" y="145" width="11" height="2" fill="#ef4444" />

  <!-- Bacia / Calções (Pelve Bloqueada e Firme) -->
  <path d="M144,92 L180,92 L176,108 L146,108 Z" fill="#0f172a" />

  <!-- Tronco com Rotação Controlada -->
  <path d="M148,54 L176,52 L178,94 L146,94 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo (Olhar a Acompanhar os Braços) -->
  <circle cx="165" cy="40" r="8" fill="#d97706" />
  <path d="M159,36 C159,28 171,28 171,36 L169,44 L161,44 Z" fill="#78350f" />

  <!-- Braços Estendidos à Frente no Pallof Press c/ Rotação -->
  <path d="M154,60 L188,75" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
  <path d="M168,60 L196,77" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <!-- Mãos Entrelaçadas a Segurar a Pega -->
  <ellipse cx="192" cy="77" rx="5" ry="4" fill="#0f172a" />

  <!-- Vetores Anti-Rotação & Rotação Dinâmica -->
  <g filter="url(#dropShadow)">
    <!-- Core Bracing Ativação Central -->
    <circle cx="162" cy="74" r="5" fill="#ef4444" opacity="0.8" />
    <!-- Vetor de Rotação Controlada -->
    <path d="M166,86 A 26 26 0 0 0 205,86" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="204,82 211,87 204,91" fill="#2563eb" />
    <!-- Vetor de Tensão Lateral da Banda -->
    <line x1="120" y1="64" x2="80" y2="64" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,2" />
    <polygon points="83,61 75,64 83,67" fill="#0284c7" />
  </g>
</svg>
