<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <ellipse cx="160" cy="154" rx="80" ry="7" fill="#0f172a" opacity="0.22" />
  <line x1="90" y1="140" x2="250" y2="35" stroke="#334155" stroke-width="8" stroke-linecap="round" />
  <rect x="70" y="90" width="45" height="14" rx="4" transform="rotate(-35 70 90)" fill="#0284c7" filter="url(#dropShadow)" />
  <circle cx="68" cy="84" r="8" fill="#d97706" />
  <path d="M82,92 L118,114" stroke="url(#kitGrad)" stroke-width="14" stroke-linecap="round" />
  <ellipse cx="122" cy="116" rx="9" ry="8" fill="#0f172a" />
  <g>
    <animateTransform attributeName="transform" type="translate" values="-24 16; 0 0; 0 0; -24 16" keyTimes="0; 0.45; 0.65; 1" dur="3s" repeatCount="indefinite" />
    <rect x="195" y="48" width="10" height="36" rx="2" transform="rotate(-45 195 48)" fill="#1e293b" />
    <circle cx="218" cy="46" r="14" fill="#0f172a" stroke="#ef4444" stroke-width="3" />
    <line x1="124" y1="114" x2="162" y2="88" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
    <line x1="162" y1="88" x2="198" y2="60" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <ellipse cx="198" cy="58" rx="8" ry="4" transform="rotate(-45 198 58)" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  </g>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">LEG PRESS 45°</text>
  </g>
</svg>
