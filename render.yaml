services:
  - type: web
    name: gil-vicente-fem-performance
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npx next start -H 0.0.0.0 -p ${PORT:-3000}
    buildFilter:
      paths:
        - src/**
        - public/**
        - package.json
        - package-lock.json
        - tsconfig.json
        - next.config.js
        - tailwind.config.js
        - postcss.config.js
        - render.yaml
      ignoredPaths:
        - data_store/**
        - data/**
        - README.md
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
