<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,160 10,160" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <ellipse cx="160" cy="154" rx="75" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Rolo de Espuma sob as Coxas com Deslize -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -16,0; 0,0" dur="2.4s" repeatCount="indefinite" />
    <rect x="150" y="132" width="24" height="16" rx="4" fill="url(#rollerGrad)" filter="url(#dropShadow)" />
    <line x1="155" y1="133" x2="155" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="162" y1="133" x2="162" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="169" y1="133" x2="169" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Atleta em Posição de Prancha nos Antebraços a Rolar nos Quadricípites -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 16,0; 0,0" dur="2.4s" repeatCount="indefinite" />

    <!-- Antebraços no Solo -->
    <path d="M52,136 L72,136 L86,118" stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="52" cy="136" r="3.5" fill="#d97706" />

    <!-- Cabeça e Tronco em Prancha Horizontal Rígida -->
    <circle cx="76" cy="104" r="8" fill="#d97706" />
    <path d="M71,100 C71,94 81,94 81,100 L79,106 L73,106 Z" fill="#78350f" />
    <path d="M82,108 L136,112 L134,124 L80,122 Z" fill="url(#kitGrad)" />

    <!-- Bacia / Calções -->
    <path d="M132,112 L158,114 L154,126 L130,124 Z" fill="#0f172a" />

    <!-- Quadricípites Apoiados no Rolo -->
    <path d="M154,122 L198,128" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <!-- Canelas e Pés Suspensos no Ar -->
    <path d="M198,128 L242,120" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <ellipse cx="244" cy="119" rx="4.5" ry="3.5" fill="#ffffff" />
  </g>

  <!-- Vetores de Deslize nos Quadricípites -->
  <g filter="url(#dropShadow)">
    <path d="M142,104 L182,104" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.2s" repeatCount="indefinite" />
    </path>
    <polygon points="144,101 138,104 144,107" fill="#38bdf8" />
    <polygon points="180,101 186,104 180,107" fill="#38bdf8" />
    <!-- Ponto Fascial do Reto Femoral -->
    <ellipse cx="162" cy="126" rx="9" ry="3.5" fill="#ef4444" opacity="0.6">
      <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="1.4s" repeatCount="indefinite" />
    </ellipse>
  </g>
  <!-- Live Loop Indicator -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.88" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>