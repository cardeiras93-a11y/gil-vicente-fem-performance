<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,160 10,160" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <ellipse cx="160" cy="154" rx="75" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Rolo de Espuma sob a Bacia / Glúteo -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -8,2; 0,0" dur="2.4s" repeatCount="indefinite" />
    <rect x="115" y="130" width="24" height="16" rx="4" fill="url(#rollerGrad)" filter="url(#dropShadow)" />
    <line x1="120" y1="131" x2="120" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="127" y1="131" x2="127" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="134" y1="131" x2="134" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Atleta Sentada em Figura-4 Inclinada sobre o Glúteo com Oscilação Curta -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 8,-2; 0,0" dur="2.4s" repeatCount="indefinite" />

    <!-- Braço de Suporte Posterior -->
    <path d="M82,100 L72,136" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <circle cx="72" cy="138" r="3.5" fill="#d97706" />

    <!-- Tronco Inclinado a 45° -->
    <circle cx="98" cy="74" r="8" fill="#d97706" />
    <path d="M93,70 C93,64 103,64 103,70 L101,76 L95,76 Z" fill="#78350f" />
    <path d="M88,82 C88,76 112,76 112,82 L114,120 C106,122 96,122 92,120 Z" fill="url(#kitGrad)" />

    <!-- Bacia Apoiada Diretamente no Rolo -->
    <path d="M102,118 L132,118 L130,135 L102,134 Z" fill="#0f172a" />

    <!-- Perna Direita Cruzada em 'Figura-4' (Tornozelo sobre o Joelho Esquerdo) -->
    <path d="M125,124 L160,116 L175,130" stroke="#d97706" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Tornozelo Cruzado -->
    <circle cx="175" cy="130" r="4.5" fill="#ffffff" />

    <!-- Perna Esquerda de Apoio Fletida no Chão -->
    <path d="M122,126 L168,124 L190,146" stroke="#b45309" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="190" cy="147" r="4" fill="#ffffff" />
  </g>

  <!-- Foco no Piriforme / Glúteo Médio -->
  <g filter="url(#dropShadow)">
    <circle cx="127" cy="126" r="6" fill="#ef4444" opacity="0.65">
      <animate attributeName="r" values="4; 7; 4" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 0.85; 0.4" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <path d="M110,114 Q127,108 144,114" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.2s" repeatCount="indefinite" />
    </path>
  </g>
  <!-- Live Loop Indicator -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.88" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>