<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <rect x="50" y="115" width="70" height="50" rx="4" fill="url(#boxGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="155" rx="70" ry="10" fill="#0f172a" opacity="0.2" />

  <!-- Atleta Sentada com Coxa Fixa -->
  <circle cx="85" cy="72" r="8" fill="#d97706" />
  <path d="M80,68 C80,62 90,62 90,68 L88,74 L82,74 Z" fill="#78350f" />
  <path d="M78,80 C78,75 104,75 104,80 L100,122 C94,124 84,124 78,122 Z" fill="url(#kitGrad)" />
  <path d="M90,118 L118,116 L112,134 L90,134 Z" fill="#0f172a" />

  <!-- Coxa Segura pelas Mãos (Ponto Fixo) -->
  <path d="M112,118 L160,105 L160,116 L112,128 Z" fill="#d97706" />
  <path d="M95,88 L155,108" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <circle cx="156" cy="110" r="4" fill="#d97706" />

  <!-- Canela Suspensa no Ar com Pé em Rotação 360° Contínua -->
  <g>
    <!-- Canela -->
    <path d="M160,110 L215,118" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    
    <!-- Tornozelo e Pé em Ciclo 360 Graus de CARs -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 215 118; 18 215 118; 0 215 118; -18 215 118; 0 215 118" dur="2.4s" repeatCount="indefinite" />
      <path d="M215,118 L232,112 L236,118 L218,126 Z" fill="#ffffff" filter="url(#dropShadow)" />
      <!-- Banda elástica esticando dinamicamente -->
      <path d="M232,114 L265,110" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Órbita Visual do CARs com Seta a Rodar -->
  <g filter="url(#dropShadow)">
    <ellipse cx="236" cy="118" rx="16" ry="16" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 236 118; 360 236 118" dur="2.4s" repeatCount="indefinite" />
      <circle cx="252" cy="118" r="4" fill="#2563eb" />
      <polygon points="252,114 258,118 252,122" fill="#2563eb" />
    </g>
  </g>

  <!-- Live Loop Badge -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.85" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>