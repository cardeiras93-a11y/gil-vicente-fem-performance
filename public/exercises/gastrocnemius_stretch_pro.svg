<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="140" x2="320" y2="140" stroke="#cbd5e1" stroke-width="1" />

  <!-- Parede à Direita -->
  <rect x="260" y="30" width="60" height="130" fill="url(#wallGrad)" filter="url(#dropShadow)" />

  <!-- Sombra Projetada -->
  <ellipse cx="160" cy="155" rx="85" ry="10" fill="#0f172a" opacity="0.22" />

  <!-- Atleta em Pé apoiada na Parede com Perna Traseira Totalmente Reta (GASTROCNÉMIO) -->
  <!-- Mãos na Parede -->
  <ellipse cx="260" cy="80" rx="4" ry="5" fill="#d97706" />
  <path d="M190,78 L260,80" stroke="#d97706" stroke-width="5" stroke-linecap="round" />

  <!-- Tronco Inclinado em Bloco / Camisola Gil Vicente FC -->
  <path d="M165,68 C165,64 195,64 195,68 L175,115 C168,118 158,118 155,115 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo -->
  <circle cx="178" cy="54" r="8" fill="#d97706" />
  <path d="M173,50 C173,44 183,44 183,50 L181,56 L175,56 Z" fill="#78350f" />

  <!-- Calções / Bacia -->
  <path d="M152,112 L180,112 L176,128 L150,126 Z" fill="#0f172a" />

  <!-- Perna Traseira (Joelho Totalmente Estendido, Linha Reta da Bacia ao Calcanhar) -->
  <path d="M155,125 L120,152" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <!-- Calcanhar no chão -->
  <path d="M112,154 L128,154 L125,149 L112,149 Z" fill="#ffffff" />
  <ellipse cx="114" cy="153" rx="3" ry="1.5" fill="#0f172a" />

  <!-- Perna Dianteira (Joelho Dobrado) -->
  <path d="M178,125 L198,138 L195,154" stroke="#d97706" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M188,155 L205,155 L203,151 L188,151 Z" fill="#ffffff" />

  <!-- Vetor no Ventre Superior do Gastrocnémio -->
  <g filter="url(#dropShadow)">
    <path d="M135,134 L142,141" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="2,2" />
    <path d="M162,108 L175,108" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
    <polygon points="173,105 180,108 173,111" fill="#2563eb" />
  </g>
</svg>
