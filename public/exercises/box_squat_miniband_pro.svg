<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="homeFloor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solo -->
  <rect width="320" height="180" fill="url(#homeFloor2)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Caixa / Cadeira de Casa -->
  <rect x="65" y="95" width="45" height="53" rx="4" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5" />
  <line x1="65" y1="95" x2="110" y2="95" stroke="#94a3b8" stroke-width="2" />
  <text x="87" y="125" fill="#94a3b8" font-size="8" font-weight="900" font-family="Inter, sans-serif" text-anchor="middle">BOX 45cm</text>

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(205, 10)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#0284c7" />
    <text x="14" y="8" fill="#334155" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">BOX SQUAT C/ MINI-BANDA (CASA)</text>
  </g>

  <!-- Atleta a Fazer Box Squat c/ Mini-banda (Animação de Agachamento e Subida) -->
  <g>
    <!-- Movimento vertical de agachamento -->
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; -12,24; -12,24; 0,0"
                      keyTimes="0; 0.45; 0.65; 1" dur="3s" repeatCount="indefinite" />

    <!-- Cabeça -->
    <circle cx="155" cy="42" r="9" fill="#f6ad55" />
    <path d="M150 36 Q155 31 160 37" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Tronco ereto com ativação do core -->
    <path d="M155 52 L152 95" stroke="#1e3a8a" stroke-width="15" stroke-linecap="round" />

    <!-- Braços à frente para contrapeso -->
    <path d="M154 62 L185 62" stroke="#f6ad55" stroke-width="5.5" stroke-linecap="round" />

    <!-- Mini-banda nos joelhos com pulso elástico -->
    <ellipse cx="152" cy="108" rx="9" ry="4" fill="#ef4444">
      <animate attributeName="rx" values="9;12;12;9" keyTimes="0; 0.45; 0.65; 1" dur="3s" repeatCount="indefinite" />
    </ellipse>
    <text x="175" y="111" fill="#ef4444" font-size="7" font-weight="900" font-family="Inter, sans-serif">MINI-BANDA</text>
  </g>

  <!-- Pernas Fixas no Solo com Ângulo Articular Suave -->
  <g>
    <!-- Coxas -->
    <path d="M140 119 L152 110" stroke="#0f172a" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d"
               values="M152 95 L152 120; M140 119 L152 110; M140 119 L152 110; M152 95 L152 120"
               keyTimes="0; 0.45; 0.65; 1" dur="3s" repeatCount="indefinite" />
    </path>
    <!-- Tíbias / Joelhos verticais estáveis -->
    <path d="M152 115 L155 146" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
    <!-- Pés firmes no chão -->
    <ellipse cx="160" cy="147" rx="9" ry="3.5" fill="#0284c7" />
  </g>

  <!-- Vetor de Tensão do Quadricípete -->
  <g transform="translate(180, 78)">
    <path d="M0 0 L14 0" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    <polygon points="14,0 10,-3 10,3" fill="#0284c7" />
    <text x="18" y="3" fill="#0284c7" font-size="7.5" font-weight="800" font-family="Inter, sans-serif">TEMPO 3s DESCIDA</text>
  </g>
</svg>
