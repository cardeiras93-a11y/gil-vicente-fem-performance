<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="benchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Banco Plano Horizontal -->
  <rect x="70" y="105" width="130" height="12" rx="3" fill="#0284c7" filter="url(#dropShadow)" />
  <line x1="85" y1="117" x2="85" y2="145" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="185" y1="117" x2="185" y2="145" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Sombra no solo -->
  <ellipse cx="155" cy="150" rx="75" ry="6" fill="#0f172a" opacity="0.2" />

  <!-- Pernas Fletidas com Pés no Solo -->
  <line x1="185" y1="105" x2="215" y2="108" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <line x1="215" y1="108" x2="218" y2="145" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <rect x="212" y="142" width="16" height="5" rx="2.5" fill="#ffffff" />

  <!-- Tronco Totalmente Apoiado no Banco (Supino) -->
  <path d="M102,105 L182,105 L182,115 L102,115 Z" fill="url(#kitGrad)" />
  <rect x="165" y="104" width="20" height="11" fill="#0f172a" />

  <!-- Cabeça e Cabelo Apoiados na Extremidade do Banco -->
  <circle cx="92" cy="102" r="8" fill="#d97706" />
  <path d="M86,98 C86,92 98,92 98,98 Z" fill="#78350f" />

  <!-- Braços em Extensão de Tríceps à Testa (Braços Fixos, Antebraços Dobram) -->
  <!-- Braço (Úmero vertical ligeiramente inclinado para trás) -->
  <line x1="118" y1="104" x2="114" y2="70" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <!-- Antebraço Fletido a 90° em Direção à Testa com Haltere -->
  <line x1="114" y1="70" x2="92" y2="78" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />

  <!-- Haltere Sextavado Junto à Testa -->
  <rect x="84" y="74" width="10" height="12" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <line x1="82" y1="80" x2="96" y2="80" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Destaque Muscular no Tríceps (Cabeça Longa e Lateral) -->
  <line x1="116" y1="98" x2="114" y2="74" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" />

  <!-- Seta Curva de Extensão do Cotovelo para o Topo -->
  <g filter="url(#dropShadow)">
    <path d="M96,72 Q105,62 118,52" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="113,50 123,48 119,57" fill="#2563eb" />
  </g>
</svg>