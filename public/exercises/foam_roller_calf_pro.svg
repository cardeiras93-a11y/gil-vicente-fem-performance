<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="125" x2="320" y2="125" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Tapete Azul -->
  <polygon points="35,115 285,115 305,160 15,160" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sombra Projetada -->
  <ellipse cx="160" cy="148" rx="80" ry="10" fill="#0f172a" opacity="0.22" />

  <!-- Atleta Sentada no Tapete c/ Rolo sob os Gémeos -->
  <!-- Mãos no Chão atrás para apoiar o peso -->
  <ellipse cx="85" cy="135" rx="5" ry="3" fill="#d97706" />
  <path d="M83,135 L88,110 L94,110 L90,135 Z" fill="#d97706" />

  <!-- Cabeça e Cabelo -->
  <circle cx="102" cy="78" r="8" fill="#d97706" />
  <path d="M97,74 C97,68 107,68 107,74 L105,80 L99,80 Z" fill="#78350f" />

  <!-- Tronco Ligeiramente Inclinado / Camisola Gil Vicente FC -->
  <path d="M92,86 C92,82 118,82 118,86 L112,122 C108,124 96,124 92,122 Z" fill="url(#kitGrad)" />

  <!-- Calções / Bacia Elevada do Tapete -->
  <path d="M108,118 L138,114 L134,130 L108,130 Z" fill="#0f172a" />

  <!-- Coxas Estendidas para a Frente -->
  <path d="M136,116 L185,118 L185,126 L134,128 Z" fill="#d97706" />

  <!-- Canela / Gémeo Direito sobre o Rolo -->
  <path d="M185,118 L240,122 L240,130 L185,126 Z" fill="#d97706" />
  <!-- Pé com Sapatilha -->
  <path d="M240,122 L248,116 L252,119 L244,128 Z" fill="#ffffff" />

  <!-- Rolo de Espuma Preto Cilindrico sob a Barriga da Perna -->
  <ellipse cx="210" cy="133" rx="9" ry="12" fill="#1e293b" filter="url(#dropShadow)" />
  <rect x="206" y="121" width="8" height="24" rx="2" fill="#334155" />

  <!-- Vetores de Deslize Lento no Rolo -->
  <g filter="url(#dropShadow)">
    <path d="M192,110 L228,110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <polygon points="194,107 187,110 194,113" fill="#38bdf8" />
    <polygon points="226,107 233,110 226,113" fill="#38bdf8" />
  </g>
</svg>
