<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="150" x2="320" y2="150" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(170, 10)">
    <rect x="0" y="0" width="142" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="78" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" text-anchor="middle">SHOULDER PRESS MACHINE</text>
  </g>

  <!-- Sombra no solo -->
  <ellipse cx="145" cy="154" rx="60" ry="7" fill="#0f172a" opacity="0.22" />

  <!-- Estrutura da Máquina e Torre de Placas -->
  <rect x="55" y="35" width="32" height="115" rx="4" fill="url(#frameGrad)" filter="url(#dropShadow)" />
  <!-- Placas de Peso em Movimento -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 -12; 0 0" keyTimes="0; 0.45; 0.65; 1" dur="2.6s" repeatCount="indefinite" />
    <rect x="60" y="65" width="22" height="6" fill="#ef4444" rx="1.5" />
    <rect x="60" y="73" width="22" height="5" fill="#38bdf8" rx="1.5" />
    <line x1="71" y1="35" x2="71" y2="65" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- Banco com Encosto Acolchoado (Azul GVFC) -->
  <rect x="110" y="60" width="10" height="60" rx="3" transform="rotate(-6 115 90)" fill="#0284c7" filter="url(#dropShadow)" />
  <rect x="110" y="115" width="40" height="10" rx="3" fill="#0284c7" filter="url(#dropShadow)" />
  <line x1="125" y1="125" x2="125" y2="150" stroke="#475569" stroke-width="7" stroke-linecap="round" />

  <!-- Atleta Sentada -->
  <!-- Pernas -->
  <line x1="145" y1="118" x2="168" y2="118" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <line x1="168" y1="118" x2="168" y2="150" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <rect x="163" y="146" width="16" height="5" rx="2.5" fill="#ffffff" />
  <!-- Bacia e Tronco -->
  <ellipse cx="128" cy="116" rx="10" ry="7" fill="#0f172a" />
  <path d="M125,72 L146,72 L142,114 L122,114 Z" fill="url(#kitGrad)" />
  <!-- Cabeça -->
  <circle cx="136" cy="55" r="8" fill="#d97706" />
  <path d="M130,51 C130,44 142,44 142,51 Z" fill="#78350f" />

  <!-- Braços da Máquina e Alavancas em Press Vertical -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -22; 0 -22; 0 0" keyTimes="0; 0.45; 0.65; 1" dur="2.6s" repeatCount="indefinite" />
    <!-- Alavanca Mecânica Guiada -->
    <path d="M75,50 L115,48 L142,65" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="142" cy="65" r="4" fill="#0f172a" />
    <!-- Pega e Mãos -->
    <line x1="138" y1="62" x2="148" y2="62" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
    <!-- Braço da Atleta em Extensão -->
    <line x1="135" y1="74" x2="142" y2="64" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" />
  </g>
</svg>
