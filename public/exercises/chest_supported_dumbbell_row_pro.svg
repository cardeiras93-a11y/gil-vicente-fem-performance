<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Banco Inclinado a 35° (Apoio Torácico Total = Zero Sobrecarga Lombar) -->
  <line x1="110" y1="145" x2="185" y2="75" stroke="#475569" stroke-width="8" stroke-linecap="round" />
  <rect x="120" y="80" width="68" height="12" rx="3" transform="rotate(-40 154 86)" fill="#0284c7" filter="url(#dropShadow)" />
  <line x1="165" y1="95" x2="165" y2="145" stroke="#334155" stroke-width="6" stroke-linecap="round" />

  <!-- Sombra no solo -->
  <ellipse cx="155" cy="150" rx="55" ry="6" fill="#0f172a" opacity="0.2" />

  <!-- Pernas Estendidas para Trás com Pés Firmes no Solo -->
  <line x1="118" y1="118" x2="70" y2="142" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" />
  <ellipse cx="68" cy="143" rx="5" ry="3" fill="#ffffff" />

  <!-- Bacia / Calções Apoiados no Banco -->
  <path d="M126,108 L114,116 L120,126 L132,118 Z" fill="#0f172a" />

  <!-- Peito Apoiado no Encosto Inclinado -->
  <path d="M130,105 L172,70 L178,78 L136,113 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo (Olhar alinhado) -->
  <circle cx="188" cy="62" r="8" fill="#d97706" />
  <path d="M182,58 C182,52 194,52 194,58 Z" fill="#78350f" />

  <!-- Braço a Puxar o Haltere (Cotovelo Alto, Retração Escapular) -->
  <path d="M165,75 L160,52" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <path d="M160,52 L145,68" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />

  <!-- Haltere Puxado ao Flanco -->
  <rect x="138" y="66" width="14" height="8" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <line x1="135" y1="70" x2="155" y2="70" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Destaque Rombóides e Trapézio Médio -->
  <ellipse cx="158" cy="68" rx="6" ry="4" fill="#ef4444" opacity="0.8" />

  <!-- Seta Curva de Tração Escapular para Cima e Trás -->
  <g filter="url(#dropShadow)">
    <path d="M146,88 Q158,80 162,62" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="158,64 163,56 166,65" fill="#2563eb" />
  </g>
</svg>