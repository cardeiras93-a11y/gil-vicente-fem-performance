<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Torre de Cabos (à esquerda) -->
  <rect x="25" y="20" width="35" height="130" rx="3" fill="url(#towerGrad)" filter="url(#dropShadow)" />
  <line x1="42" y1="30" x2="42" y2="145" stroke="#64748b" stroke-width="2" />
  <!-- Roldana / Polia Baixa -->
  <circle cx="55" cy="138" r="6" fill="#0284c7" />
  <circle cx="55" cy="138" r="3" fill="#ffffff" />

  <!-- Sombra no solo -->
  <ellipse cx="165" cy="150" rx="50" ry="7" fill="#0f172a" opacity="0.2" />

  <!-- Barra de Apoio da Máquina segura pela Atleta -->
  <line x1="60" y1="75" x2="120" y2="75" stroke="#475569" stroke-width="4" stroke-linecap="round" />

  <!-- Atleta em Pé com Tronco Ligeiramente Inclinado (Apoiada na Barra) -->
  <!-- Mão esquerda a segurar a barra -->
  <ellipse cx="118" cy="75" rx="4" ry="4" fill="#d97706" />
  <path d="M118,75 L145,72" stroke="#d97706" stroke-width="5" stroke-linecap="round" />

  <!-- Cabeça e Cabelo -->
  <circle cx="152" cy="46" r="8" fill="#d97706" />
  <path d="M146,42 C146,36 158,36 158,42 Z" fill="#78350f" />

  <!-- Tronco (Camisola Gil Vicente) -->
  <path d="M142,56 L160,56 L154,92 L138,92 Z" fill="url(#kitGrad)" />

  <!-- Bacia / Calções -->
  <path d="M136,90 L156,90 L152,106 L134,106 Z" fill="#0f172a" />
  <circle cx="152" cy="98" r="5" fill="#ef4444" opacity="0.75" />

  <!-- Perna de Apoio (Vertical, ligeiramente fletida) -->
  <path d="M142,106 L144,146" stroke="#b45309" stroke-width="8" stroke-linecap="round" />
  <rect x="138" y="144" width="16" height="5" rx="2.5" fill="#ffffff" />

  <!-- Perna Ativa em Abdução Lateral para Fora (45°) -->
  <path d="M148,106 L192,132" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <rect x="188" y="128" width="16" height="5" rx="2.5" transform="rotate(30 196 130)" fill="#ffffff" />

  <!-- Tornozeleira na perna ativa -->
  <rect x="178" y="122" width="7" height="10" rx="2" fill="#0284c7" />

  <!-- Cabo de Aço da Polia até à Tornozeleira -->
  <path d="M55,138 L180,126" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />

  <!-- Seta Curva de Abdução Lateral -->
  <g filter="url(#dropShadow)">
    <path d="M165,138 Q182,142 198,128" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="196,124 204,126 198,133" fill="#2563eb" />
  </g>
</svg>