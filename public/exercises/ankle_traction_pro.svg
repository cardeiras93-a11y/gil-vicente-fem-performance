<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Limpo e Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Tapete Azul -->
  <polygon points="35,118 285,118 305,162 15,162" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sombra Projetada -->
  <ellipse cx="160" cy="150" rx="80" ry="10" fill="#0f172a" opacity="0.22" />

  <!-- Ponto de Fixação no Sofá à Direita -->
  <rect x="280" y="55" width="14" height="95" rx="3" fill="#334155" filter="url(#dropShadow)" />

  <!-- Atleta Deitada de Costas no Tapete (Descompressão e Relaxamento Articular) -->
  <!-- Cabeça no Tapete -->
  <circle cx="65" cy="138" r="8" fill="#d97706" />
  <path d="M60,134 C60,128 70,128 70,134 L68,140 L62,140 Z" fill="#78350f" />

  <!-- Tronco no Chão / Camisola Gil Vicente FC -->
  <path d="M72,138 L130,135 L130,146 L72,146 Z" fill="url(#kitGrad)" />

  <!-- Calções / Bacia -->
  <path d="M128,133 L158,131 L156,146 L128,146 Z" fill="#0f172a" />

  <!-- Perna Esquerda Fletida no Chão (Conforto Lombar) -->
  <path d="M150,134 L170,118 L180,140" stroke="#d97706" stroke-width="6" stroke-linecap="round" fill="none" />
  <ellipse cx="180" cy="142" rx="4" ry="2" fill="#ffffff" />

  <!-- Perna Direita Estendida em Tração (Tríceps e Articulação em Relaxamento) -->
  <path d="M156,133 L220,131 L220,139 L156,141 Z" fill="#d97706" />

  <!-- Tornozelo e Pé com Banda Elástica Laranja no Calcanhar e Tálus -->
  <path d="M220,131 L234,124 L238,128 L224,138 Z" fill="#ffffff" filter="url(#dropShadow)" />

  <!-- Banda Laranja em Tração Longitudinal até ao Sofá -->
  <path d="M228,130 L280,118" stroke="#f97316" stroke-width="4" stroke-linecap="round" />

  <!-- Braços Relaxados ao lado do corpo -->
  <path d="M85,140 L115,142" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />

  <!-- Vetores de Descompressão (Setas de Tração Suave) -->
  <g filter="url(#dropShadow)">
    <path d="M236,118 L256,114" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="253,110 262,113 255,118" fill="#2563eb" />
    <!-- Círculo de Alívio Articular no Tornozelo -->
    <circle cx="225" cy="132" r="6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2" />
  </g>
</svg>
