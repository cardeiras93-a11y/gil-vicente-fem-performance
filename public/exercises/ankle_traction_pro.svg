<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(210, 10)">
    <rect x="0" y="0" width="102" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, sans-serif" font-weight="900" text-anchor="middle">DORSIFLEXÃO</text>
  </g>


  <ellipse cx="145" cy="148" rx="20" ry="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <rect x="25" y="60" width="12" height="90" fill="url(#poleGrad)" rx="2" />
  <circle cx="31" cy="138" r="4" fill="#0284c7" />
  <line x1="31" y1="138" x2="140" y2="138" stroke="#ea580c" stroke-width="5" stroke-linecap="round">
    <animate attributeName="x2" values="140; 160; 160; 140" keyTimes="0; 0.45; 0.65; 1" dur="2.6s" repeatCount="indefinite" />
  </line>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 145 146; 22 145 146; 22 145 146; 0 145 146" keyTimes="0; 0.45; 0.65; 1" dur="2.6s" repeatCount="indefinite" />
    <line x1="145" y1="146" x2="145" y2="92" stroke="#d97706" stroke-width="9" stroke-linecap="round" />
    <circle cx="145" cy="92" r="6" fill="#0f172a" />
    <line x1="145" y1="92" x2="95" y2="78" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
    <circle cx="95" cy="78" r="7" fill="#0f172a" />
  </g>
  <path d="M125,72 Q158,74 175,90 M170,82 L175,90 L166,92" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

</svg>
