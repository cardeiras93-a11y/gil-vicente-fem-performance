<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Gym floor -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(205, 10)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#0284c7" />
    <text x="14" y="8" fill="#334155" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">GOOD MORNING C/ BANDA</text>
  </g>

  <!-- Pés e ponto de ancoragem sob os pés -->
  <ellipse cx="140" cy="146" rx="14" ry="4" fill="#0284c7" />

  <!-- Membros Inferiores em semi-flexão fixa (Dobradiça de anca) -->
  <g>
    <!-- Tíbias estáveis -->
    <path d="M140 146 L135 110" stroke="#0f172a" stroke-width="11" stroke-linecap="round" />
    <!-- Coxas recuando a bacia na descida -->
    <path d="M135 110 L115 85" stroke="#1e293b" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M135 110 L130 75; M135 110 L108 92; M135 110 L130 75" dur="2.6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Tronco rígido mantendo coluna neutra na dobradiça de anca -->
  <g id="trunkHinge">
    <!-- Tronco do quadril ao ombro -->
    <path d="M130 75 L130 38" stroke="url(#kitGrad)" stroke-width="14" stroke-linecap="round">
      <animate attributeName="d" values="M130 75 L130 38; M108 92 L165 78; M130 75 L130 38" dur="2.6s" repeatCount="indefinite" />
    </path>
    <!-- Cabeça alinhada com a coluna -->
    <circle cx="130" cy="26" r="9" fill="#f6ad55">
      <animate attributeName="cx" values="130; 178; 130" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="cy" values="26; 74; 26" dur="2.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Banda Elástica sob os pés até ao topo das costas/trapézios -->
  <path d="M140 146 L130 42" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" fill="none">
    <animate attributeName="d" values="M140 146 L130 42; M140 146 L165 80; M140 146 L130 42" dur="2.6s" repeatCount="indefinite" />
  </path>

  <!-- Braços segurando a banda nos ombros -->
  <path d="M130 45 Q120 50 125 58" stroke="#f6ad55" stroke-width="5" stroke-linecap="round" fill="none">
    <animate attributeName="d" values="M130 45 Q120 50 125 58; M165 80 Q155 85 160 92; M130 45 Q120 50 125 58" dur="2.6s" repeatCount="indefinite" />
  </path>

  <!-- Destaque ERETORES DA ESPINHA LOMBAR -->
  <g transform="translate(110, 48)">
    <rect x="0" y="0" width="135" height="18" rx="9" fill="#0f172a" fill-opacity="0.85" />
    <text x="67" y="12" fill="#38bdf8" font-size="8" font-weight="900" font-family="Inter, sans-serif" text-anchor="middle">ERETORES DA ESPINHA • ISOTÓNICO</text>
  </g>
</svg>
