<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Sombra no solo -->
  <ellipse cx="160" cy="150" rx="45" ry="6" fill="#0f172a" opacity="0.2" />

  <!-- Pernas em Pé Estáveis -->
  <line x1="152" y1="102" x2="148" y2="145" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" />
  <line x1="168" y1="102" x2="172" y2="145" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <rect x="142" y="142" width="16" height="5" rx="2.5" fill="#ffffff" />
  <rect x="168" y="142" width="16" height="5" rx="2.5" fill="#ffffff" />

  <!-- Calções / Bacia -->
  <path d="M148,88 L172,88 L170,104 L150,104 Z" fill="#0f172a" />

  <!-- Tronco com Ligeira Inclinação à Frente (10° - Ângulo Ideal Escapular) -->
  <path d="M148,52 L172,52 L170,90 L150,90 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo -->
  <circle cx="160" cy="40" r="8" fill="#d97706" />
  <path d="M154,36 C154,30 166,30 166,36 Z" fill="#78350f" />

  <!-- Braço Esquerdo Elevado Lateralmente até à Altura dos Ombros -->
  <path d="M148,54 L110,58 L90,62" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
  <!-- Haltere Esquerdo -->
  <line x1="88" y1="52" x2="88" y2="72" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" />
  <circle cx="88" cy="52" r="3.5" fill="#334155" />
  <circle cx="88" cy="72" r="3.5" fill="#334155" />

  <!-- Braço Direito Elevado Lateralmente -->
  <path d="M172,54 L210,58 L230,62" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <!-- Haltere Direito -->
  <line x1="232" y1="52" x2="232" y2="72" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" />
  <circle cx="232" cy="52" r="3.5" fill="#334155" />
  <circle cx="232" cy="72" r="3.5" fill="#334155" />

  <!-- Foco Muscular nos Deltoides Laterais -->
  <circle cx="146" cy="54" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="174" cy="54" r="5" fill="#ef4444" opacity="0.8" />

  <!-- Setas Curvas de Abdução dos Braços -->
  <g filter="url(#dropShadow)">
    <path d="M125,82 Q108,76 96,68" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="96,74 91,66 100,67" fill="#2563eb" />
    <path d="M195,82 Q212,76 224,68" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="220,67 229,66 224,74" fill="#2563eb" />
  </g>
</svg>