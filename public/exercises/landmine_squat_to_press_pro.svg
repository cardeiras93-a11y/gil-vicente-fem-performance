<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes barAndPress {
      0%, 100% {
        /* No agachamento: barra baixa ao peito */
        transform: rotate(-14deg);
      }
      45%, 65% {
        /* No topo: press explosivo de ombros */
        transform: rotate(3deg);
      }
    }
    @keyframes athleteSquatToStand {
      0%, 100% {
        /* No agachamento: bacia e tronco descidos */
        transform: translate(0px, 14px);
      }
      45%, 65% {
        /* No topo em extensão completa */
        transform: translate(0px, 0px);
      }
    }
    @keyframes armsExtendPress {
      0%, 100% {
        /* Braços fletidos junto ao peito */
        transform: translate(-10px, 14px) scale(0.9);
      }
      45%, 65% {
        /* Braços estendidos em press overhead */
        transform: translate(0px, 0px) scale(1);
      }
    }
    @keyframes pressArrowDrive {
      0%, 100% {
        transform: translate(-10px, 8px);
        opacity: 0.4;
      }
      45%, 65% {
        transform: translate(6px, -6px);
        opacity: 1;
      }
    }
    .anim-bar {
      transform-origin: 75px 145px;
      animation: barAndPress 2.8s ease-in-out infinite;
    }
    .anim-body-squat {
      animation: athleteSquatToStand 2.8s ease-in-out infinite;
    }
    .anim-arms-press {
      transform-origin: 160px 65px;
      animation: armsExtendPress 2.8s ease-in-out infinite;
    }
    .anim-arrow-press {
      animation: pressArrowDrive 2.8s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-bar, .anim-body-squat, .anim-arms-press, .anim-arrow-press {
        animation: none !important;
      }
    }
  </style>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1" />

  <!-- Base Landmine no Solo (Esquerda) -->
  <rect x="64" y="141" width="24" height="10" rx="3" fill="#0f172a" filter="url(#dropShadow)" />
  <circle cx="75" cy="144" r="4.5" fill="#334155" />

  <!-- Sombra no Solo dos Pés da Atleta -->
  <ellipse cx="170" cy="151" rx="45" ry="6" fill="#0f172a" opacity="0.22" />

  <!-- Pés Fixos no Solo à Largura dos Ombros -->
  <rect x="140" y="146" width="18" height="5" rx="2.5" fill="#ffffff" />
  <rect x="142" y="147" width="14" height="2" fill="#ef4444" />
  <rect x="176" y="146" width="18" height="5" rx="2.5" fill="#ffffff" />
  <rect x="178" y="147" width="14" height="2" fill="#ef4444" />

  <!-- CORPO DINÂMICO QUE AGACHA E SOBE (SQUAT TO STAND) -->
  <g class="anim-body-squat">
    <!-- Pernas (Visão 3/4 com agachamento profundo e extensão) -->
    <!-- Perna Esquerda (Trás) -->
    <path d="M154,104 L146,126 L148,148" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Perna Direita (Frente) -->
    <path d="M172,104 L182,126 L184,148" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Calções / Bacia -->
    <path d="M146,92 L180,92 L176,112 L150,112 Z" fill="#0f172a" />

    <!-- Tronco (Camisola Gil Vicente FC) -->
    <path d="M148,58 L178,56 L174,96 L146,96 Z" fill="url(#kitGrad)" />
    <path d="M152,58 L162,58 L160,74 L150,74 Z" fill="#ef4444" opacity="0.85" />

    <!-- Cabeça e Cabelo (Olhar focado na subida da barra) -->
    <circle cx="162" cy="42" r="8" fill="#d97706" />
    <path d="M156,38 C156,30 168,30 168,38 L166,45 L158,45 Z" fill="#78350f" />
    <path d="M168,40 Q176,43 174,49" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Destaque Muscular Quadricípite & Glúteo -->
    <circle cx="176" cy="118" r="4.5" fill="#ef4444" opacity="0.8" />
  </g>

  <!-- BARRA LANDMINE COM ANILHA (DINÂMICA: DO PEITO AO OVERHEAD PRESS) -->
  <g class="anim-bar">
    <!-- Barra Olímpica -->
    <line x1="75" y1="145" x2="215" y2="32" stroke="url(#barGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
    <!-- Anilha de Carga -->
    <rect x="194" y="42" width="8" height="28" rx="2" transform="rotate(38 198 56)" fill="#1e293b" />
    <circle cx="202" cy="53" r="3" fill="#ef4444" />
  </g>

  <!-- BRAÇOS QUE EXECUTAM O PRESS DE OMBROS NO TOPO -->
  <g class="anim-arms-press">
    <!-- Braço Esquerdo (Pega ao Peito / Press) -->
    <path d="M152,64 L180,50 L206,38" stroke="#b45309" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Braço Direito (Pega na Barra) -->
    <path d="M172,62 L190,48 L210,36" stroke="#d97706" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Mãos no Colarinho da Barra -->
    <ellipse cx="208" cy="37" rx="5" ry="4.5" fill="#0f172a" />

    <!-- Destaque Deltoides (Ombros) -->
    <circle cx="174" cy="60" r="4.5" fill="#ef4444" opacity="0.85" />
  </g>

  <!-- Vetores de Movimento: Seta de Subida do Squat + Seta do Press Overhead -->
  <g filter="url(#dropShadow)" class="anim-arrow-press">
    <!-- Seta do Press Diagonal -->
    <line x1="204" y1="44" x2="232" y2="22" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="227,20 236,20 233,29" fill="#2563eb" />
    <text x="212" y="16" fill="#1e3a8a" font-size="8.5" font-weight="900" letter-spacing="0.5">SQUAT &amp; PRESS</text>
  </g>
</svg>
