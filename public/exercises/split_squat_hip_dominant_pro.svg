<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <ellipse cx="160" cy="154" rx="65" ry="7" fill="#0f172a" opacity="0.22" />
  <!-- Posição de Lunge / Split Squat com Mini-Banda -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -18; 0 0; 0 0; 0 -18" keyTimes="0; 0.4; 0.65; 1" dur="2.8s" repeatCount="indefinite" />
    <path d="M152,58 L168,58 L165,96 L155,96 Z" fill="url(#kitGrad)" />
    <circle cx="160" cy="46" r="7.5" fill="#d97706" />
    <ellipse cx="160" cy="96" rx="10" ry="7" fill="#0f172a" />
    <!-- Perna Avançada a 90° -->
    <line x1="162" y1="96" x2="188" y2="118" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <line x1="188" y1="118" x2="188" y2="150" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
    <ellipse cx="188" cy="150" rx="9" ry="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <!-- Perna Recuada com Joelho Perto do Solo -->
    <line x1="158" y1="96" x2="135" y2="124" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
    <line x1="135" y1="124" x2="115" y2="148" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" />
    <ellipse cx="114" cy="148" rx="5" ry="4" fill="#64748b" />
    <!-- Mini-Banda nos Joelhos -->
    <line x1="135" y1="124" x2="188" y2="118" stroke="#ea580c" stroke-width="4.5" />
  </g>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">SPLIT SQUAT</text>
  </g>
</svg>
