<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="35,122 285,122 305,162 15,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="150" rx="75" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Perna Traseira em Split Squat -->
  <path d="M138,100 L114,132 L86,142" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <ellipse cx="84" cy="144" rx="6" ry="4" fill="#e2e8f0" />

  <!-- Perna Dianteira com TÍBIA VERTICAL (Proteção Rotuliana e Foco Glúteo/Isquio) -->
  <path d="M144,98 L192,102 L192,146" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="188" y="144" width="18" height="6" rx="3" fill="#ffffff" />

  <!-- Minibanda nos Joelhos para Estabilidade Anti-Valgo -->
  <line x1="126" y1="118" x2="190" y2="106" stroke="#dc2626" stroke-width="4" stroke-dasharray="4,2" />

  <!-- Calções e Glúteo Recuado -->
  <path d="M130,86 L154,88 L150,104 L126,102 Z" fill="#0f172a" />
  <circle cx="136" cy="96" r="6" fill="#ef4444" opacity="0.8" />

  <!-- Tronco Inclinado 30° à Frente (Foco Cadeia Posterior) -->
  <path d="M136,88 L156,52 L172,58 L152,94 Z" fill="url(#kitGrad)" />

  <!-- Cabeça -->
  <circle cx="168" cy="42" r="8" fill="#d97706" />
  <path d="M161,38 C161,32 175,32 175,38 Z" fill="#78350f" />

  <!-- Braço Segurando Halteres -->
  <path d="M162,64 L166,112" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
  <g filter="url(#dropShadow)">
    <rect x="154" y="108" width="7" height="16" rx="2" fill="#0f172a" />
    <rect x="171" y="108" width="7" height="16" rx="2" fill="#0f172a" />
    <line x1="161" y1="116" x2="171" y2="116" stroke="#94a3b8" stroke-width="4" />
  </g>

  <!-- Guia de Tíbia 90° Vertical -->
  <line x1="204" y1="100" x2="204" y2="144" stroke="#2563eb" stroke-width="2" stroke-dasharray="3,3" />
</svg>
