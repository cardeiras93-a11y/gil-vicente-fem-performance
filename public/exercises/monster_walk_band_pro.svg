<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <ellipse cx="160" cy="154" rx="75" ry="8" fill="#0f172a" opacity="0.2" />
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 18 -4; 0 0; -18 -4; 0 0" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="3s" repeatCount="indefinite" />
    <path d="M148,56 C148,50 172,50 172,56 L168,96 C160,98 154,98 148,96 Z" fill="url(#kitGrad)" />
    <circle cx="160" cy="42" r="7.5" fill="#d97706" />
    <ellipse cx="158" cy="96" rx="14" ry="8" fill="#0f172a" />
    <line x1="150" y1="96" x2="135" y2="124" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <line x1="166" y1="96" x2="185" y2="124" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <line x1="135" y1="124" x2="132" y2="148" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <line x1="185" y1="124" x2="190" y2="148" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <ellipse cx="130" cy="150" rx="9" ry="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <ellipse cx="192" cy="150" rx="9" ry="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <line x1="133" y1="140" x2="189" y2="140" stroke="#ea580c" stroke-width="5" stroke-linecap="round">
      <animate attributeName="stroke-width" values="4; 6; 4; 6; 4" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">MONSTER WALK</text>
  </g>
</svg>
