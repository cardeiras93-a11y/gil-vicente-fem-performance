<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes dislocateFrontBack {
      0% {
        transform: rotate(-128deg);
      }
      50% {
        transform: rotate(128deg);
      }
      100% {
        transform: rotate(-128deg);
      }
    }
    @keyframes arrowPulse {
      0%, 100% {
        opacity: 0.4;
        transform: scale(0.95);
      }
      50% {
        opacity: 1;
        transform: scale(1.05);
      }
    }
    .anim-dislocate-arm {
      transform-origin: 160px 68px;
      animation: dislocateFrontBack 3.4s ease-in-out infinite;
    }
    .anim-pulse {
      transform-origin: 160px 25px;
      animation: arrowPulse 3.4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-dislocate-arm, .anim-pulse {
        animation: none !important;
      }
    }
  </style>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Sombra Projetada do Atleta de Perfil -->
  <ellipse cx="160" cy="152" rx="42" ry="7" fill="#0f172a" opacity="0.22" />

  <!-- Trajetória Completa em Arco Sagital (Frente para Trás por Cima da Cabeça) -->
  <path d="M 120,110 C 95,15 225,15 200,110" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4" fill="none" opacity="0.75" />

  <!-- Setas Curvas Indicativas de Frente ⇄ Trás -->
  <g class="anim-pulse" filter="url(#dropShadow)">
    <!-- Seta para Trás -->
    <path d="M 148,22 C 156,20 164,20 172,22" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="170,18 178,24 169,27" fill="#2563eb" />
    <!-- Seta para a Frente -->
    <path d="M 172,30 C 164,32 156,32 148,30" stroke="#0284c7" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8" />
    <polygon points="150,34 142,28 151,25" fill="#0284c7" />
  </g>

  <!-- Marcadores Textuais Anatómicos Discretos -->
  <text x="106" y="125" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#64748b" text-anchor="middle">FRENTE</text>
  <text x="214" y="125" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#64748b" text-anchor="middle">TRÁS</text>

  <!-- GHOSTING: Posição Anterior da Banda (Frente das Coxas) -->
  <line x1="160" y1="68" x2="120" y2="108" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.35" stroke-dasharray="3,3" />
  <circle cx="120" cy="108" r="4" fill="#94a3b8" opacity="0.35" />

  <!-- GHOSTING: Posição Posterior da Banda (Atrás das Costas) -->
  <line x1="160" y1="68" x2="200" y2="108" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.35" stroke-dasharray="3,3" />
  <circle cx="200" cy="108" r="4" fill="#94a3b8" opacity="0.35" />

  <!-- ========================================== -->
  <!-- CORPO DO ATLETA EM VISTA LATERAL (PERFIL) -->
  <!-- ========================================== -->

  <!-- Perna Posterior (Profundidade) -->
  <path d="M 164,102 L 167,126 L 169,148 L 161,148" stroke="#b45309" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <ellipse cx="165" cy="150" rx="7" ry="3.5" fill="#e2e8f0" />

  <!-- Perna Anterior (Principal) -->
  <path d="M 158,102 L 156,126 L 154,148 L 145,148" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <ellipse cx="150" cy="150" rx="7.5" ry="3.5" fill="#ffffff" />
  <ellipse cx="150" cy="150" rx="4" ry="2" fill="#ef4444" />

  <!-- Calções / Bacia em Perfil -->
  <path d="M 150,96 C 150,92 170,92 170,96 L 168,108 C 162,110 156,110 150,108 Z" fill="#0f172a" />

  <!-- Tronco / Camisola Gil Vicente FC em Perfil -->
  <path d="M 152,66 C 148,74 148,88 150,98 L 168,98 C 172,88 172,74 168,66 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Pescoço em Perfil (Olhar focado para a Frente / Esquerda) -->
  <path d="M 158,66 L 158,58" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <!-- Cabeça -->
  <circle cx="158" cy="50" r="8" fill="#d97706" />
  <!-- Perfil do Rosto / Nariz -->
  <path d="M 151,48 L 148,51 L 152,53" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Cabelo / Penteado -->
  <path d="M 153,44 C 156,41 165,41 166,45 L 166,52 C 164,52 163,48 160,46 Z" fill="#78350f" />

  <!-- Articulação Escapuloumeral (Ombro) -->
  <circle cx="160" cy="68" r="5" fill="#1e3a8a" />
  <circle cx="160" cy="68" r="2.5" fill="#38bdf8" />

  <!-- ======================================================== -->
  <!-- BRAÇO & BANDA DINÂMICOS (MOVIMENTO SAGITAL FRENTE ⇄ TRÁS) -->
  <!-- ======================================================== -->
  <g class="anim-dislocate-arm">
    <!-- Braço Esticado Segurando a Banda (Comprimento 52px) -->
    <!-- Desenha o braço a apontar verticalmente para cima (0° = Topo) -->
    <line x1="160" y1="68" x2="160" y2="18" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
    
    <!-- Mão Segurando a Banda -->
    <circle cx="160" cy="18" r="4.5" fill="#b45309" />
    
    <!-- Banda Elástica em Tensão (Vista de Topo/Perspetiva Ligeira) -->
    <line x1="150" y1="18" x2="170" y2="18" stroke="#f97316" stroke-width="5" stroke-linecap="round" />
    <line x1="150" y1="18" x2="170" y2="18" stroke="#ea580c" stroke-width="2" stroke-linecap="round" />
    
    <!-- Destaque Muscular Ativo nos Deltoides / Peitoral / Trapézio -->
    <circle cx="160" cy="56" r="3.5" fill="#ef4444" opacity="0.85" />
  </g>

  <!-- Tag de Movimento Biomecânico -->
  <g opacity="0.9">
    <rect x="202" y="14" width="108" height="18" rx="4" fill="#1e293b" />
    <text x="256" y="26" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#38bdf8" text-anchor="middle">MOVIMENTO FRENTE ⇄ TRÁS</text>
  </g>
</svg>
