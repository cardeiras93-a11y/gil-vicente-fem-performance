<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,160 10,160" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <ellipse cx="160" cy="154" rx="75" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Rolo de Espuma nos Isquiotibiais com Deslize -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -14,0; 0,0" dur="2.4s" repeatCount="indefinite" />
    <rect x="142" y="130" width="24" height="16" rx="4" fill="url(#rollerGrad)" filter="url(#dropShadow)" />
    <line x1="147" y1="131" x2="147" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="154" y1="131" x2="154" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="161" y1="131" x2="161" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Atleta em Deslize sobre a Face Posterior da Coxa -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 14,0; 0,0" dur="2.4s" repeatCount="indefinite" />

    <!-- Apoio dos Braços -->
    <path d="M78,102 L70,136" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <circle cx="70" cy="138" r="3.5" fill="#d97706" />

    <!-- Tronco e Cabeça -->
    <circle cx="102" cy="78" r="8" fill="#d97706" />
    <path d="M97,74 C97,68 107,68 107,74 L105,80 L99,80 Z" fill="#78350f" />
    <path d="M90,86 C90,80 114,80 114,86 L110,120 C102,122 94,122 90,120 Z" fill="url(#kitGrad)" />

    <!-- Bacia / Glúteo Elevado do Chão -->
    <path d="M98,118 L126,116 L120,132 L98,132 Z" fill="#0f172a" />

    <!-- Isquiotibiais em Cima do Rolo -->
    <path d="M120,124 L178,126" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
    <!-- Joelho e Canela Estendida no Ar -->
    <path d="M178,126 L238,132" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
    <ellipse cx="240" cy="132" rx="4.5" ry="3.5" fill="#ffffff" />

    <!-- Perna Oposta Fletida no Solo para Impulsão e Controlo de Pressão -->
    <path d="M120,118 L152,106 L175,138" stroke="#b45309" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />
    <circle cx="175" cy="139" r="3.5" fill="#ffffff" />
  </g>

  <!-- Vetores de Deslize dos Isquios -->
  <g filter="url(#dropShadow)">
    <path d="M135,112 L175,112" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.2s" repeatCount="indefinite" />
    </path>
    <polygon points="137,109 131,112 137,115" fill="#38bdf8" />
    <polygon points="173,109 179,112 173,115" fill="#38bdf8" />
    <!-- Zona de Fáscia Posterior -->
    <ellipse cx="154" cy="125" rx="10" ry="3" fill="#ef4444" opacity="0.5">
      <animate attributeName="opacity" values="0.3; 0.75; 0.3" dur="1.5s" repeatCount="indefinite" />
    </ellipse>
  </g>
  <!-- Live Loop Indicator -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.88" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>