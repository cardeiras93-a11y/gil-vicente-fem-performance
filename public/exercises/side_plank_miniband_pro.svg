<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Gym floor -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(205, 10)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#0284c7" />
    <text x="14" y="8" fill="#334155" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">PRANCHA LATERAL C/ MINI-BANDA</text>
  </g>

  <!-- Solo colchonete -->
  <rect x="50" y="142" width="220" height="5" rx="2.5" fill="#334155" />

  <!-- Atleta em Prancha Lateral apoiada no antebraço e joelhos fletidos -->
  <!-- Antebraço esquerdo de suporte -->
  <path d="M100 142 L130 142" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <path d="M115 142 L105 102" stroke="#f6ad55" stroke-width="8" stroke-linecap="round" />

  <!-- Tronco rígido elevado da anca com pulso isométrico anti-flexão -->
  <g id="sidePlankTrunk">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="2s" repeatCount="indefinite" />
    
    <!-- Cabeça e ombros -->
    <circle cx="95" cy="85" r="9" fill="#f6ad55" />
    <!-- Tronco do ombro à anca (linha reta diagonal anti-queda) -->
    <path d="M105 102 L175 116" stroke="url(#kitGrad)" stroke-width="15" stroke-linecap="round" />

    <!-- Coxa de baixo apoiada no joelho fletido -->
    <path d="M175 116 L220 138" stroke="#0f172a" stroke-width="11" stroke-linecap="round" />
    <path d="M220 138 L245 138" stroke="#1e293b" stroke-width="9" stroke-linecap="round" />

    <!-- Coxa de cima em abdução ligeira contra mini-banda -->
    <path d="M175 116 L218 122" stroke="#1e3a8a" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" values="M175 116 L218 122; M175 116 L216 110; M175 116 L218 122" dur="2.4s" repeatCount="indefinite" />
    </path>
    <path d="M218 122 L245 125" stroke="#1e293b" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" values="M218 122 L245 125; M216 110 L242 113; M218 122 L245 125" dur="2.4s" repeatCount="indefinite" />
    </path>

    <!-- Mini-banda nos joelhos -->
    <line x1="216" y1="135" x2="218" y2="122" stroke="#ef4444" stroke-width="4">
      <animate attributeName="y2" values="122; 110; 122" dur="2.4s" repeatCount="indefinite" />
    </line>

    <!-- Braço de cima apoiado na anca -->
    <path d="M105 102 Q140 92 165 114" stroke="#f6ad55" stroke-width="6" fill="none" stroke-linecap="round" />
  </g>

  <!-- Destaque Quadrado Lombar & Isometria -->
  <g transform="translate(130, 48)">
    <rect x="0" y="0" width="130" height="18" rx="9" fill="#0f172a" fill-opacity="0.85" />
    <text x="65" y="12" fill="#38bdf8" font-size="8" font-weight="900" font-family="Inter, sans-serif" text-anchor="middle">QUADRADO LOMBAR • ISOMETRIA</text>
  </g>
</svg>
