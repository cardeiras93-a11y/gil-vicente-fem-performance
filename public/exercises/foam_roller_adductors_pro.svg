<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,160 10,160" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <ellipse cx="160" cy="154" rx="75" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Rolo de Espuma Longitudinal sob o Adutor com Deslize Lateral -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 12,0; 0,0" dur="2.4s" repeatCount="indefinite" />
    <rect x="180" y="126" width="16" height="26" rx="4" fill="url(#rollerGrad)" filter="url(#dropShadow)" />
    <line x1="181" y1="132" x2="195" y2="132" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="181" y1="139" x2="195" y2="139" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="181" y1="146" x2="195" y2="146" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Atleta Deitada de Barriga para Baixo com Perna em Abdução a 90° sobre o Rolo -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -12,0; 0,0" dur="2.4s" repeatCount="indefinite" />

    <!-- Antebraços a Apoiar o Peso -->
    <path d="M70,132 L92,132 L102,114" stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="70" cy="132" r="3.5" fill="#d97706" />

    <!-- Tronco e Cabeça -->
    <circle cx="95" cy="100" r="8" fill="#d97706" />
    <path d="M90,96 C90,90 100,90 100,96 L98,102 L92,102 Z" fill="#78350f" />
    <path d="M98,104 L146,108 L142,122 L94,120 Z" fill="url(#kitGrad)" />

    <!-- Bacia / Calções -->
    <path d="M140,110 L165,112 L160,126 L136,124 Z" fill="#0f172a" />

    <!-- Perna de Repouso (Estendida Atrás) -->
    <path d="M158,118 L218,122" stroke="#b45309" stroke-width="6.5" stroke-linecap="round" opacity="0.8" />
    <ellipse cx="220" cy="122" rx="4" ry="3" fill="#ffffff" />

    <!-- Perna Ativa (Adutor Aberto a 90° Sobre o Rolo) -->
    <path d="M152,120 L195,134" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
    <!-- Canela a 90° descendo pelo tapete -->
    <path d="M195,134 L205,152" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" />
    <ellipse cx="206" cy="153" rx="4" ry="3" fill="#ffffff" />
  </g>

  <!-- Vetores de Deslize Adutor -->
  <g filter="url(#dropShadow)">
    <path d="M165,142 L198,142" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.2s" repeatCount="indefinite" />
    </path>
    <polygon points="167,139 161,142 167,145" fill="#38bdf8" />
    <polygon points="196,139 202,142 196,145" fill="#38bdf8" />
    <!-- Foco no Adutor Magno e Longo -->
    <circle cx="182" cy="130" r="5" fill="#ef4444" opacity="0.6">
      <animate attributeName="r" values="3; 6; 3" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
  <!-- Live Loop Indicator -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.88" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>