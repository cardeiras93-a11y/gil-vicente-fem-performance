<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background / Solo Pavilhão -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <!-- Linha de Chão com marcação amarela de ginásio GVFC -->
  <line x1="0" y1="152" x2="320" y2="152" stroke="#1e293b" stroke-width="2" />
  <rect x="0" y="152" width="320" height="28" fill="#0b1120" />
  <!-- Marcações amarelas de agilidade no chão (como na foto) -->
  <rect x="110" y="156" width="35" height="16" fill="none" stroke="#eab308" stroke-width="2.5" opacity="0.85" rx="1" />
  <rect x="155" y="156" width="35" height="16" fill="none" stroke="#eab308" stroke-width="2.5" opacity="0.85" rx="1" />
  <rect x="200" y="156" width="35" height="16" fill="none" stroke="#eab308" stroke-width="2.5" opacity="0.85" rx="1" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(202, 10)">
    <rect x="0" y="0" width="108" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#a855f7">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="60" y="14" fill="#c084fc" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#8b5cf6" />
    <text x="14" y="8" fill="#e2e8f0" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">OSCILAÇÕES DE FLEXORES DA ANCA C/ BANDA</text>
  </g>

  <!-- Ponto de ancoragem fixo atrás (Banco de Ginásio / Rack) -->
  <g id="bench-anchor" opacity="0.9">
    <!-- Estrutura metálica branca/cinza -->
    <rect x="15" y="105" width="40" height="8" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    <line x1="22" y1="113" x2="16" y2="152" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" />
    <line x1="48" y1="113" x2="54" y2="152" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" />
    <!-- Almofada do banco -->
    <rect x="10" y="98" width="50" height="8" rx="3" fill="#1e293b" />
    <!-- Ponto de fixação da banda -->
    <circle cx="36" cy="116" r="4.5" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- Sombra no chão do atleta -->
  <ellipse cx="205" cy="152" rx="22" ry="4.5" fill="#000000" opacity="0.6" />

  <!-- ATLETA (Postura de Sprint e Estabilidade Unipodal) -->
  <!-- Perna de Apoio (Direita - Base sólida no solo) -->
  <g id="support-leg">
    <!-- Pé com sapatilha verde/vermelha (como na foto oficial GVFC) -->
    <ellipse cx="205" cy="151" rx="12" ry="4.5" fill="#059669" />
    <path d="M198 147 L214 148 L217 152 L196 152 Z" fill="#10b981" />
    <path d="M208 149 L213 151" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <!-- Meia branca -->
    <rect x="200" y="137" width="9" height="11" rx="2" fill="#f8fafc" />
    <!-- Gémeo e tíbia sólida -->
    <path d="M204 140 L203 115" stroke="#f6ad55" stroke-width="8.5" stroke-linecap="round" />
    <!-- Joelho ligeiramente fletido / travado em estabilidade -->
    <circle cx="203" cy="113" r="5" fill="#ed8936" />
    <!-- Coxa / Quadricípete em tensão isométrica anti-gravitacional -->
    <path d="M203 113 L198 78" stroke="#0f172a" stroke-width="11" stroke-linecap="round" />
  </g>

  <!-- Calções Pretos de Treino e Tronco -->
  <path d="M185 75 L206 75 L202 96 L182 94 Z" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
  <!-- T-shirt de treino (Preta GVFC) -->
  <path d="M178 40 L204 42 L202 76 L180 75 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  
  <!-- Cabeça e Pescoço (Olhar focado horizontal) -->
  <circle cx="192" cy="27" r="8.5" fill="#f6ad55" />
  <path d="M186 23 C186 18, 198 18, 198 24 C195 23, 190 23, 186 23 Z" fill="#1e293b" />
  <path d="M190 35 L191 41" stroke="#f6ad55" stroke-width="4.5" />

  <!-- Braços em Mecânica de Corrida / Equilíbrio -->
  <!-- Braço Posterior -->
  <path d="M198 44 L212 58 L218 52" stroke="#f6ad55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Braço Anterior (fletido a 90° ao peito) -->
  <path d="M182 44 L170 56 L175 42" stroke="#f6ad55" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- GRUPO ANIMADO: PERNA ELEVADA + BANDA ELÁSTICA EM OSCILAÇÃO RÁPIDA -->
  <!-- As oscilações rápidas (pulsos a 60fps) caracterizam as Banded Hip Flexor Oscillations -->
  <g id="oscillating-hip-complex">
    <!-- Animação de micro-oscilações rítmicas e velozes (subida/descida em 0.5s de alta frequência) -->
    <animateTransform attributeName="transform" type="translate" 
      values="0,0; 0,-7; 0,1.5; 0,-6.5; 0,0" 
      keyTimes="0; 0.25; 0.5; 0.75; 1" 
      dur="0.55s" 
      repeatCount="indefinite" 
      calcMode="spline" 
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" />

    <!-- Banda Elástica Roxa ancorada no banco e laçada no tornozelo -->
    <!-- Faixa inferior da banda que vem do banco -->
    <path d="M36 116 Q85 119 148 126" stroke="url(#purpleBand)" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glowPurple)" />
    <!-- Faixa superior que passa no tornozelo e estica à frente -->
    <path d="M148 126 L164 127" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" />
    <path d="M164 127 Q220 134 300 140" stroke="url(#purpleBand)" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.85" filter="url(#glowPurple)" />

    <!-- Coxa Elevada (Hip Flexion a 90° - Posição de Ataque de Sprint) -->
    <path d="M185 78 L142 80" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    <path d="M180 80 L145 81" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    
    <!-- Joelho Fletido a 90° -->
    <circle cx="140" cy="80" r="6" fill="#f6ad55" />
    <circle cx="140" cy="80" r="3" fill="#ed8936" />

    <!-- Tíbia descendo em 90° (Vertical) -->
    <path d="M140 82 L146 122" stroke="#f6ad55" stroke-width="8.5" stroke-linecap="round" />
    <!-- Meia Branca com dobra -->
    <rect x="142" y="114" width="8" height="12" rx="2" fill="#f8fafc" />

    <!-- Pé e Sapatilha Verde (Dorsiflexão ativa - pé armado para sprint) -->
    <path d="M140 126 L158 124 L162 131 L138 132 Z" fill="#059669" />
    <circle cx="144" cy="128" r="3.5" fill="#10b981" />
    <path d="M152 126 L157 129" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />

    <!-- Laço da banda roxa no tornozelo (visível sobre a meia/sapatilha) -->
    <ellipse cx="148" cy="126" rx="5" ry="3.5" fill="#8b5cf6" stroke="#c084fc" stroke-width="1.2" />

    <!-- Setas de Oscilação Rápida no Joelho (Pulsos Verticais) -->
    <g transform="translate(118, 64)">
      <!-- Seta superior (impulso para cima) -->
      <path d="M6 8 L10 2 L14 8" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="10" y1="2" x2="10" y2="18" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
      <!-- Seta inferior (retorno elástico) -->
      <path d="M6 12 L10 18 L14 12" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Indicador de Tensão Muscular no Psoas / Flexores da Anca -->
    <circle cx="172" cy="74" r="5" fill="#ef4444" opacity="0.8">
      <animate attributeName="r" values="3.5;6.5;3.5" dur="0.55s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.55s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Box de Informação Técnica no Rodapé -->
  <g transform="translate(14, 134)">
    <rect x="0" y="0" width="128" height="18" rx="5" fill="#0f172a" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1" />
    <text x="64" y="12" fill="#c084fc" font-size="7.5" font-weight="800" font-family="Inter, sans-serif" text-anchor="middle">POTÊNCIA & RIGIDEZ EM 90° (SPRINT)</text>
  </g>

  <g transform="translate(196, 44)">
    <rect x="0" y="0" width="112" height="17" rx="5" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <text x="56" y="11.5" fill="#38bdf8" font-size="7" font-weight="800" font-family="Inter, sans-serif" text-anchor="middle">ESTABILIDADE PÉLVICA PURA</text>
  </g>
</svg>
