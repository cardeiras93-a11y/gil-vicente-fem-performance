<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <rect x="34" y="20" width="16" height="135" fill="url(#poleGrad)" filter="url(#dropShadow)" />
  <circle cx="42" cy="116" r="4.5" fill="#0284c7" />
  <ellipse cx="178" cy="154" rx="65" ry="8" fill="#0f172a" opacity="0.22" />
  <ellipse cx="168" cy="152" rx="10" ry="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <path d="M168,118 L168,150" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -16; 0 0; 0 0; 0 -16" keyTimes="0; 0.35; 0.75; 1" dur="3.2s" repeatCount="indefinite" />
    <path d="M168,118 L218,115 L214,126 L168,126 Z" fill="#d97706" />
    <path d="M206,106 L234,106 L230,128 L202,126 Z" fill="#0f172a" />
    <path d="M212,68 C212,64 236,64 236,68 L232,110 C224,112 216,112 212,110 Z" fill="url(#kitGrad)" />
    <path d="M218,78 L165,82" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <circle cx="163" cy="82" r="3.5" fill="#d97706" />
    <circle cx="224" cy="54" r="8" fill="#d97706" />
    <path d="M219,50 C219,44 229,44 229,50 L227,56 L221,56 Z" fill="#78350f" />
    <circle cx="168" cy="116" r="5" fill="#38bdf8" filter="url(#glowCyan)">
      <animate attributeName="opacity" values="0.3; 1; 1; 0.3" keyTimes="0; 0.35; 0.75; 1" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>
  <path d="M50,116 L168,116" stroke="#ea580c" stroke-width="5" stroke-linecap="round">
    <animate attributeName="stroke-width" values="4; 6; 6; 4" keyTimes="0; 0.35; 0.75; 1" dur="3.2s" repeatCount="indefinite" />
  </path>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">SPANISH SQUAT</text>
  </g>
</svg>
