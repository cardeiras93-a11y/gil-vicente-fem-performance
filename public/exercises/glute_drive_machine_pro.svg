<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="150" x2="320" y2="150" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(180, 10)">
    <rect x="0" y="0" width="132" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="73" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" text-anchor="middle">GLUTE DRIVE MACHINE</text>
  </g>

  <!-- Sombra no solo -->
  <ellipse cx="160" cy="154" rx="75" ry="7" fill="#0f172a" opacity="0.22" />

  <!-- Estrutura da Máquina de Glute Drive / Hip Thrust -->
  <rect x="70" y="100" width="30" height="48" rx="4" fill="url(#frameGrad)" />
  <rect x="65" y="90" width="38" height="14" rx="4" fill="#0284c7" filter="url(#dropShadow)" />
  <!-- Plataforma de Pés Inclinada -->
  <line x1="190" y1="145" x2="225" y2="135" stroke="#334155" stroke-width="8" stroke-linecap="round" />

  <!-- Pés Fixos e Canelas a 90° -->
  <rect x="195" y="132" width="18" height="6" rx="2.5" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <line x1="205" y1="134" x2="205" y2="100" stroke="#d97706" stroke-width="8" stroke-linecap="round" />

  <!-- Alavanca Móvel, Cinto e Bacia com Elevação Dinâmica -->
  <g>
    <!-- Rotação da extensão da anca com pausa isométrica no topo -->
    <animateTransform attributeName="transform" type="rotate" values="16 90 98; 0 90 98; 0 90 98; 16 90 98" keyTimes="0; 0.45; 0.65; 1" dur="2.7s" repeatCount="indefinite" />
    
    <!-- Tronco e Bacia da Atleta -->
    <path d="M88,94 L152,98" stroke="url(#kitGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="80" cy="90" r="7.5" fill="#d97706" />
    <ellipse cx="152" cy="98" rx="10" ry="8" fill="#0f172a" />
    
    <!-- Coxas em extensão terminal -->
    <line x1="152" y1="98" x2="205" y2="100" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
    
    <!-- Cinto Acolchoado / Barra com Discos de Peso da Máquina -->
    <rect x="145" y="85" width="14" height="26" rx="5" fill="#ef4444" filter="url(#dropShadow)" />
    <!-- Braço de Carga da Máquina com Disco -->
    <line x1="90" y1="110" x2="152" y2="98" stroke="#1e293b" stroke-width="5" />
    <circle cx="152" cy="74" r="13" fill="#0f172a" stroke="#ef4444" stroke-width="3" />
    <circle cx="152" cy="74" r="4" fill="#ffffff" />
  </g>
</svg>
