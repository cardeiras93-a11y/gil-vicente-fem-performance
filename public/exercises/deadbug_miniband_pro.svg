<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Gym floor -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(205, 10)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#ef4444" />
    <text x="14" y="8" fill="#334155" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">DEAD-BUG C/ MINI-BANDA</text>
  </g>

  
  <!-- Solo colchonete -->
  <rect x="40" y="140" width="240" height="6" rx="3" fill="#334155" />

  <!-- Atleta de costas no solo -->
  <circle cx="80" cy="132" r="9" fill="#f6ad55" />
  <path d="M88 136 L170 136" stroke="#1e3a8a" stroke-width="14" stroke-linecap="round" />

  <!-- Braço esquerdo vertical ao teto -->
  <path d="M120 136 L120 85" stroke="#f6ad55" stroke-width="7" stroke-linecap="round" />

  <!-- Braço direito descendo para trás alternado -->
  <path d="M120 136 L120 85" stroke="#f6ad55" stroke-width="7" stroke-linecap="round">
    <animate attributeName="d" values="M120 136 L120 85; M120 136 L70 132; M120 136 L120 85" dur="2.4s" repeatCount="indefinite" />
  </path>

  <!-- Perna esquerda a 90° fixa -->
  <path d="M170 136 L170 95 L205 95" stroke="#0f172a" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Perna direita estendendo à frente com mini-banda resistindo -->
  <path d="M170 136 L170 95 L205 95" stroke="#1e293b" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" values="M170 136 L170 95 L205 95; M170 136 L210 125 L245 125; M170 136 L170 95 L205 95" dur="2.4s" repeatCount="indefinite" />
  </path>

  <!-- Mini-banda nos pés -->
  <line x1="205" y1="95" x2="205" y2="95" stroke="#f59e0b" stroke-width="4">
    <animate attributeName="x2" values="205; 245; 205" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="95; 125; 95" dur="2.4s" repeatCount="indefinite" />
  </line>

  <text x="210" y="55" fill="#f59e0b" font-size="8.5" font-weight="900" font-family="Inter, sans-serif">ANTI-EXTENSÃO</text>

</svg>