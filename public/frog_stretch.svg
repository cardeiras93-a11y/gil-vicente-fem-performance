<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  
  <!-- Fundo Ginásio / Mat -->
  <rect width="400" height="225" fill="url(#bgGrad)" />
  <rect x="30" y="160" width="340" height="25" rx="6" fill="url(#matGrad)" />
  
  <!-- Linhas de Chão / Perspetiva -->
  <line x1="20" y1="185" x2="380" y2="185" stroke="#1e293b" stroke-width="2" />
  
  <!-- Figura Atleta - Frog Stretch (Vista Superior/Traseira) -->
  <!-- Cabeça / Tronco -->
  <ellipse cx="200" cy="95" rx="14" ry="14" fill="#cbd5e1" />
  <!-- Tronco / Ombros -->
  <path d="M175,115 C175,100 225,100 225,115 L220,150 L180,150 Z" fill="#1e40af" />
  <!-- Braços / Antebraços no chão -->
  <path d="M175,115 L145,145 L150,165" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M225,115 L255,145 L250,165" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" fill="none" />
  
  <!-- Bacia / Pélvis -->
  <ellipse cx="200" cy="148" rx="22" ry="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
  
  <!-- Pernas / Coxas Bem Afastadas (Adutores) -->
  <!-- Coxa Esquerda -->
  <path d="M180,148 L110,165" stroke="#ef4444" stroke-width="14" stroke-linecap="round" />
  <!-- Joelho Esquerdo e Pé -->
  <circle cx="108" cy="165" r="7" fill="#3b82f6" />
  <path d="M108,165 L85,150" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
  
  <!-- Coxa Direita -->
  <path d="M220,148 L290,165" stroke="#ef4444" stroke-width="14" stroke-linecap="round" />
  <!-- Joelho Direito e Pé -->
  <circle cx="292" cy="165" r="7" fill="#3b82f6" />
  <path d="M292,165 L315,150" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
  
  <!-- Setas de Oscilação Posterior (Rocking) -->
  <path d="M200,165 L200,180" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <polygon points="195,178 200,186 205,178" fill="#38bdf8" />
  
  <!-- Rótulo / Badge Ilustrativo -->
  <rect x="20" y="16" width="135" height="24" rx="6" fill="#1e3a8a" opacity="0.9" />
  <text x="28" y="32" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">FROG STRETCH</text>
  
  <rect x="250" y="16" width="130" height="24" rx="6" fill="#7f1d1d" opacity="0.9" />
  <text x="258" y="32" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">FOCO: ADUTORES</text>
</svg>
