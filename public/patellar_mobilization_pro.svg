<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="35,118 285,118 305,162 15,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="150" rx="80" ry="10" fill="#0f172a" opacity="0.22" />

  <!-- Atleta Sentada com Perna Relaxada -->
  <circle cx="85" cy="78" r="8" fill="#d97706" />
  <path d="M80,74 C80,68 90,68 90,74 L88,80 L82,80 Z" fill="#78350f" />
  <path d="M78,85 C78,80 102,80 102,85 L98,124 C92,126 82,126 78,124 Z" fill="url(#kitGrad)" />
  <path d="M88,120 L115,118 L110,135 L88,135 Z" fill="#0f172a" />

  <!-- Perna e Canela Estendida -->
  <path d="M110,120 L170,120 L170,130 L110,130 Z" fill="#d97706" />
  <path d="M185,123 L245,125 L245,131 L185,129 Z" fill="#d97706" />
  <path d="M245,125 L252,118 L256,122 L248,130 Z" fill="#ffffff" />

  <!-- Grupo Rótula + Mãos em Deslize Ativo Superior, Inferior e Medial -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,6; -5,0; 0,0" dur="2.2s" repeatCount="indefinite" />

    <!-- Mãos da Atleta -->
    <path d="M95,95 L170,116" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />
    <path d="M98,92 L185,116" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="172" cy="117" r="3.5" fill="#d97706" />
    <circle cx="184" cy="117" r="3.5" fill="#d97706" />

    <!-- Rótula (Patela) com Glow -->
    <circle cx="178" cy="122" r="7.5" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5" filter="url(#dropShadow)" />
    <circle cx="178" cy="122" r="3" fill="#38bdf8" />
  </g>

  <!-- Vetores de Deslize Multidirecional Animados -->
  <g filter="url(#dropShadow)">
    <g>
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="1.1s" repeatCount="indefinite" />
      <path d="M178,107 L178,100" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="175,103 178,97 181,103" fill="#0284c7" />
      <path d="M178,137 L178,144" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="175,141 178,147 181,141" fill="#0284c7" />
      <path d="M165,122 L158,122" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="161,119 155,122 161,125" fill="#0284c7" />
    </g>
  </g>

  <!-- Live Loop Badge -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.85" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>