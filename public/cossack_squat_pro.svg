<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />

  <!-- Sombra Projetada -->
  <ellipse cx="160" cy="152" rx="80" ry="10" fill="#0f172a" opacity="0.22" />

  <!-- Atleta em Cossack Squat (Escala Ajustada / Mais Espaço em Cima e em Baixo) -->
  <!-- Perna Direita Estendida -->
  <path d="M148,124 L228,142 L224,148 L144,130 Z" fill="#d97706" />
  <!-- Pé Direito c/ Dedos ao Teto -->
  <path d="M228,142 L234,131 L240,134 L233,146 Z" fill="#ffffff" />
  <path d="M232,136 L237,138" stroke="#0284c7" stroke-width="1.5" />

  <!-- Perna Esquerda Fletida -->
  <path d="M130,124 L95,133 L91,142 L126,134 Z" fill="#d97706" />
  <path d="M95,133 L95,150 L106,150 L103,137 Z" fill="#d97706" />
  <ellipse cx="101" cy="151" rx="8" ry="3.5" fill="#ffffff" />

  <!-- Calções / Bacia -->
  <path d="M116,119 C116,115 148,115 148,119 L144,134 C134,137 121,137 116,134 Z" fill="#0f172a" />

  <!-- Tronco / Camisola Gil Vicente FC -->
  <path d="M121,102 C121,97 143,97 143,102 L141,123 C134,125 125,125 123,123 Z" fill="url(#kitGrad)" />

  <!-- Braços à Frente para Equilíbrio -->
  <path d="M123,104 L105,110 L107,114 L125,108 Z" fill="#d97706" />
  <path d="M139,104 L153,110 L151,114 L137,108 Z" fill="#d97706" />
  <circle cx="104" cy="112" r="3.5" fill="#d97706" />
  <circle cx="154" cy="112" r="3.5" fill="#d97706" />

  <!-- Cabeça e Cabelo (Com 30px livres no topo!) -->
  <circle cx="132" cy="88" r="8" fill="#d97706" />
  <path d="M127,84 C127,78 137,78 137,84 L135,90 L129,90 Z" fill="#78350f" />

  <!-- Vetores de Mobilidade -->
  <g filter="url(#dropShadow)">
    <path d="M142,126 L220,140" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <path d="M152,96 L130,96" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="132,92 125,96 132,100" fill="#2563eb" />
  </g>
</svg>
