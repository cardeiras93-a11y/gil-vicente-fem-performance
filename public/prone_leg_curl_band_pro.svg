<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="20,122 265,122 285,158 5,158" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Poste de Ancoragem -->
  <rect x="290" y="80" width="10" height="60" rx="3" fill="#64748b" filter="url(#dropShadow)" />
  <circle cx="295" cy="132" r="5" fill="#0284c7" />
  <circle cx="295" cy="132" r="2.5" fill="#ffffff" />
  <ellipse cx="120" cy="140" rx="80" ry="5" fill="#0f172a" opacity="0.3" />

  <!-- Atleta Deitada de Barriga para Baixo -->
  <path d="M48,124 L62,120 L74,124" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <circle cx="58" cy="115" r="7.5" fill="#d97706" />
  <path d="M52,111 C52,106 64,106 64,111 L62,118 L54,118 Z" fill="#78350f" />
  <path d="M68,118 L130,118 L130,132 L68,132 Z" fill="url(#kitGrad)" />
  <path d="M128,118 L158,118 L158,132 L128,132 Z" fill="#0f172a" />

  <!-- Perna Esquerda em Repouso -->
  <path d="M156,125 L215,127" stroke="#b45309" stroke-width="7" stroke-linecap="round" />
  <rect x="214" y="125" width="12" height="5" rx="2" fill="#ffffff" />

  <!-- Coxa Direita no Solo -->
  <path d="M156,125 L188,125" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />

  <!-- Perna Direita em Flexão / Extensão Excêntrica Animada (Prone Leg Curl) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 188 125; 38 188 125; 0 188 125" dur="2.2s" repeatCount="indefinite" />
    <path d="M188,125 L175,82" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <rect x="168" y="76" width="14" height="6" rx="2" transform="rotate(-15 174 79)" fill="#ffffff" />
    <rect x="170" y="78" width="10" height="2" transform="rotate(-15 174 79)" fill="#ef4444" />
    <!-- Tensão nos Isquiotibiais -->
    <ellipse cx="178" cy="108" rx="8" ry="4" transform="rotate(-40 178 108)" fill="#ef4444">
      <animate attributeName="opacity" values="0.4; 0.95; 0.4" dur="2.2s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Banda Elástica que Estica com a Perna -->
  <g filter="url(#dropShadow)">
    <path d="M176,85 Q235,115 295,132" stroke="#0284c7" stroke-width="3.5" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M176,85 Q235,115 295,132; M192,102 Q245,122 295,132; M176,85 Q235,115 295,132" dur="2.2s" repeatCount="indefinite" />
    </path>
    <path d="M176,85 Q235,115 295,132" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9">
      <animate attributeName="d" values="M176,85 Q235,115 295,132; M192,102 Q245,122 295,132; M176,85 Q235,115 295,132" dur="2.2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Arco de Flexão -->
  <path d="M205,120 A 28 28 0 0 0 182,90" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <polygon points="185,87 178,92 186,95" fill="#2563eb" />

  <!-- Live Loop Badge -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.85" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>