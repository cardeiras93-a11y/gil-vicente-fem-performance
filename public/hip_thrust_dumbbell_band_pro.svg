<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="35,122 285,122 305,162 15,162" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sofá / Banco de Casa para Apoio das Omoplatas -->
  <rect x="42" y="88" width="58" height="54" rx="8" fill="#475569" filter="url(#dropShadow)" />
  <rect x="46" y="82" width="50" height="14" rx="5" fill="#64748b" />

  <!-- Cabeça e Tronco Horizontal no Topo do Hip Thrust -->
  <circle cx="88" cy="74" r="8" fill="#d97706" />
  <path d="M80,71 C80,65 94,65 94,71 Z" fill="#78350f" />
  <path d="M96,82 L160,82 L160,98 L96,96 Z" fill="url(#kitGrad)" />

  <!-- Bacia / Glúteo em Extensão Completa -->
  <path d="M156,82 L182,82 L182,99 L156,99 Z" fill="#0f172a" />
  <circle cx="168" cy="95" r="6" fill="#ef4444" opacity="0.8" />

  <!-- Haltere Apoiado na Anca (Seguro com a Mão) -->
  <g filter="url(#dropShadow)">
    <rect x="156" y="68" width="6" height="14" rx="2" fill="#1e293b" />
    <rect x="172" y="68" width="6" height="14" rx="2" fill="#1e293b" />
    <line x1="162" y1="75" x2="172" y2="75" stroke="#94a3b8" stroke-width="4" />
  </g>
  <path d="M122,86 L166,76" stroke="#d97706" stroke-width="5" stroke-linecap="round" />

  <!-- Perna de Apoio a 90° (Tíbia Vertical) -->
  <path d="M178,88 L220,88 L220,144" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="214" y="142" width="18" height="6" rx="3" fill="#ffffff" />

  <!-- Perna Livre Elevada a 90° (Unipodal) + Minibanda -->
  <path d="M178,86 L208,64 L234,68" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="204" y1="64" x2="215" y2="88" stroke="#dc2626" stroke-width="5" stroke-linecap="round" />

  <!-- Seta de Força de Extensão da Anca -->
  <g filter="url(#dropShadow)">
    <path d="M167,62 L167,44" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="163,46 167,38 171,46" fill="#2563eb" />
  </g>
</svg>
