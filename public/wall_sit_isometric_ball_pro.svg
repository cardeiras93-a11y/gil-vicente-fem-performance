<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Gym floor -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(205, 10)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#ef4444" />
    <text x="14" y="8" fill="#334155" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">WALL-SIT ISOMÉTRICO C/ BOLA</text>
  </g>

  
  <!-- Parede à esquerda -->
  <rect x="55" y="20" width="16" height="128" fill="#64748b" rx="2" />
  <line x1="71" y1="20" x2="71" y2="148" stroke="#475569" stroke-width="2" />

  <!-- Atleta em Wall-Sit a 90° com suave respiração e pulso isométrico -->
  <g id="athleteWallSit">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="2s" repeatCount="indefinite" />
    <!-- Costas encostadas à parede -->
    <path d="M73 60 L73 105" stroke="#1e3a8a" stroke-width="16" stroke-linecap="round" />
    <!-- Cabeça -->
    <circle cx="76" cy="46" r="9" fill="#f6ad55" />
    <path d="M72 40 Q76 35 81 41" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <!-- Coxas a 90° -->
    <path d="M73 105 L118 105" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
    <!-- Pernas / tíbias verticais a 90° -->
    <path d="M118 105 L118 148" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
    <!-- Pés planos no chão -->
    <ellipse cx="126" cy="148" rx="10" ry="4" fill="#0284c7" />

    <!-- Bola de Isometria entre os Joelhos com Pulso de Compressão -->
    <circle cx="118" cy="98" r="9" fill="#f59e0b" stroke="#d97706" stroke-width="2">
      <animate attributeName="r" values="9;7.8;9" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#f59e0b;#fbbf24;#f59e0b" dur="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- Braços cruzados no peito -->
    <path d="M73 75 Q92 78 88 88" stroke="#f6ad55" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Ondas de tensão isométrica no tendão rotuliano e quadricípete -->
  <g transform="translate(100, 95)">
    <path d="M5 -15 L22 -15" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite" />
    </path>
    <text x="26" y="-12" fill="#ef4444" font-size="8" font-weight="900" font-family="Inter, sans-serif">ISOMETRIA 90°</text>
  </g>

</svg>