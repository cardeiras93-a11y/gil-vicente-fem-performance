<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes hipReach {
      0%, 100% {
        transform: rotate(0deg) translate(0px, 0px);
      }
      50% {
        transform: rotate(11deg) translate(6px, 3px);
      }
    }
    @keyframes arrowForward {
      0%, 100% {
        transform: translate(0px, 0px);
        opacity: 0.6;
      }
      50% {
        transform: translate(8px, 3px);
        opacity: 1;
      }
    }
    .anim-hip-reach {
      transform-origin: 138px 125px;
      animation: hipReach 2.8s ease-in-out infinite;
    }
    .anim-arrow-reach {
      animation: arrowForward 2.8s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-hip-reach, .anim-arrow-reach {
        animation: none !important;
      }
    }
  </style>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />

  <!-- Tapete Azul -->
  <polygon points="35,115 285,115 305,165 15,165" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sombra Projetada -->
  <ellipse cx="160" cy="154" rx="80" ry="10" fill="#0f172a" opacity="0.25" />

  <!-- Perna Traseira Fixa (Rotação Interna a 90º) -->
  <path d="M125,138 L85,142 L80,155 L108,155" stroke="#d97706" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <ellipse cx="108" cy="155" rx="5" ry="3" fill="#ffffff" />

  <!-- Bacia / Calções Assentes no Solo (Base Fixa) -->
  <path d="M118,126 L152,126 L148,145 L114,145 Z" fill="#0f172a" />

  <!-- Perna Dianteira Fixa (Rotação Externa a 90º com tíbia paralela) -->
  <path d="M148,138 L195,144 L192,156 L155,156" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <ellipse cx="152" cy="156" rx="6" ry="3" fill="#ffffff" />

  <!-- SEGMENTO DINÂMICO QUE PROJETA O PEITO À FRENTE (HIP HINGE & REACH) -->
  <g class="anim-hip-reach">
    <!-- Tronco Alongado / Camisola Gil Vicente FC -->
    <path d="M128,95 C128,90 152,90 152,95 L146,130 C138,132 128,132 122,130 Z" fill="url(#kitGrad)" />

    <!-- Cabeça e Cabelo -->
    <circle cx="140" cy="80" r="8" fill="#d97706" />
    <path d="M135,76 C135,70 145,70 145,76 L143,82 L137,82 Z" fill="#78350f" />

    <!-- Braços em Alcance Dinâmico à Frente (Chest Reach over Shin) -->
    <path d="M136,98 L180,118" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <circle cx="182" cy="119" r="3.5" fill="#d97706" />

    <path d="M146,98 L195,116" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <circle cx="197" cy="117" r="3.5" fill="#d97706" />
  </g>

  <!-- Vetores Dinâmicos: Seta de Alcance c/ Movimento Fluido -->
  <g filter="url(#dropShadow)" class="anim-arrow-reach">
    <path d="M165,102 L205,110" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="202,106 210,111 204,115" fill="#2563eb" />
  </g>

  <!-- Ângulos 90º -->
  <g>
    <path d="M85,130 C85,122 105,122 110,126" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="88" y="122" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#38bdf8">90°</text>

    <path d="M190,132 C198,132 205,138 202,146" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="206" y="140" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#38bdf8">90°</text>
  </g>

  <!-- Tag Articular -->
  <g opacity="0.85">
    <rect x="220" y="14" width="90" height="18" rx="4" fill="#1e293b" />
    <text x="265" y="26" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">ROTAÇÃO INT/EXT</text>
  </g>
</svg>
