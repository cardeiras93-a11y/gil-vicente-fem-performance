<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <ellipse cx="155" cy="152" rx="75" ry="8" fill="#0f172a" opacity="0.2" />
  <rect x="25" y="30" width="30" height="118" rx="3" fill="url(#machGrad)" filter="url(#dropShadow)" />
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 -12; 0 0" keyTimes="0; 0.42; 0.6; 1" dur="2.8s" repeatCount="indefinite" />
    <rect x="30" y="60" width="20" height="6" fill="#ef4444" rx="1.5" />
  </g>
  <rect x="86" y="52" width="12" height="54" rx="3" fill="#0284c7" filter="url(#dropShadow)" />
  <rect x="92" y="104" width="56" height="12" rx="3" fill="#0284c7" filter="url(#dropShadow)" />
  <circle cx="106" cy="44" r="8.5" fill="#d97706" />
  <path d="M102,54 L122,54 L120,95 L102,95 Z" fill="url(#kitGrad)" />
  <path d="M102,95 L128,95 L126,108 L102,108 Z" fill="#0f172a" />
  <path d="M124,103 L166,103" stroke="#d97706" stroke-width="9.5" stroke-linecap="round" />
  <rect x="135" y="93" width="22" height="8" rx="3" fill="#0284c7" />
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 166 103; 55 166 103; 55 166 103; 0 166 103" keyTimes="0; 0.42; 0.6; 1" dur="2.8s" repeatCount="indefinite" />
    <path d="M166,103 L208,118" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <circle cx="206" cy="126" r="7.5" fill="#0284c7" stroke="#0369a1" stroke-width="2" filter="url(#dropShadow)" />
    <ellipse cx="212" cy="116" rx="8" ry="3.5" fill="#1e3a8a" />
  </g>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">LEG CURL</text>
  </g>
</svg>
