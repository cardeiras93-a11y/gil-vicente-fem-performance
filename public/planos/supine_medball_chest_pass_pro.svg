<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="medballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Gym floor -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(205, 10)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#ef4444" />
    <text x="14" y="8" fill="#334155" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">LANÇAMENTO MEDBALL NO SOLO</text>
  </g>

  <!-- Solo colchonete -->
  <rect x="40" y="140" width="240" height="6" rx="3" fill="#334155" />

  <!-- Atleta em Decúbito Dorsal (Deitada de costas) -->
  <!-- Cabeça com apoio -->
  <circle cx="85" cy="132" r="9" fill="#f6ad55" />
  
  <!-- Tronco rígido no solo -->
  <path d="M92 136 L175 136" stroke="url(#kitGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Pernas fletidas com pés apoiados -->
  <!-- Coxas subindo a 45° -->
  <path d="M175 136 L210 108" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
  <!-- Tíbias descendo para os pés -->
  <path d="M210 108 L235 142" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
  <!-- Pés no colchonete -->
  <ellipse cx="238" cy="142" rx="9" ry="3.5" fill="#0284c7" />

  <!-- Trajetória de lançamento vertical e linhas de velocidade explosiva -->
  <g opacity="0.8">
    <line x1="125" y1="110" x2="125" y2="40" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite" />
    </line>
    <!-- Setas de explosão -->
    <path d="M120 45 L125 35 L130 45" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Braços e Mãos projetando a bola explosivamente para o alto -->
  <!-- Braço esquerdo / direito em extensão explosiva -->
  <path d="M125 136 L125 110" stroke="#f6ad55" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" values="M125 136 L125 112; M125 136 L125 82; M125 136 L125 82; M125 136 L125 112" keyTimes="0; 0.25; 0.65; 1" dur="1.8s" repeatCount="indefinite" />
  </path>

  <!-- Medicine Ball (Lançamento vertical explosivo a 60fps) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-72; 0,-72; 0,0" keyTimes="0; 0.28; 0.62; 1" dur="1.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.8 0.2 1; 0.4 0 0.6 1; 0.6 0 0.9 1" />
    <!-- Bola com textura e ranhuras -->
    <circle cx="125" cy="104" r="14" fill="url(#medballGrad)" filter="url(#dropShadow)" />
    <!-- Costura central da medball -->
    <circle cx="125" cy="104" r="13" stroke="#0f172a" stroke-width="1.8" fill="none" opacity="0.7" />
    <path d="M112 104 Q125 96 138 104" stroke="#0f172a" stroke-width="2" fill="none" opacity="0.6" />
    <!-- Peso impresso -->
    <text x="125" y="107" fill="#ffffff" font-size="6.5" font-weight="900" font-family="Inter, sans-serif" text-anchor="middle">5KG</text>
  </g>

  <!-- Indicador POTÊNCIA & EXTENSÃO EXPLOSIVA -->
  <g transform="translate(170, 48)">
    <rect x="0" y="0" width="136" height="18" rx="9" fill="#0f172a" fill-opacity="0.85" />
    <text x="68" y="12" fill="#38bdf8" font-size="8" font-weight="900" font-family="Inter, sans-serif" text-anchor="middle">POTÊNCIA EXPLOSIVA DE PEITO</text>
  </g>
</svg>
