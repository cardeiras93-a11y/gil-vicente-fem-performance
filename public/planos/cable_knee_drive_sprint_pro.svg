<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="150" x2="320" y2="150" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(170, 10)">
    <rect x="0" y="0" width="142" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="78" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" text-anchor="middle">CABLE KNEE DRIVE (SPRINT)</text>
  </g>

  <!-- Sombra no solo -->
  <ellipse cx="180" cy="154" rx="55" ry="6" fill="#0f172a" opacity="0.22" />

  <!-- Coluna da Máquina de Cabos / Polia Baixa -->
  <rect x="40" y="25" width="22" height="125" rx="3" fill="url(#frameGrad)" filter="url(#dropShadow)" />
  <circle cx="51" cy="138" r="7" fill="#0284c7" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Atleta de Pé em Apoio Unipodal Atlético -->
  <!-- Perna de Apoio Firme no Solo -->
  <rect x="180" y="146" width="18" height="5" rx="2.5" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <line x1="188" y1="146" x2="188" y2="95" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  
  <!-- Bacia e Tronco Atlético Alto -->
  <ellipse cx="188" cy="95" rx="8" ry="6" fill="#0f172a" />
  <path d="M185,60 L195,60 L191,95 L183,95 Z" fill="url(#kitGrad)" />
  <!-- Cabeça -->
  <circle cx="190" cy="48" r="7.5" fill="#d97706" />
  <path d="M184,44 C184,38 196,38 196,44 Z" fill="#78350f" />
  
  <!-- Braços em Postura de Corrida / Sprint -->
  <path d="M188,65 L174,78 L170,92" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M192,65 L206,75 L212,68" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Perna de Ataque com Cabo e Knee Drive Explosivo a 90° -->
  <g>
    <!-- Animação de subida explosiva e oscilação de flexores da anca -->
    <animateTransform attributeName="transform" type="rotate" values="32 188 95; 0 188 95; -4 188 95; 0 188 95; 32 188 95" keyTimes="0; 0.35; 0.50; 0.65; 1" dur="2.4s" repeatCount="indefinite" />
    
    <!-- Coxa a 90° e Joelho Fletido -->
    <line x1="188" y1="95" x2="216" y2="92" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <line x1="216" y1="92" x2="214" y2="126" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
    
    <!-- Tornozeleira Acolchoada com Gancho -->
    <rect x="208" y="122" width="12" height="7" rx="2" fill="#ef4444" />
    <ellipse cx="218" cy="128" rx="6" ry="3" fill="#ffffff" />
    
    <!-- Cabo de Aço Esticado da Polia Baixa ao Tornozelo -->
    <line x1="51" y1="138" x2="208" y2="125" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
