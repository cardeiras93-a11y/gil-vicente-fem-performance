<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Limpo e Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Tapete Azul -->
  <polygon points="35,118 285,118 305,162 15,162" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sombra Projetada -->
  <ellipse cx="160" cy="150" rx="80" ry="10" fill="#0f172a" opacity="0.22" />

  <!-- Atleta Sentada no Tapete com Joelho Elevado Apoiado nas Mãos para Isolar a Canela -->
  <circle cx="85" cy="72" r="8" fill="#d97706" />
  <path d="M80,68 C80,62 90,62 90,68 L88,74 L82,74 Z" fill="#78350f" />

  <!-- Tronco / Camisola Gil Vicente FC -->
  <path d="M78,80 C78,75 104,75 104,80 L100,122 C94,124 84,124 78,122 Z" fill="url(#kitGrad)" />

  <!-- Calções / Bacia -->
  <path d="M90,118 L118,116 L112,134 L90,134 Z" fill="#0f172a" />

  <!-- Coxa Segura pelas Mãos (Impedindo o joelho e fémur de rodar) -->
  <path d="M112,118 L160,105 L160,116 L112,128 Z" fill="#d97706" />
  <!-- Mãos Entrelaçadas sob a Coxa -->
  <path d="M95,88 L155,108" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <circle cx="156" cy="110" r="4" fill="#d97706" />

  <!-- Canela Suspensa no Ar (Pé Livre para Rodar em 360°) -->
  <path d="M160,110 L215,118" stroke="#d97706" stroke-width="8" stroke-linecap="round" />

  <!-- Pé com Sapatilha Branca -->
  <path d="M215,118 L232,112 L236,118 L218,126 Z" fill="#ffffff" filter="url(#dropShadow)" />

  <!-- Banda Elástica Laranja no Antepé criando Resistência Omnidirecional -->
  <path d="M232,114 L265,110" stroke="#f97316" stroke-width="3" stroke-linecap="round" />

  <!-- Círculo Articular 360° em Destaque (CARs) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="235" cy="118" rx="14" ry="14" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <path d="M245,108 C252,115 250,126 242,131" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="244,134 238,129 246,128" fill="#2563eb" />
  </g>
</svg>
