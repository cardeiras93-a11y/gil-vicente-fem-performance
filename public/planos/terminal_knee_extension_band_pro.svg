<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloorTKE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGradTKE" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="kitGradTKE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowCyanTKE" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadowTKE" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <style>
    @keyframes tkeAction {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-14deg);
      }
    }
    @keyframes bandStretch {
      0%, 100% {
        d: path("M50,112 Q105,112 165,112");
      }
      50% {
        d: path("M50,112 Q105,115 152,114");
      }
    }
    @keyframes vmoGlow {
      0%, 100% {
        opacity: 0.95;
        transform: scale(1.05);
      }
      50% {
        opacity: 0.25;
        transform: scale(0.9);
      }
    }
    .tke-leg-anim {
      transform-origin: 165px 82px;
      animation: tkeAction 3.2s ease-in-out infinite;
    }
    .tke-band-anim {
      animation: bandStretch 3.2s ease-in-out infinite;
    }
    .tke-vmo-glow {
      animation: vmoGlow 3.2s ease-in-out infinite;
      transform-origin: 168px 105px;
    }
  </style>

  <!-- Fundo do Ginásio -->
  <rect width="320" height="180" fill="url(#gymFloorTKE)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Poste / Rig de Musculação na Esquerda -->
  <rect x="34" y="20" width="16" height="135" fill="url(#poleGradTKE)" filter="url(#shadowTKE)" />
  <circle cx="42" cy="112" r="4.5" fill="#0284c7" />

  <!-- Sombra Projetada no Chão -->
  <ellipse cx="175" cy="154" rx="45" ry="7" fill="#0f172a" opacity="0.25" />

  <!-- Perna Posterior de Apoio (Estável) -->
  <line x1="188" y1="88" x2="195" y2="120" stroke="#b45309" stroke-width="7" stroke-linecap="round" />
  <line x1="195" y1="120" x2="198" y2="150" stroke="#b45309" stroke-width="6.5" stroke-linecap="round" />
  <ellipse cx="201" cy="151" rx="8" ry="3.5" fill="#64748b" />

  <!-- Grupo Perna em Exercício com Banda Elástica -->
  <!-- Banda Elástica Laranja (Ancorada no poste até ao joelho) -->
  <path class="tke-band-anim" d="M50,112 Q105,112 165,112" stroke="#ea580c" stroke-width="4.5" fill="none" stroke-linecap="round" />

  <g class="tke-leg-anim">
    <!-- Coxa (Quadríceps) -->
    <path d="M172,82 L165,112" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />

    <!-- Destaque do Vasto Medial / Quadríceps (VMO) -->
    <ellipse class="tke-vmo-glow" cx="168" cy="104" rx="5.5" ry="11" fill="#06b6d4" filter="url(#glowCyanTKE)" />

    <!-- Perna / Tíbia -->
    <path d="M165,112 L166,150" stroke="#d97706" stroke-width="7" stroke-linecap="round" />

    <!-- Pé e Sapatilha -->
    <ellipse cx="168" cy="151" rx="9" ry="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="165" cy="112" r="3.5" fill="#f97316" />
  </g>

  <!-- Bacia e Calções Oficiais -->
  <path d="M162,75 L188,75 L182,92 L164,90 Z" fill="#0f172a" />

  <!-- Tronco Alinhado / Camisola Gil Vicente FC -->
  <path d="M166,42 C166,38 184,38 184,42 L182,78 C176,80 170,80 166,78 Z" fill="url(#kitGradTKE)" />

  <!-- Braços Naturais / Mãos na Bacia para Estabilidade -->
  <path d="M172,48 L160,65 L170,72" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cabeça e Cabelo -->
  <circle cx="175" cy="28" r="7.5" fill="#d97706" />
  <path d="M171,24 C171,19 180,19 180,24 L179,30 L173,30 Z" fill="#78350f" />

  <!-- Marcador de Foco e Direção da Força -->
  <g transform="translate(198, 98)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-dasharray="2 2" stroke-width="1.2" />
    <path d="M-5,0 L3,0 M0,-3 L3,0 L0,3" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="18" y="4" font-family="Inter, sans-serif" font-size="9" font-weight="900" fill="#0284c7">EXTENSÃO TKE</text>
  </g>
</svg>
