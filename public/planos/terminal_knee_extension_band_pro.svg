<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(210, 10)">
    <rect x="0" y="0" width="102" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, sans-serif" font-weight="900" text-anchor="middle">TKE EXTENSÃO</text>
  </g>


  <rect x="30" y="20" width="16" height="135" fill="url(#poleGrad)" filter="url(#dropShadow)" />
  <circle cx="38" cy="112" r="4.5" fill="#0284c7" />
  <ellipse cx="175" cy="154" rx="45" ry="7" fill="#0f172a" opacity="0.25" />

  <!-- Perna Posterior de Apoio (Estável) -->
  <line x1="190" y1="88" x2="198" y2="120" stroke="#b45309" stroke-width="7" stroke-linecap="round" />
  <line x1="198" y1="120" x2="202" y2="150" stroke="#b45309" stroke-width="6.5" stroke-linecap="round" />
  <ellipse cx="204" cy="151" rx="8" ry="3.5" fill="#64748b" />

  <!-- Banda Elástica Esticando com o Bloqueio -->
  <line x1="46" y1="112" x2="165" y2="112" stroke="#ea580c" stroke-width="5" stroke-linecap="round">
    <animate attributeName="x2" values="148; 168; 168; 148" keyTimes="0; 0.45; 0.65; 1" dur="2.4s" repeatCount="indefinite" />
  </line>

  <!-- Perna em Ação de Bloqueio Terminal do Joelho -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="18 165 150; 0 165 150; 0 165 150; 18 165 150" keyTimes="0; 0.45; 0.65; 1" dur="2.4s" repeatCount="indefinite" />
    <path d="M165,112 L165,150" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
    <ellipse cx="168" cy="151" rx="9" ry="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <path d="M172,82 L165,112" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
    <ellipse cx="168" cy="104" rx="5" ry="10" fill="#06b6d4" filter="url(#glowCyan)">
      <animate attributeName="opacity" values="0.2; 1; 1; 0.2" keyTimes="0; 0.45; 0.65; 1" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="rx" values="3; 6; 6; 3" keyTimes="0; 0.45; 0.65; 1" dur="2.4s" repeatCount="indefinite" />
    </ellipse>
    <circle cx="165" cy="112" r="4.5" fill="#f97316" />
  </g>

  <!-- Bacia e Tronco -->
  <path d="M162,75 L188,75 L182,92 L164,90 Z" fill="#0f172a" />
  <path d="M166,42 C166,38 184,38 184,42 L182,78 C176,80 170,80 166,78 Z" fill="url(#kitGrad)" />
  <path d="M172,48 L160,65 L170,72" stroke="#d97706" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="175" cy="28" r="7.5" fill="#d97706" />
  <path d="M171,24 C171,19 180,19 180,24 L179,30 L173,30 Z" fill="#78350f" />

</svg>
