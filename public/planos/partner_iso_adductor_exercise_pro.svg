<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowForce" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Solo Pavilhão / Ginásio GVFC -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  
  <!-- Linha de Chão e marcas de agilidade amarelas (iguais à foto do treino) -->
  <line x1="0" y1="152" x2="320" y2="152" stroke="#1e293b" stroke-width="2" />
  <rect x="0" y="152" width="320" height="28" fill="#0b1120" />
  <rect x="50" y="156" width="32" height="15" fill="none" stroke="#eab308" stroke-width="2" opacity="0.75" rx="1" />
  <rect x="90" y="156" width="32" height="15" fill="none" stroke="#eab308" stroke-width="2" opacity="0.75" rx="1" />
  <rect x="198" y="156" width="32" height="15" fill="none" stroke="#eab308" stroke-width="2" opacity="0.75" rx="1" />
  <rect x="238" y="156" width="32" height="15" fill="none" stroke="#eab308" stroke-width="2" opacity="0.75" rx="1" />

  <!-- Badge LIVE ANIMADO (Canto Superior Direito) -->
  <g transform="translate(204, 10)">
    <rect x="0" y="0" width="104" height="19" rx="9.5" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9.5" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.2;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="13" fill="#38bdf8" font-size="8.5" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator (Canto Superior Esquerdo) -->
  <g transform="translate(14, 16)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#ef4444" />
    <text x="14" y="8" fill="#f1f5f9" font-size="8.5" font-weight="800" font-family="Inter, system-ui, sans-serif">ISO ADDUCTOR EXERCISE • COM COLEGA NO SOLO</text>
  </g>

  <!-- Sombras no chão sob os atletas -->
  <ellipse cx="85" cy="151" rx="35" ry="5" fill="#000000" opacity="0.6" />
  <ellipse cx="235" cy="151" rx="35" ry="5" fill="#000000" opacity="0.6" />
  <ellipse cx="160" cy="148" rx="22" ry="4" fill="#000000" opacity="0.5" />

  <!-- ==================== ATLETA 1 (ESQUERDA - VIRADO PARA A DIREITA) ==================== -->
  <g id="athlete-left">
    <!-- Tronco reclinado em V-Sit ativo -->
    <!-- Cabeça e Pescoço -->
    <path d="M66 50 L69 57" stroke="#f6ad55" stroke-width="4.5" />
    <circle cx="64" cy="42" r="8.5" fill="#f6ad55" />
    <path d="M58 37 C58 32, 69 32, 70 38 C67 37, 62 37, 58 37 Z" fill="#1e293b" />
    <!-- T-shirt Preta com detalhe amarelo GVFC -->
    <path d="M58 58 L82 66 L68 114 L48 106 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M66 76 Q72 74 76 82" stroke="#eab308" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Calções Pretos -->
    <path d="M48 106 L68 114 L78 132 L54 134 Z" fill="#020617" stroke="#1e293b" stroke-width="1.2" />

    <!-- Braços em postura de combate / equilíbrio no ar (como no vídeo) -->
    <path d="M72 70 L90 76 L86 64" stroke="#f6ad55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M62 72 L78 82 L76 72" stroke="#f6ad55" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

    <!-- Perna Esquerda (Fletida para apoio no solo) -->
    <path d="M62 120 L86 102 L98 142" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="98" cy="143" rx="8" ry="3.5" fill="#334155" />

    <!-- Perna Direita (Estendida à frente para adução isométrica contra o colega) -->
    <!-- Coxa / Adutor direito em alta contração isométrica -->
    <path d="M72 124 L118 126" stroke="#0f172a" stroke-width="11" stroke-linecap="round" />
    <!-- Tíbia estendida em direção ao centro -->
    <path d="M118 126 L152 136" stroke="#f6ad55" stroke-width="8.5" stroke-linecap="round" />
    <!-- Meia e Sapatilha preta/cinza -->
    <rect x="144" y="132" width="7" height="9" fill="#f8fafc" rx="1" />
    <ellipse cx="154" cy="138" rx="8.5" ry="4" fill="#1e293b" />
    <path d="M149 135 L158 139" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Halo de Ativação do Adutor Atleta 1 -->
    <circle cx="102" cy="125" r="5" fill="#ef4444" opacity="0.85">
      <animate attributeName="r" values="4;6.5;4" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="0.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== ATLETA 2 (DIREITA - VIRADO PARA A ESQUERDA) ==================== -->
  <g id="athlete-right">
    <!-- Tronco reclinado em V-Sit ativo -->
    <!-- Cabeça e Pescoço -->
    <path d="M254 50 L251 57" stroke="#f6ad55" stroke-width="4.5" />
    <circle cx="256" cy="42" r="8.5" fill="#f6ad55" />
    <path d="M262 37 C262 32, 251 32, 250 38 C253 37, 258 37, 262 37 Z" fill="#1e293b" />
    <!-- T-shirt Preta com detalhe amarelo GVFC -->
    <path d="M262 58 L238 66 L252 114 L272 106 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M254 76 Q248 74 244 82" stroke="#eab308" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Calções Pretos -->
    <path d="M272 106 L252 114 L242 132 L266 134 Z" fill="#020617" stroke="#1e293b" stroke-width="1.2" />

    <!-- Braços em postura de combate / equilíbrio no ar (como no vídeo) -->
    <path d="M248 70 L230 76 L234 64" stroke="#f6ad55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M258 72 L242 82 L244 72" stroke="#f6ad55" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

    <!-- Perna Direita (Fletida para apoio estável no solo) -->
    <path d="M258 120 L234 102 L222 142" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="222" cy="143" rx="8" ry="3.5" fill="#334155" />

    <!-- Perna Esquerda (Estendida à frente para adução isométrica contra o colega) -->
    <!-- Coxa / Adutor esquerdo em alta contração -->
    <path d="M248 124 L202 126" stroke="#0f172a" stroke-width="11" stroke-linecap="round" />
    <!-- Tíbia estendida em direção ao centro -->
    <path d="M202 126 L166 136" stroke="#f6ad55" stroke-width="8.5" stroke-linecap="round" />
    <!-- Meia e Sapatilha Verde com detalhe coral (exatamente como na foto!) -->
    <rect x="169" y="132" width="7" height="9" fill="#f8fafc" rx="1" />
    <ellipse cx="164" cy="138" rx="9" ry="4" fill="#059669" />
    <path d="M160 137 L168 136" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" />

    <!-- Halo de Ativação do Adutor Atleta 2 -->
    <circle cx="218" cy="125" r="5" fill="#ef4444" opacity="0.85">
      <animate attributeName="r" values="4;6.5;4" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="0.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== ZONA DE FORÇA ISOMÉTRICA CONTRALATERAL (CENTRO) ==================== -->
  <!-- Aperto mútuo entre as sapatilhas e tornozelos dos atletas -->
  <g id="isometric-contact-zone" transform="translate(160, 110)">
    <!-- Linha de tensão de força e setas de compressão interna (Adução) -->
    <!-- Seta Esquerda (Atleta 1 pressiona para a Direita) -->
    <g transform="translate(-24, 0)">
      <path d="M0 0 L10 0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <path d="M6 -4 L10 0 L6 4" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <animateTransform attributeName="transform" type="translate" values="-24,0; -18,0; -24,0" dur="0.8s" repeatCount="indefinite" />
    </g>

    <!-- Seta Direita (Atleta 2 pressiona para a Esquerda) -->
    <g transform="translate(24, 0)">
      <path d="M0 0 L-10 0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <path d="M-6 -4 L-10 0 L-6 4" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <animateTransform attributeName="transform" type="translate" values="24,0; 18,0; 24,0" dur="0.8s" repeatCount="indefinite" />
    </g>

    <!-- Badge central de Força Isométrica Máxima -->
    <rect x="-42" y="-14" width="84" height="15" rx="7.5" fill="#0f172a" fill-opacity="0.95" stroke="#ef4444" stroke-width="1.2" />
    <text x="0" y="-3.5" fill="#fca5a5" font-size="6.5" font-weight="900" font-family="Inter, sans-serif" text-anchor="middle" letter-spacing="0.3">ISOMETRIA ADUTORA</text>
  </g>

  <!-- BADGES TÉCNICAS INFORMATIVAS NO RODAPÉ -->
  <g transform="translate(14, 134)">
    <rect x="0" y="0" width="124" height="18" rx="5" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <text x="62" y="12" fill="#38bdf8" font-size="7.5" font-weight="800" font-family="Inter, sans-serif" text-anchor="middle">TRABALHO EM DUPLA (PARCERIA)</text>
  </g>

  <g transform="translate(182, 134)">
    <rect x="0" y="0" width="124" height="18" rx="5" fill="#0f172a" fill-opacity="0.9" stroke="#ef4444" stroke-width="1" />
    <text x="62" y="12" fill="#fca5a5" font-size="7.5" font-weight="800" font-family="Inter, sans-serif" text-anchor="middle">FORÇA MÁXIMA SEM MOVIMENTO</text>
  </g>
</svg>
