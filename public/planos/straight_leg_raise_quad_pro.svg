<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="homeFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Chão & Linha de Solo -->
  <rect width="320" height="180" fill="url(#homeFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Tapete de Exercício -->
  <rect x="25" y="142" width="270" height="6" rx="3" fill="url(#matGrad)" opacity="0.85" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(205, 10)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#10b981" />
    <text x="14" y="8" fill="#334155" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">STRAIGHT LEG RAISE (QUAD LOCK)</text>
  </g>

  <!-- Cabeça & Tronco em Supino -->
  <g transform="translate(45, 120)">
    <!-- Cabeça com apoio -->
    <circle cx="10" cy="12" r="8" fill="#f6ad55" />
    <path d="M5 6 Q10 2 15 7" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Tronco plano no tapete -->
    <path d="M18 16 L75 16" stroke="#1e3a8a" stroke-width="14" stroke-linecap="round" />
    <!-- Braços ao longo do corpo -->
    <path d="M25 20 L65 20" stroke="#f6ad55" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Perna Esquerda (Fletida para Estabilização Pélvica) -->
  <g>
    <!-- Coxa fletida -->
    <path d="M120 136 L148 108" stroke="#0f172a" stroke-width="11" stroke-linecap="round" />
    <!-- Perna até ao pé -->
    <path d="M148 108 L165 142" stroke="#1e293b" stroke-width="9" stroke-linecap="round" />
    <!-- Pé esquerdo no solo -->
    <ellipse cx="168" cy="142" rx="7" ry="3" fill="#0284c7" />
  </g>

  <!-- Perna Direita (Alvo do Quadricípete: Elevação Reta com Joelho Travado) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="0 120 136; -28 120 136; -28 120 136; 0 120 136"
                      keyTimes="0; 0.4; 0.65; 1" dur="2.8s" repeatCount="indefinite" />

    <!-- Coxa com ativação máxima do quadricípete -->
    <path d="M120 136 L180 136" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round" />
    <!-- Joelho travado em extensão total -->
    <circle cx="180" cy="136" r="6" fill="#10b981" filter="url(#glowGreen)" />
    <!-- Tíbia/Perna reta alinhada com a coxa -->
    <path d="M180 136 L245 136" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <!-- Pé em dorsiflexão ativa -->
    <path d="M245 136 L248 126" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />

    <!-- Onda de tensão no Quadricípete / Vasto Medial -->
    <g transform="translate(142, 126)">
      <path d="M0 0 Q8 -6 18 0" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
      </path>
      <text x="9" y="-8" fill="#10b981" font-size="7.5" font-weight="900" font-family="Inter, sans-serif" text-anchor="middle">QUAD LOCK</text>
    </g>
  </g>

  <!-- Indicador de Amplitude Segura (0° a 45°) -->
  <g transform="translate(185, 95)" opacity="0.8">
    <path d="M20 35 A 40 40 0 0 0 45 10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="50" y="22" fill="#0284c7" font-size="8" font-weight="800" font-family="Inter, sans-serif">0° ➔ 45°</text>
  </g>
</svg>
