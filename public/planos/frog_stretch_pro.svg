<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="120" x2="320" y2="120" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Tapete Azul Centrado -->
  <polygon points="45,108 275,108 295,155 25,155" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sombra Projetada da Atleta -->
  <ellipse cx="160" cy="140" rx="70" ry="10" fill="#0f172a" opacity="0.25" />

  <!-- Atleta em Frog Stretch -->
  <!-- Antebraços e Mãos no Tapete -->
  <ellipse cx="132" cy="120" rx="5" ry="8" fill="#d97706" />
  <ellipse cx="188" cy="120" rx="5" ry="8" fill="#d97706" />
  <path d="M132,116 L144,102 L150,105 L138,120 Z" fill="#1e293b" />
  <path d="M188,116 L176,102 L170,105 L182,120 Z" fill="#1e293b" />

  <!-- Cabeça e Cabelo -->
  <circle cx="160" cy="88" r="8" fill="#d97706" />
  <path d="M156,84 C156,77 164,77 164,84 L163,89 L157,89 Z" fill="#78350f" />

  <!-- Tronco / Camisola Azul Gil Vicente -->
  <path d="M144,98 C146,95 174,95 176,98 L173,122 C173,126 147,126 147,122 Z" fill="url(#kitGrad)" />

  <!-- Calções / Bacia -->
  <path d="M145,120 C142,118 178,118 175,120 L182,132 C173,136 147,136 138,132 Z" fill="#0f172a" />

  <!-- Coxa Esquerda (Adutores Abertos a 90°) -->
  <path d="M142,124 L95,133 C88,135 88,141 95,143 L140,134 Z" fill="#d97706" />
  <!-- Canela e Pé Esquerdo -->
  <path d="M95,133 L86,120 C83,116 89,114 91,118 L99,134 Z" fill="#b45309" />
  <ellipse cx="85" cy="116" rx="5" ry="3" fill="#ffffff" />

  <!-- Coxa Direita (Adutores Abertos a 90°) -->
  <path d="M178,124 L225,133 C232,135 232,141 225,143 L180,134 Z" fill="#d97706" />
  <!-- Canela e Pé Direito -->
  <path d="M225,133 L234,120 C237,116 231,114 229,118 L221,134 Z" fill="#b45309" />
  <ellipse cx="235" cy="116" rx="5" ry="3" fill="#ffffff" />

  <!-- Vetor Seta de Oscilação Posterior -->
  <g filter="url(#dropShadow)">
    <path d="M112,131 Q160,123 208,131" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <path d="M160,128 L160,148" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="156,146 160,153 164,146" fill="#2563eb" />
  </g>
</svg>
