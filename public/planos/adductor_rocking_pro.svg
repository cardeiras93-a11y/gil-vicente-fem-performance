<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="125" x2="320" y2="125" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Tapete Azul Centrado -->
  <polygon points="35,115 285,115 305,160 15,160" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sombra Projetada -->
  <ellipse cx="155" cy="146" rx="80" ry="10" fill="#0f172a" opacity="0.22" />

  <!-- Atleta em Adductor Rocking -->
  <!-- Mãos e Braços de Apoio -->
  <ellipse cx="105" cy="133" rx="4" ry="3" fill="#d97706" />
  <ellipse cx="128" cy="133" rx="4" ry="3" fill="#d97706" />
  <path d="M103,133 L101,110 L108,110 L107,133 Z" fill="#d97706" />
  <path d="M126,133 L124,110 L131,110 L130,133 Z" fill="#d97706" />

  <!-- Cabeça e Cabelo -->
  <circle cx="92" cy="98" r="8" fill="#d97706" />
  <path d="M87,95 C87,88 95,88 95,95 L94,100 L88,100 Z" fill="#78350f" />

  <!-- Tronco Horizontal / Camisola Gil Vicente FC -->
  <path d="M98,104 C105,100 145,104 153,110 L148,128 C138,130 105,125 100,120 Z" fill="url(#kitGrad)" />

  <!-- Joelho Esquerdo de Apoio -->
  <path d="M146,116 L146,140 C146,143 138,143 138,140 L138,122 Z" fill="#0f172a" />
  <path d="M138,140 L128,140" stroke="#d97706" stroke-width="5" stroke-linecap="round" />

  <!-- Perna Direita Estendida Lateralmente -->
  <path d="M150,115 L232,138 L230,144 L146,124 Z" fill="#d97706" />
  <path d="M143,113 L170,120 L164,129 L140,122 Z" fill="#0f172a" />
  <ellipse cx="236" cy="142" rx="7" ry="3.5" fill="#ffffff" />
  <path d="M233,140 L240,142" stroke="#0284c7" stroke-width="1.5" />

  <!-- Vetores de Mobilidade -->
  <g filter="url(#dropShadow)">
    <path d="M162,118 L218,135" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <path d="M140,96 L118,96" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="120,92 113,96 120,100" fill="#2563eb" />
  </g>
</svg>
