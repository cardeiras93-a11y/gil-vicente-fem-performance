<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="125" x2="320" y2="125" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="40,115 270,115 290,158 20,158" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sombra com compressão na oscilação -->
  <ellipse cx="145" cy="145" rx="75" ry="10" fill="#0f172a" opacity="0.22">
    <animate attributeName="cx" values="145; 138; 145" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="rx" values="75; 82; 75" dur="2.4s" repeatCount="indefinite" />
  </ellipse>

  <!-- Perna Lateral Fixa em Abdução (Pé Apoiado Firme) -->
  <path d="M165,118 L240,140 C246,142 246,148 240,150 L165,128 Z" fill="#d97706" />
  <rect x="238" y="138" width="14" height="9" rx="3" fill="#ffffff" filter="url(#dropShadow)" />
  <path d="M190,126 L230,138" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,3" fill="none" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0; -12" dur="1.2s" repeatCount="indefinite" />
  </path>

  <!-- Mãos Fixas no Tapete (Ponto Fixo) -->
  <rect x="100" y="112" width="8" height="18" rx="3" fill="#d97706" />
  <rect x="114" y="112" width="8" height="18" rx="3" fill="#d97706" />

  <!-- Corpo em Oscilação Posterior / Anterior (Rocking) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -14,6; 0,0" dur="2.4s" repeatCount="indefinite" />

    <!-- Braços que absorvem o movimento -->
    <path d="M104,115 L118,92" stroke="#d97706" stroke-width="5.5" stroke-linecap="round" />
    <path d="M118,115 L128,92" stroke="#d97706" stroke-width="5.5" stroke-linecap="round" />

    <!-- Tronco e Cabeça -->
    <circle cx="112" cy="74" r="8" fill="#d97706" />
    <path d="M107,70 C107,64 117,64 117,70 L115,76 L109,76 Z" fill="#78350f" />
    <path d="M116,84 C118,78 148,78 152,84 L165,116 C162,120 128,122 122,116 Z" fill="url(#kitGrad)" />

    <!-- Calções / Bacia que Recua para o Calcanhar -->
    <path d="M148,112 L172,110 L168,128 L142,126 Z" fill="#0f172a" />

    <!-- Joelho de Apoio (Flexão que Aprofunda no Rocking) -->
    <path d="M152,122 L142,142 C138,145 130,145 128,140 L140,124 Z" fill="#b45309" />
  </g>

  <!-- Vetores Dinâmicos de Oscilação Posterior -->
  <g filter="url(#dropShadow)">
    <path d="M175,100 L150,108" stroke="#2563eb" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.4s" repeatCount="indefinite" />
    </path>
    <polygon points="148,103 142,110 152,113" fill="#2563eb">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.4s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Live Loop Badge -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.85" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>