<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glowAdductor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solo Pavilhão / Ginásio GVFC -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="152" x2="320" y2="152" stroke="#1e293b" stroke-width="2" />
  <rect x="0" y="152" width="320" height="28" fill="#0b1120" />
  <rect x="50" y="156" width="32" height="15" fill="none" stroke="#eab308" stroke-width="2" opacity="0.75" rx="1" />
  <rect x="90" y="156" width="32" height="15" fill="none" stroke="#eab308" stroke-width="2" opacity="0.75" rx="1" />
  <rect x="198" y="156" width="32" height="15" fill="none" stroke="#eab308" stroke-width="2" opacity="0.75" rx="1" />
  <rect x="238" y="156" width="32" height="15" fill="none" stroke="#eab308" stroke-width="2" opacity="0.75" rx="1" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(204, 10)">
    <rect x="0" y="0" width="104" height="19" rx="9.5" fill="#0f172a" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.2" />
    <circle cx="12" cy="9.5" r="4" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.2;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="13" fill="#fca5a5" font-size="8.5" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">3.1 • PARA DENTRO</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 16)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#ef4444" />
    <text x="14" y="8" fill="#f1f5f9" font-size="8.5" font-weight="800" font-family="Inter, system-ui, sans-serif">EM DUPLA • EMPURRAR PARA DENTRO (ADUTORES)</text>
  </g>

  <!-- Sombras no chão sob os atletas -->
  <ellipse cx="80" cy="151" rx="32" ry="5" fill="#000000" opacity="0.6" />
  <ellipse cx="240" cy="151" rx="32" ry="5" fill="#000000" opacity="0.6" />
  <ellipse cx="160" cy="148" rx="26" ry="4" fill="#000000" opacity="0.5" />

  <!-- ==================== ATLETA 1 (ESQUERDA) ==================== -->
  <g id="athlete-left">
    <!-- Cabeça e Pescoço -->
    <path d="M64 50 L67 57" stroke="#f6ad55" stroke-width="4.5" />
    <circle cx="62" cy="42" r="8.5" fill="#f6ad55" />
    <path d="M56 37 C56 32, 67 32, 68 38 C65 37, 60 37, 56 37 Z" fill="#1e293b" />
    <!-- Tronco em V-Sit com t-shirt preta e símbolo amarelo -->
    <path d="M56 58 L80 66 L66 114 L46 106 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M64 76 Q70 74 74 82" stroke="#eab308" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M46 106 L66 114 L76 132 L52 134 Z" fill="#020617" stroke="#1e293b" stroke-width="1.2" />

    <!-- Braços em guarda / equilíbrio de tronco -->
    <path d="M70 70 L88 76 L84 64" stroke="#f6ad55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M60 72 L76 82 L74 72" stroke="#f6ad55" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

    <!-- Perna de apoio fletida no solo -->
    <path d="M60 120 L84 102 L96 142" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="96" cy="143" rx="8" ry="3.5" fill="#334155" />

    <!-- Perna Direita (Estendida por dentro) -->
    <path d="M70 124 L114 126" stroke="#0f172a" stroke-width="11" stroke-linecap="round" />
    <path d="M114 126 L154 136" stroke="#f6ad55" stroke-width="8.5" stroke-linecap="round" />
    <rect x="146" y="132" width="7" height="9" fill="#f8fafc" rx="1" />
    <ellipse cx="156" cy="138" rx="8" ry="4" fill="#1e293b" />
  </g>

  <!-- ==================== ATLETA 2 (DIREITA - EM FOCO: EMPURRA PARA DENTRO) ==================== -->
  <g id="athlete-right">
    <!-- Cabeça e Pescoço -->
    <path d="M256 50 L253 57" stroke="#f6ad55" stroke-width="4.5" />
    <circle cx="258" cy="42" r="8.5" fill="#f6ad55" />
    <path d="M264 37 C264 32, 253 32, 252 38 C255 37, 260 37, 264 37 Z" fill="#1e293b" />
    <!-- Tronco em V-Sit -->
    <path d="M264 58 L240 66 L254 114 L274 106 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M256 76 Q250 74 246 82" stroke="#eab308" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M274 106 L254 114 L244 132 L268 134 Z" fill="#020617" stroke="#1e293b" stroke-width="1.2" />

    <!-- Braços em guarda -->
    <path d="M250 70 L232 76 L236 64" stroke="#f6ad55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M260 72 L244 82 L246 72" stroke="#f6ad55" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

    <!-- Perna de apoio fletida -->
    <path d="M260 120 L236 102 L224 142" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="224" cy="143" rx="8" ry="3.5" fill="#334155" />

    <!-- PERNA INTERLAÇADA POR FORA: EMPURRA FORTE PARA DENTRO (ADUTORES) -->
    <!-- Coxa / Adutor da perna esquerda da atleta direita em tensão máxima -->
    <path d="M250 124 L200 126" stroke="#0f172a" stroke-width="11" stroke-linecap="round" />
    <!-- Tíbia por cima / por fora da perna do colega -->
    <path d="M200 126 L158 134" stroke="#f6ad55" stroke-width="9" stroke-linecap="round" />
    <!-- Meia e Sapatilha Verde passando por fora do tornozelo do colega e esmagando para dentro -->
    <rect x="156" y="130" width="7" height="9" fill="#f8fafc" rx="1" />
    <ellipse cx="152" cy="136" rx="9" ry="4.5" fill="#059669" stroke="#10b981" stroke-width="1" />
    <path d="M148 135 L156 134" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />

    <!-- DESTAQUE DO ADUTOR ATIVO (GLOW VERMELHO/OURO DE ALTA TENSÃO) -->
    <circle cx="216" cy="125" r="6" fill="#ef4444" filter="url(#glowAdductor)" opacity="0.95">
      <animate attributeName="r" values="5;7.5;5" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.95;0.5;0.95" dur="0.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== ZONA DE FORÇA: SETAS DE EMPURRÃO PARA DENTRO ==================== -->
  <g transform="translate(150, 96)">
    <!-- Fundo de destaque para a seta -->
    <rect x="-65" y="0" width="130" height="20" rx="10" fill="#0f172a" fill-opacity="0.95" stroke="#ef4444" stroke-width="1.2" />
    <!-- Seta apontando PARA DENTRO (da direita para o centro/esquerda) -->
    <path d="M40 10 L-10 10" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <path d="M-6 6 L-12 10 L-6 14" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="12" y="13.5" fill="#fca5a5" font-size="7" font-weight="900" font-family="Inter, sans-serif" text-anchor="middle">EMPURRAR P/ DENTRO</text>
  </g>

  <!-- BADGES DE CLASSIFICAÇÃO TÉCNICA -->
  <g transform="translate(14, 134)">
    <rect x="0" y="0" width="126" height="18" rx="5" fill="#0f172a" fill-opacity="0.9" stroke="#ef4444" stroke-width="1" />
    <text x="63" y="12" fill="#fca5a5" font-size="7.5" font-weight="800" font-family="Inter, sans-serif" text-anchor="middle">FOCO: ADUTORES (CONTRAÇÃO)</text>
  </g>

  <g transform="translate(180, 134)">
    <rect x="0" y="0" width="126" height="18" rx="5" fill="#0f172a" fill-opacity="0.9" stroke="#475569" stroke-width="0.8" />
    <text x="63" y="12" fill="#cbd5e1" font-size="7.5" font-weight="800" font-family="Inter, sans-serif" text-anchor="middle">COLEGA RESISTE POR DENTRO</text>
  </g>
</svg>
