<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <rect x="180" y="96" width="105" height="12" rx="3" fill="#0284c7" filter="url(#dropShadow)" />
  <line x1="200" y1="108" x2="200" y2="148" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <line x1="265" y1="108" x2="265" y2="148" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <ellipse cx="150" cy="154" rx="85" ry="7" fill="#0f172a" opacity="0.2" />
  <line x1="68" y1="148" x2="90" y2="148" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <line x1="72" y1="148" x2="88" y2="114" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
  <path d="M88,114 L145,102" stroke="url(#kitGrad)" stroke-width="13" stroke-linecap="round" />
  <ellipse cx="148" cy="101" rx="10" ry="7" fill="#0f172a" />
  <circle cx="68" cy="106" r="7.5" fill="#d97706" />
  <line x1="152" y1="100" x2="210" y2="94" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <circle cx="210" cy="94" r="5" fill="#0f172a" />
  <line x1="210" y1="94" x2="255" y2="94" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
  <ellipse cx="258" cy="93" rx="8" ry="3.5" fill="#ffffff" />
  <g>
    <animateTransform attributeName="transform" type="rotate" values="18 152 105; 0 152 105; 0 152 105; 18 152 105" keyTimes="0; 0.45; 0.6; 1" dur="2.4s" repeatCount="indefinite" />
    <line x1="152" y1="105" x2="202" y2="108" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" />
    <circle cx="202" cy="108" r="4.5" fill="#0f172a" />
    <line x1="202" y1="108" x2="246" y2="110" stroke="#d97706" stroke-width="5.5" stroke-linecap="round" />
    <ellipse cx="249" cy="110" rx="7" ry="3" fill="#64748b" />
    <path d="M185,124 L185,108 M182,112 L185,108 L188,112" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">COPENHAGEN</text>
  </g>
</svg>
