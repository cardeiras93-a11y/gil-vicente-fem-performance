<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Limpo e Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Tapete Azul -->
  <polygon points="35,118 285,118 305,162 15,162" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <!-- Sombra Projetada -->
  <ellipse cx="160" cy="150" rx="80" ry="10" fill="#0f172a" opacity="0.22" />

  <!-- Atleta Sentada com Perna Estendida no Tapete (Flexão Plantar) -->
  <!-- Cabeça e Cabelo -->
  <circle cx="85" cy="72" r="8" fill="#d97706" />
  <path d="M80,68 C80,62 90,62 90,68 L88,74 L82,74 Z" fill="#78350f" />

  <!-- Tronco Ligeiramente Inclinado / Camisola Gil Vicente FC -->
  <path d="M78,80 C78,75 104,75 104,80 L100,122 C94,124 84,124 78,122 Z" fill="url(#kitGrad)" />

  <!-- Calções / Bacia no Chão -->
  <path d="M90,118 L118,116 L112,134 L90,134 Z" fill="#0f172a" />

  <!-- Coxa e Canela Estendidas para a Direita -->
  <path d="M112,118 L175,118 L175,128 L112,128 Z" fill="#d97706" />
  <path d="M175,118 L235,120 L235,128 L175,128 Z" fill="#d97706" />

  <!-- Pé com Ponta Empurrada para Baixo / Frente (Flexão Plantar Ativa) -->
  <path d="M235,120 L252,125 L250,131 L235,128 Z" fill="#ffffff" filter="url(#dropShadow)" />
  <ellipse cx="236" cy="127" rx="3.5" ry="2" fill="#0f172a" /> <!-- Calcanhar -->

  <!-- Banda Elástica Laranja no Metatarso do Pé, Segura com as Duas Mãos -->
  <path d="M135,100 L250,127" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" />
  <path d="M138,103 L248,130" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Braços da Atleta a Segurar a Banda -->
  <path d="M95,90 L135,100" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="136" cy="100" r="3.5" fill="#d97706" />

  <!-- Vetores de Movimento (Seta para a frente / baixo na ponta do pé) -->
  <g filter="url(#dropShadow)">
    <path d="M245,114 L258,118" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
    <polygon points="256,114 263,120 254,121" fill="#2563eb" />
    <path d="M230,110 L215,107" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
