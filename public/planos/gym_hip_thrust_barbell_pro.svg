<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="benchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Fundo do Ginásio -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Sombra no solo -->
  <ellipse cx="165" cy="150" rx="80" ry="7" fill="#0f172a" opacity="0.2" />

  <!-- Banco Acolchoado Atrás das Costas -->
  <rect x="44" y="98" width="54" height="47" rx="4" fill="url(#benchGrad)" filter="url(#dropShadow)" />
  <rect x="46" y="93" width="50" height="9" rx="3" fill="#0284c7" />

  <!-- Cabeça e Omoplatas Apoiadas no Banco (Pivô Fixo) -->
  <circle cx="82" cy="88" r="8" fill="#d97706" />
  <path d="M75,85 C75,78 88,78 88,85 Z" fill="#78350f" />

  <!-- Pés e Canelas Verticais a 90° -->
  <line x1="216" y1="96" x2="216" y2="145" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <rect x="208" y="142" width="20" height="6" rx="3" fill="#1e3a8a" />

  <!-- ==================== POSIÇÃO INICIAL GHOST (Bacia em baixo / Inflexão) ==================== -->
  <g opacity="0.38">
    <!-- Tronco descido -->
    <path d="M88,96 L150,126" stroke="#1e3a8a" stroke-width="10" stroke-dasharray="3,3" stroke-linecap="round" />
    <!-- Bacia descida -->
    <circle cx="150" cy="126" r="8" fill="#0f172a" />
    <!-- Coxas a subir para os joelhos -->
    <path d="M150,126 L216,98" stroke="#d97706" stroke-width="7" stroke-dasharray="3,3" stroke-linecap="round" />
    <!-- Barra e discos na posição baixa -->
    <circle cx="150" cy="122" r="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2,2" />
    <rect x="144" y="117" width="12" height="10" rx="2" fill="#64748b" opacity="0.5" />
  </g>

  <!-- ==================== POSIÇÃO FINAL ATIVA (Extensão Terminal 180°) ==================== -->
  <!-- Tronco Horizontal Alinhado -->
  <path d="M88,92 L150,92 L150,104 L88,104 Z" fill="url(#kitGrad)" />

  <!-- Calções / Glúteos em Contração Máxima -->
  <path d="M148,91 L174,91 L172,106 L148,106 Z" fill="#0f172a" />
  <!-- Destaque muscular Glúteo Maior -->
  <circle cx="160" cy="100" r="6" fill="#ef4444" opacity="0.85" />

  <!-- Coxas em Extensão Completa -->
  <path d="M172,96 L216,96" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
  <circle cx="216" cy="96" r="4.5" fill="#d97706" />

  <!-- Barra Olímpica com Proteção de Espuma Azul sobre a Bacia -->
  <line x1="144" y1="93" x2="182" y2="93" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <rect x="154" y="83" width="16" height="20" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.2" filter="url(#dropShadow)" />
  <!-- Discos de 20kg (Bumper Plates Vermelhos) -->
  <circle cx="162" cy="93" r="14" fill="none" stroke="#dc2626" stroke-width="4.5" />
  <circle cx="162" cy="93" r="4" fill="#1e293b" />

  <!-- Mãos a segurar a barra -->
  <ellipse cx="162" cy="85" rx="4" ry="4" fill="#d97706" />

  <!-- ==================== VETOR DE MOVIMENTO / ELEVAÇÃO PÉLVICA ==================== -->
  <!-- Trajetória do movimento com seta vertical potente -->
  <g filter="url(#dropShadow)">
    <!-- Linha curva de arco do quadril -->
    <path d="M140,126 Q138,105 140,82" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
    <polygon points="140,74 134,84 146,84" fill="#2563eb" />
  </g>

  <!-- Tag Identificadora -->
  <rect x="230" y="15" width="78" height="18" rx="4" fill="#0f172a" opacity="0.85" />
  <text x="269" y="27" fill="#38bdf8" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">HIP THRUST</text>
</svg>