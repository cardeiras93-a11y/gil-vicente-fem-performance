<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Pé de Apoio Central e Linhas de Estrela em 8 Direções -->
  <circle cx="160" cy="140" r="32" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3" />
  <ellipse cx="160" cy="140" rx="9" ry="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <line x1="160" y1="140" x2="160" y2="82" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
  <ellipse cx="160" cy="82" rx="10" ry="7" fill="#0f172a" />
  <path d="M152,42 L168,42 L165,82 L155,82 Z" fill="url(#kitGrad)" />
  <circle cx="160" cy="32" r="7.5" fill="#d97706" />
  <!-- Perna Flutuante Tocando nos Pontos Cardeais da Estrela -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 160 82; 25 160 82; -25 160 82; 0 160 82" keyTimes="0; 0.35; 0.7; 1" dur="3s" repeatCount="indefinite" />
    <line x1="160" y1="82" x2="190" y2="135" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <circle cx="190" cy="135" r="4.5" fill="#06b6d4" />
  </g>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">STAR EXCURSION</text>
  </g>
</svg>
