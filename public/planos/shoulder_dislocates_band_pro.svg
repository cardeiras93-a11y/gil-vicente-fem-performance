<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(210, 10)">
    <rect x="0" y="0" width="102" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, sans-serif" font-weight="900" text-anchor="middle">FACE PULL W</text>
  </g>


  <rect x="35" y="25" width="14" height="130" fill="url(#poleGrad)" rx="2" />
  <circle cx="42" cy="70" r="4.5" fill="#0284c7" />
  <ellipse cx="180" cy="154" rx="45" ry="7" fill="#0f172a" opacity="0.22" />
  <line x1="172" y1="95" x2="168" y2="148" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <line x1="185" y1="95" x2="195" y2="148" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <path d="M172,55 L188,55 L185,95 L170,95 Z" fill="url(#kitGrad)" />
  <circle cx="180" cy="42" r="7.5" fill="#d97706" />
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 22 0; 22 0; 0 0" keyTimes="0; 0.45; 0.65; 1" dur="2.6s" repeatCount="indefinite" />
    <path d="M178,60 L200,68 L195,50" stroke="#d97706" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="195" cy="50" r="4.5" fill="#ea580c" />
  </g>
  <line x1="42" y1="70" x2="195" y2="50" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round">
    <animate attributeName="x2" values="195; 217; 217; 195" keyTimes="0; 0.45; 0.65; 1" dur="2.6s" repeatCount="indefinite" />
  </line>

</svg>
