<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Fundo do Ginásio -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Sombra no solo -->
  <ellipse cx="155" cy="152" rx="75" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Torre de Cargas / Seletor (à esquerda) -->
  <rect x="25" y="30" width="30" height="118" rx="3" fill="url(#machGrad)" filter="url(#dropShadow)" />
  <line x1="32" y1="42" x2="48" y2="42" stroke="#94a3b8" stroke-width="2" />
  <line x1="32" y1="52" x2="48" y2="52" stroke="#94a3b8" stroke-width="2" />
  <line x1="32" y1="62" x2="48" y2="62" stroke="#ef4444" stroke-width="2.5" />
  <line x1="32" y1="72" x2="48" y2="72" stroke="#94a3b8" stroke-width="2" />
  <line x1="32" y1="82" x2="48" y2="82" stroke="#94a3b8" stroke-width="2" />
  <!-- Cabo da torre -->
  <line x1="40" y1="30" x2="40" y2="18" stroke="#64748b" stroke-width="2" />
  <line x1="40" y1="18" x2="162" y2="18" stroke="#64748b" stroke-width="2" />
  <line x1="162" y1="18" x2="162" y2="105" stroke="#64748b" stroke-width="2" />

  <!-- Estrutura do Banco e Pernas de Apoio -->
  <line x1="88" y1="116" x2="88" y2="148" stroke="#475569" stroke-width="7" stroke-linecap="round" />
  <line x1="142" y1="116" x2="142" y2="148" stroke="#475569" stroke-width="7" stroke-linecap="round" />
  <rect x="80" y="145" width="75" height="5" rx="2" fill="#1e293b" />

  <!-- Encosto e Assento da Máquina (Almofadas Azul Cyan #0284c7) -->
  <rect x="86" y="52" width="12" height="54" rx="3" fill="#0284c7" filter="url(#dropShadow)" />
  <rect x="92" y="104" width="56" height="12" rx="3" fill="#0284c7" filter="url(#dropShadow)" />

  <!-- Manípulos Laterais para Estabilidade das Mãos -->
  <line x1="112" y1="88" x2="116" y2="108" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="116" cy="110" r="3.5" fill="#334155" />

  <!-- Atleta Sentada: Cabeça e Tronco Apoiados -->
  <circle cx="106" cy="44" r="8.5" fill="#d97706" />
  <path d="M99,40 C99,32 113,32 113,40 Z" fill="#78350f" />
  <!-- Tronco firme no encosto -->
  <path d="M102,54 L122,54 L120,95 L102,95 Z" fill="url(#kitGrad)" />

  <!-- Bacia nos Calções -->
  <path d="M102,95 L128,95 L126,108 L102,108 Z" fill="#0f172a" />

  <!-- Coxa Apoiada Horizontalmente no Assento -->
  <path d="M124,103 L166,103" stroke="#d97706" stroke-width="9.5" stroke-linecap="round" />

  <!-- Foco Muscular no Quadricípete (Vastos e Reto Femoral Ativos) -->
  <path d="M128,98 L160,98" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

  <!-- Eixo de Rotação da Máquina (Cam de Carga Coincidente com o Joelho) -->
  <circle cx="166" cy="103" r="6" fill="#334155" stroke="#0284c7" stroke-width="2" />

  <!-- Braço de Alavanca da Máquina com Rolo na Tíbia Anterior -->
  <!-- Posição em Extensão Ativa (Quase Horizontal / Subida Potente) -->
  <line x1="166" y1="103" x2="216" y2="92" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
  
  <!-- Perna / Tíbia em Extensão de Joelho (~15° da horizontal) -->
  <path d="M166,103 L218,92" stroke="#d97706" stroke-width="8" stroke-linecap="round" />

  <!-- Rolo Almofadado da Máquina apoiado no peito do pé / tíbia inferior -->
  <circle cx="212" cy="86" r="7.5" fill="#0284c7" stroke="#0369a1" stroke-width="2" filter="url(#dropShadow)" />

  <!-- Sapatilha da Atleta em Dorsiflexão -->
  <path d="M214,84 L228,81 L230,90 L216,92 Z" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.2" />

  <!-- ==================== POSIÇÃO GHOST INICIAL (Perna Fletida a 90° em Baixo) ==================== -->
  <g opacity="0.38">
    <path d="M166,103 L166,140" stroke="#d97706" stroke-width="7" stroke-dasharray="3,3" stroke-linecap="round" />
    <circle cx="166" cy="140" r="4.5" fill="#94a3b8" />
    <circle cx="166" cy="136" r="7" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2,2" />
    <rect x="160" y="140" width="14" height="5" rx="2" fill="#64748b" />
  </g>

  <!-- ==================== VETOR DE MOVIMENTO / ARCO DE EXTENSÃO ==================== -->
  <g filter="url(#dropShadow)">
    <path d="M174,136 Q206,128 210,100" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
    <polygon points="214,92 204,100 213,103" fill="#2563eb" />
  </g>

  <!-- Tag Identificadora -->
  <rect x="210" y="15" width="98" height="18" rx="4" fill="#0f172a" opacity="0.85" />
  <text x="259" y="27" fill="#38bdf8" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">CADEIRA EXTENSORA</text>
</svg>
