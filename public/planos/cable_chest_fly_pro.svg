<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Torres Laterais de Cabos (Esquerda e Direita) -->
  <rect x="20" y="25" width="18" height="120" rx="2" fill="#334155" filter="url(#dropShadow)" />
  <rect x="282" y="25" width="18" height="120" rx="2" fill="#334155" filter="url(#dropShadow)" />
  <!-- Roldanas à Altura do Peito -->
  <circle cx="38" cy="70" r="5" fill="#0284c7" />
  <circle cx="282" cy="70" r="5" fill="#0284c7" />

  <!-- Sombra no solo -->
  <ellipse cx="160" cy="150" rx="50" ry="6" fill="#0f172a" opacity="0.2" />

  <!-- Cabos em Direção às Mãos -->
  <line x1="38" y1="70" x2="135" y2="82" stroke="#0284c7" stroke-width="1.8" />
  <line x1="282" y1="70" x2="175" y2="82" stroke="#0284c7" stroke-width="1.8" />

  <!-- Pernas em Passo Dividido (B-Stance para Estabilidade) -->
  <line x1="152" y1="102" x2="142" y2="145" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" />
  <line x1="168" y1="102" x2="182" y2="142" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <rect x="136" y="142" width="16" height="5" rx="2.5" fill="#ffffff" />
  <rect x="178" y="140" width="16" height="5" rx="2.5" fill="#ffffff" />

  <!-- Calções / Bacia -->
  <path d="M148,88 L172,88 L168,104 L148,104 Z" fill="#0f172a" />

  <!-- Tronco Inclinado 15° à Frente -->
  <path d="M146,54 L174,54 L170,90 L146,90 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo -->
  <circle cx="160" cy="42" r="8" fill="#d97706" />
  <path d="M154,38 C154,32 166,32 166,38 Z" fill="#78350f" />

  <!-- Braços Abertos a Fechar em Abraço à Frente do Peito (Cotovelos Semi-fletidos) -->
  <path d="M148,58 Q130,68 140,82" stroke="#b45309" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M172,58 Q190,68 180,82" stroke="#d97706" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Manípulos seguros à frente -->
  <ellipse cx="142" cy="82" rx="3.5" ry="3.5" fill="#d97706" />
  <ellipse cx="178" cy="82" rx="3.5" ry="3.5" fill="#d97706" />

  <!-- Destaque Muscular Peitoral Maior (Fecho Central) -->
  <ellipse cx="160" cy="68" rx="8" ry="6" fill="#ef4444" opacity="0.8" />

  <!-- Setas Convergentes de Fecho dos Braços à Frente -->
  <g filter="url(#dropShadow)">
    <path d="M120,68 Q135,76 146,80" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="144,75 152,81 143,84" fill="#2563eb" />
    <path d="M200,68 Q185,76 174,80" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="177,84 168,81 176,75" fill="#2563eb" />
  </g>
</svg>