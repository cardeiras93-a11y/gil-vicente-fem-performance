<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes rdlHinge {
      0%, 100% {
        transform: rotate(-12deg);
      }
      50% {
        transform: rotate(14deg);
      }
    }
    @keyframes rdlDownArrow {
      0%, 100% {
        transform: translateY(-4px);
        opacity: 0.5;
      }
      50% {
        transform: translateY(6px);
        opacity: 1;
      }
    }
    .anim-rdl-torso {
      transform-origin: 134px 84px;
      animation: rdlHinge 3s ease-in-out infinite alternate;
    }
    .anim-rdl-arrow {
      animation: rdlDownArrow 3s ease-in-out infinite alternate;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-rdl-torso, .anim-rdl-arrow {
        animation: none !important;
      }
    }
  </style>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1" />

  <!-- Plataforma de Borracha no Solo -->
  <rect x="35" y="142" width="250" height="10" rx="3" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <rect x="33" y="140" width="254" height="3" rx="1" fill="#ef4444" />

  <!-- Sombra Projetada dos Pés e do Corpo -->
  <ellipse cx="160" cy="151" rx="55" ry="6" fill="#0f172a" opacity="0.25" />

  <!-- Perna Esquerda (Fundo) -->
  <path d="M128,84 L144,116 L140,146" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="136" y="144" width="16" height="5" rx="2.5" fill="#e2e8f0" />

  <!-- Perna Direita (Joelhos a 15-20°, tíbia vertical firme) -->
  <path d="M134,84 L152,116 L148,146" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="144" y="144" width="18" height="5" rx="2.5" fill="#ffffff" />
  <rect x="146" y="145" width="14" height="2" fill="#ef4444" />

  <!-- Destaque Muscular Excêntrico nos Isquiotibiais e Glúteos -->
  <line x1="130" y1="88" x2="148" y2="114" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="126" cy="85" r="5" fill="#ef4444" opacity="0.75" />

  <!-- Calções Recuados em Dobradiça da Anca -->
  <path d="M116,72 L142,76 L136,94 L114,86 Z" fill="#0f172a" />

  <!-- SEGMENTO DINÂMICO DE DOBRADIÇA DA ANCA (HIP HINGE & DESCIDA DOS HALTERES) -->
  <g class="anim-rdl-torso">
    <!-- Tronco Inclinado com Coluna Neutra -->
    <path d="M136,74 L192,56 L196,70 L140,88 Z" fill="url(#kitGrad)" />

    <!-- Cabeça e Cabelo (Olhar a acompanhar a coluna) -->
    <circle cx="204" cy="52" r="8" fill="#d97706" />
    <path d="M198,47 C200,40 210,42 210,48 L207,56 L201,56 Z" fill="#78350f" />

    <!-- Braço Esquerdo (Haltere de trás) -->
    <path d="M176,66 L174,108" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
    <g filter="url(#dropShadow)">
      <rect x="164" y="102" width="6" height="15" rx="2" fill="#1e293b" />
      <rect x="180" y="102" width="6" height="15" rx="2" fill="#1e293b" />
      <line x1="168" y1="109" x2="182" y2="109" stroke="#94a3b8" stroke-width="3.5" />
    </g>

    <!-- Braço Direito (Haltere da frente) -->
    <path d="M184,66 L180,112" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="180" cy="112" rx="4" ry="4" fill="#0f172a" />
    <g filter="url(#dropShadow)">
      <rect x="169" y="106" width="7" height="17" rx="2" fill="#0f172a" />
      <rect x="187" y="106" width="7" height="17" rx="2" fill="#0f172a" />
      <line x1="174" y1="114" x2="189" y2="114" stroke="#cbd5e1" stroke-width="4" />
    </g>
  </g>

  <!-- Vetores de Força & Dobradiça da Anca -->
  <g filter="url(#dropShadow)">
    <path d="M108,78 L84,78" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="87,74 78,78 87,82" fill="#2563eb" />
    <text x="65" y="72" fill="#1e3a8a" font-size="8" font-weight="900" letter-spacing="0.5">ANCA ATRÁS</text>

    <!-- Seta Dinâmica de Descida Excêntrica -->
    <g class="anim-rdl-arrow">
      <line x1="202" y1="80" x2="202" y2="102" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
      <polygon points="199,98 202,106 205,98" fill="#2563eb" />
      <text x="208" y="94" fill="#2563eb" font-size="7.5" font-weight="900">DESCIDA 3s</text>
    </g>
  </g>
</svg>
