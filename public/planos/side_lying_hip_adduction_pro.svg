<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes sideAdductLift {
      0%, 100% {
        transform: rotate(5deg);
      }
      50% {
        transform: rotate(-16deg);
      }
    }
    @keyframes sideAdductArrow {
      0%, 100% {
        transform: translateY(4px);
        opacity: 0.5;
      }
      50% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }
    .anim-adduct-leg {
      transform-origin: 165px 125px;
      animation: sideAdductLift 2.6s ease-in-out infinite;
    }
    .anim-side-arrow {
      animation: sideAdductArrow 2.6s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-adduct-leg, .anim-side-arrow {
        animation: none !important;
      }
    }
  </style>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="152" x2="320" y2="152" stroke="#cbd5e1" stroke-width="1" />

  <!-- Tapete de Solo -->
  <rect x="25" y="134" width="270" height="15" rx="3" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <rect x="23" y="132" width="274" height="4" rx="1.5" fill="#0284c7" />

  <!-- Sombra no Tapete -->
  <ellipse cx="150" cy="142" rx="105" ry="6" fill="#0f172a" opacity="0.32" />

  <!-- Braço de Baixo a Apoiar a Cabeça -->
  <path d="M42,130 L78,130" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  
  <!-- Cabeça e Cabelo -->
  <circle cx="74" cy="120" r="8" fill="#d97706" />
  <path d="M68,116 C68,109 80,109 80,116 L78,124 L70,124 Z" fill="#78350f" />

  <!-- Tronco Alinhado em Decúbito Lateral -->
  <path d="M82,120 L146,116 L148,132 L84,134 Z" fill="url(#kitGrad)" />

  <!-- Braço de Cima Fletido (Mão no solo para estabilidade) -->
  <path d="M106,120 L118,132 L112,136" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <ellipse cx="112" cy="136" rx="3.5" ry="2" fill="#d97706" />

  <!-- Bacia / Calções -->
  <path d="M142,114 L170,112 L168,132 L144,132 Z" fill="#0f172a" />

  <!-- Perna de Cima (Cruzada à Frente, Joelho Fletido, Pé no Chão) -->
  <path d="M156,114 L178,92 L185,134" stroke="#b45309" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="180" y="132" width="14" height="5" rx="2" fill="#ffffff" />
  <rect x="182" y="133" width="10" height="2" fill="#ef4444" />

  <!-- Posição de Saída Tracejada da Perna Inferior -->
  <path d="M165,127 L250,131" stroke="#94a3b8" stroke-width="5" stroke-dasharray="4,3" stroke-linecap="round" opacity="0.4" />

  <!-- PERNA DE BAIXO DINÂMICA (ELEVAÇÃO CONTÍNUA EM ADUÇÃO) -->
  <g class="anim-adduct-leg">
    <path d="M165,125 L252,98" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <rect x="248" y="93" width="16" height="6" rx="2" transform="rotate(-18 256 96)" fill="#ffffff" />
    <rect x="250" y="95" width="12" height="2" transform="rotate(-18 256 96)" fill="#ef4444" />

    <!-- Destaque Muscular Adutor -->
    <ellipse cx="198" cy="115" rx="10" ry="4.5" transform="rotate(-18 198 115)" fill="#ef4444" opacity="0.85" />
  </g>

  <!-- Vetores Dinâmicos de Elevação em Adução -->
  <g filter="url(#dropShadow)" class="anim-side-arrow">
    <!-- Arco de Elevação -->
    <path d="M228,128 Q238,118 234,106" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="230,110 235,102 238,111" fill="#2563eb" />
    
    <!-- Seta Vertical de Força dos Adutores -->
    <line x1="198" y1="126" x2="198" y2="106" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
    <polygon points="195,109 198,103 201,109" fill="#2563eb" />
  </g>

  <g filter="url(#dropShadow)">
    <text x="215" y="85" fill="#1e3a8a" font-size="8.5" font-weight="900" letter-spacing="0.5">ADUÇÃO ATIVA</text>
  </g>
</svg>
