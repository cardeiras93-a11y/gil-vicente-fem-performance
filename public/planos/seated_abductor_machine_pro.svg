<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="150" x2="320" y2="150" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(180, 10)">
    <rect x="0" y="0" width="132" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="73" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" text-anchor="middle">ABDUCTOR MACHINE (GLÚTEO)</text>
  </g>

  <!-- Sombra no solo -->
  <ellipse cx="160" cy="154" rx="75" ry="7" fill="#0f172a" opacity="0.22" />

  <!-- Torre de Cargas -->
  <rect x="145" y="25" width="30" height="65" rx="3" fill="url(#machGrad)" filter="url(#dropShadow)" />
  <!-- Placas de Peso em Elevação -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 -12; 0 0" keyTimes="0; 0.45; 0.65; 1" dur="2.7s" repeatCount="indefinite" />
    <rect x="150" y="48" width="20" height="5" fill="#ef4444" rx="1.5" />
    <rect x="150" y="55" width="20" height="5" fill="#38bdf8" rx="1.5" />
  </g>

  <!-- Assento e Encosto Inclinado à Frente -->
  <rect x="148" y="90" width="24" height="25" rx="4" fill="#0284c7" />
  <!-- Cabeça e Tronco -->
  <circle cx="160" cy="78" r="7.5" fill="#d97706" />

  <!-- Braço Esquerdo da Máquina (Abertura para Fora / Abdução com Almofada Externa) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 160 115; -26 160 115; -26 160 115; 0 160 115" keyTimes="0; 0.45; 0.65; 1" dur="2.7s" repeatCount="indefinite" />
    <line x1="160" y1="115" x2="120" y2="135" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <!-- Almofada Externa da Máquina a Empurrar para Fora -->
    <rect x="108" y="128" width="12" height="15" rx="3" fill="#0284c7" />
    <ellipse cx="112" cy="148" rx="7" ry="3" fill="#ffffff" />
    <!-- Seta de Força para Fora -->
    <path d="M106,135 L92,135 M96,131 L92,135 L96,139" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Braço Direito da Máquina (Abertura para Fora / Abdução com Almofada Externa) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 160 115; 26 160 115; 26 160 115; 0 160 115" keyTimes="0; 0.45; 0.65; 1" dur="2.7s" repeatCount="indefinite" />
    <line x1="160" y1="115" x2="200" y2="135" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <!-- Almofada Externa da Máquina a Empurrar para Fora -->
    <rect x="200" y="128" width="12" height="15" rx="3" fill="#0284c7" />
    <ellipse cx="208" cy="148" rx="7" ry="3" fill="#ffffff" />
    <!-- Seta de Força para Fora -->
    <path d="M214,135 L228,135 M224,131 L228,135 L224,139" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
