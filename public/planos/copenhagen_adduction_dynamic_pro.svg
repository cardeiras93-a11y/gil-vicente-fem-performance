<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="benchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes adductBottomLeg {
      0%, 100% {
        transform: rotate(20deg);
      }
      50% {
        transform: rotate(0deg);
      }
    }
    @keyframes adductorArrowPulse {
      0%, 100% {
        transform: translateY(4px);
        opacity: 0.5;
      }
      50% {
        transform: translateY(-2px);
        opacity: 1;
      }
    }
    .anim-bottom-leg {
      transform-origin: 148px 112px;
      animation: adductBottomLeg 2.6s ease-in-out infinite;
    }
    .anim-adduct-arrow {
      animation: adductorArrowPulse 2.6s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-bottom-leg, .anim-adduct-arrow {
        animation: none !important;
      }
    }
  </style>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="140" x2="320" y2="140" stroke="#cbd5e1" stroke-width="1" />

  <!-- Banco de Musculação Firme -->
  <rect x="200" y="105" width="100" height="42" rx="4" fill="url(#benchGrad)" filter="url(#dropShadow)" />
  <rect x="196" y="103" width="108" height="7" rx="2" fill="#0f172a" />

  <!-- Sombra Projetada -->
  <ellipse cx="140" cy="154" rx="70" ry="8" fill="#0f172a" opacity="0.22" />

  <!-- Antebraço de Apoio no Chão (Estável) -->
  <path d="M70,146 L92,146" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <path d="M82,146 L82,122" stroke="#d97706" stroke-width="5" stroke-linecap="round" />

  <!-- Cabeça e Cabelo -->
  <circle cx="72" cy="110" r="7.5" fill="#d97706" />
  <path d="M68,106 C68,101 76,101 76,106 L74,112 L70,112 Z" fill="#78350f" />

  <!-- Tronco em Prancha Lateral (Alinhado) -->
  <path d="M80,116 L134,106 L136,122 L82,130 Z" fill="url(#kitGrad)" />

  <!-- Calções / Bacia Estável -->
  <path d="M128,104 L154,101 L151,120 L130,122 Z" fill="#0f172a" />

  <!-- Posição de Saída Tracejada da Perna Inferior (Ghosting) -->
  <path d="M148,114 L200,132" stroke="#94a3b8" stroke-width="5" stroke-dasharray="4,3" stroke-linecap="round" opacity="0.4" />
  <circle cx="204" cy="133" r="3" fill="#94a3b8" opacity="0.4" />

  <!-- PERNA INFERIOR DINÂMICA (SUBIDA EM ADUÇÃO ATIVA) -->
  <g class="anim-bottom-leg">
    <path d="M148,112 L206,115" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" />
    <ellipse cx="210" cy="115" rx="4.5" ry="3" fill="#ffffff" />
    <ellipse cx="210" cy="115" rx="2.5" ry="1.5" fill="#ef4444" />
    <!-- Foco Muscular nos Adutores da Perna Móvel -->
    <circle cx="174" cy="114" r="4" fill="#ef4444" opacity="0.9" />
  </g>

  <!-- PERNA SUPERIOR (APOIADA NO BANCO - ADUTOR ISOMÉTRICO) -->
  <path d="M150,102 L218,102 L218,109 L150,107 Z" fill="#b45309" />
  <path d="M218,102 L265,104 L265,109 L218,109 Z" fill="#b45309" />
  <ellipse cx="270" cy="106" rx="5" ry="3" fill="#ffffff" />
  <ellipse cx="270" cy="106" rx="3" ry="1.5" fill="#ef4444" />

  <!-- Destaque Muscular na Perna Superior (Adutor Primário) -->
  <circle cx="168" cy="105" r="4.5" fill="#ef4444" opacity="0.9" />

  <!-- Vetores de Movimento Dinâmico de Adução -->
  <g class="anim-adduct-arrow" filter="url(#dropShadow)">
    <!-- Arco de Adução Dinâmica (Subida da Perna de Baixo) -->
    <path d="M192,135 Q199,126 195,120" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="191,123 195,116 199,122" fill="#2563eb" />
    <!-- Seta de Força Adutora -->
    <line x1="174" y1="128" x2="174" y2="116" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
    <polygon points="171,119 174,113 177,119" fill="#2563eb" />
    <!-- Rótulo do Movimento -->
    <text x="160" y="148" fill="#1e3a8a" font-size="8" font-weight="900" letter-spacing="0.5">ADUÇÃO DINÂMICA</text>
  </g>
</svg>
