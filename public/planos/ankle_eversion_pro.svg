<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <path d="M40,118 L210,118" stroke="#d97706" stroke-width="14" stroke-linecap="round" />
  <path d="M40,115 L120,115" stroke="url(#kitGrad)" stroke-width="16" stroke-linecap="round" />
  <circle cx="210" cy="118" r="8" fill="#d97706" />
  <rect x="290" y="50" width="12" height="100" fill="url(#poleGrad)" rx="2" />
  <circle cx="296" cy="110" r="4" fill="#0284c7" />
  <line x1="296" y1="110" x2="225" y2="100" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round">
    <animate attributeName="x2" values="225; 234; 234; 225" keyTimes="0; 0.4; 0.6; 1" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="y2" values="100; 94; 94; 100" keyTimes="0; 0.4; 0.6; 1" dur="2.2s" repeatCount="indefinite" />
  </line>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 210 118; -22 210 118; -22 210 118; 0 210 118" keyTimes="0; 0.4; 0.6; 1" dur="2.2s" repeatCount="indefinite" />
    <path d="M208,118 L232,96 L242,102 L216,122 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <circle cx="230" cy="98" r="4" fill="#ea580c" />
    <path d="M160,113 L205,113" stroke="#06b6d4" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3; 1; 1; 0.3" keyTimes="0; 0.4; 0.6; 1" dur="2.2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">EVERSÃO BANDA</text>
  </g>
</svg>
