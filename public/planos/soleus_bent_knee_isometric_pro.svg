<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="150" x2="320" y2="150" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(160, 10)">
    <rect x="0" y="0" width="152" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="83" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" text-anchor="middle">ISOMETRIA DE SÓLEO (90°)</text>
  </g>

  <!-- Sombra no solo -->
  <ellipse cx="160" cy="154" rx="65" ry="6" fill="#0f172a" opacity="0.22" />

  <!-- Banco Ginásio (Azul GVFC) -->
  <rect x="90" y="95" width="40" height="12" rx="3" fill="#0284c7" filter="url(#dropShadow)" />
  <line x1="105" y1="107" x2="105" y2="150" stroke="#334155" stroke-width="6" stroke-linecap="round" />

  <!-- Atleta Sentada -->
  <!-- Tronco e Bacia -->
  <ellipse cx="112" cy="98" rx="9" ry="7" fill="#0f172a" />
  <path d="M108,58 L124,58 L122,98 L106,98 Z" fill="url(#kitGrad)" />
  <circle cx="116" cy="46" r="7.5" fill="#d97706" />
  <path d="M110,42 C110,36 122,36 122,42 Z" fill="#78350f" />

  <!-- Braços a pressionar a coxa (sobrecarga manual / peso) -->
  <path d="M116,64 L138,82 L152,86" stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none" />
  <!-- Haltere / Carga sobre o joelho -->
  <rect x="145" y="80" width="18" height="8" rx="2" fill="#1e293b" />
  <circle cx="145" cy="84" r="7" fill="#ef4444" />
  <circle cx="163" cy="84" r="7" fill="#ef4444" />

  <!-- Coxa na Horizontal (Joelho a 90°) -->
  <line x1="112" y1="96" x2="156" y2="92" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />

  <!-- Perna e Tornozelo em Isometria Rígida com Calcanhar Elevado -->
  <line x1="156" y1="92" x2="162" y2="132" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <!-- Músculo Sóleo Profundo Ativado (Foco Vermelho com Pulsação de Tensão Isométrica) -->
  <path d="M158,106 Q166,116 160,126" stroke="#ef4444" stroke-width="5" stroke-linecap="round" fill="none">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="1.8s" repeatCount="indefinite" />
  </path>

  <!-- Antepé Fixo no Solo e Calcanhar Elevado em Isometria (Sem movimento articular) -->
  <ellipse cx="170" cy="147" rx="7" ry="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <line x1="162" y1="132" x2="168" y2="145" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" />

  <!-- Indicador Isométrico (Cadeado / Hold de Tensão Estática) -->
  <g transform="translate(185, 115)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#0f172a" fill-opacity="0.85" stroke="#ef4444" stroke-width="1" />
    <text x="30" y="14" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="900" text-anchor="middle">HOLD 40s</text>
  </g>
</svg>
