<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <ellipse cx="160" cy="152" rx="35" ry="6" fill="#0f172a">
    <animate attributeName="opacity" values="0.3; 0.1; 0.3" dur="0.9s" repeatCount="indefinite" />
    <animate attributeName="rx" values="35; 20; 35" dur="0.9s" repeatCount="indefinite" />
  </ellipse>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -24; 0 0" keyTimes="0; 0.5; 1" dur="0.9s" repeatCount="indefinite" />
    <path d="M152,48 C152,44 168,44 168,48 L166,82 C160,84 156,84 152,82 Z" fill="url(#kitGrad)" />
    <circle cx="160" cy="35" r="7.5" fill="#d97706" />
    <ellipse cx="160" cy="84" rx="10" ry="7" fill="#0f172a" />
    <line x1="155" y1="84" x2="155" y2="138" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <line x1="165" y1="84" x2="165" y2="138" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <ellipse cx="155" cy="142" rx="4" ry="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
    <ellipse cx="165" cy="142" rx="4" ry="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
  </g>

  <!-- Badge Live Animado -->
  <g transform="translate(215, 12)">
    <rect x="0" y="0" width="95" height="18" rx="9" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="9" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="53" y="12.5" fill="#38bdf8" font-size="7.5" font-family="-apple-system, sans-serif" font-weight="800" text-anchor="middle">POGO HOPS</text>
  </g>
</svg>
