<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(210, 10)">
    <rect x="0" y="0" width="102" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, sans-serif" font-weight="900" text-anchor="middle">SPANISH SQUAT</text>
  </g>


  <!-- Rig / Ancoragem -->
  <rect x="30" y="20" width="16" height="135" fill="url(#poleGrad)" filter="url(#dropShadow)" />
  <circle cx="38" cy="116" r="4.5" fill="#0284c7" />

  <!-- Sombra no solo -->
  <ellipse cx="178" cy="154" rx="65" ry="8" fill="#0f172a" opacity="0.22" />

  <!-- Pés Fixos no Solo -->
  <ellipse cx="168" cy="152" rx="10" ry="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <path d="M168,118 L168,150" stroke="#d97706" stroke-width="8" stroke-linecap="round" />

  <!-- Grupo em Movimento: Senta-se profundamente até 70° e sobe -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -22; 0 0; 0 0; 0 -22" keyTimes="0; 0.38; 0.72; 1" dur="2.8s" repeatCount="indefinite" />
    
    <!-- Coxas / Fémur -->
    <path d="M168,118 L224,115 L220,128 L168,126 Z" fill="#d97706" />

    <!-- Calções e Bacia Recuada -->
    <path d="M212,106 L242,106 L238,130 L208,128 Z" fill="#0f172a" />

    <!-- Tronco Totalmente Vertical (Ereto) -->
    <path d="M218,66 C218,62 242,62 242,66 L238,110 C230,112 222,112 218,110 Z" fill="url(#kitGrad)" />

    <!-- Braços à Frente em Contrapeso -->
    <path d="M224,76 L165,80" stroke="#d97706" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="163" cy="80" r="4" fill="#d97706" />

    <!-- Cabeça e Cabelo -->
    <circle cx="230" cy="52" r="8.5" fill="#d97706" />
    <path d="M225,48 C225,42 235,42 235,48 L233,54 L227,54 Z" fill="#78350f" />

    <!-- Pulso Isométrico de Alívio no Tendão Patelar -->
    <circle cx="168" cy="116" r="6" fill="#38bdf8" filter="url(#glowCyan)">
      <animate attributeName="opacity" values="0.2; 1; 1; 0.2" keyTimes="0; 0.38; 0.72; 1" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="4; 8; 8; 4" keyTimes="0; 0.38; 0.72; 1" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Banda Elástica Laranja Esticada sob Tensão -->
  <path d="M46,116 L168,116" stroke="#ea580c" stroke-width="5.5" stroke-linecap="round">
    <animate attributeName="stroke-width" values="4; 7; 7; 4" keyTimes="0; 0.38; 0.72; 1" dur="2.8s" repeatCount="indefinite" />
  </path>

</svg>
