<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba771" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ground plane -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <ellipse cx="160" cy="168" rx="110" ry="8" fill="#94a3b8" opacity="0.4" filter="blur(2px)" />

  <!-- Anchor post on left -->
  <rect x="35" y="20" width="12" height="150" rx="3" fill="#334155" />
  <rect x="33" y="90" width="16" height="8" rx="2" fill="#64748b" />

  <!-- Elastic Band from anchor to hand -->
  <path d="M 45 94 Q 100 94 150 97" fill="none" stroke="#e11d48" stroke-width="4" stroke-linecap="round" filter="url(#dropShadow)" />

  <!-- Athlete Figure (Nicole standing, facing front-three-quarters) -->
  <!-- Legs -->
  <line x1="165" y1="115" x2="158" y2="164" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
  <line x1="185" y1="115" x2="190" y2="164" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
  <!-- Shoes -->
  <rect x="148" y="160" width="20" height="8" rx="4" fill="#e2e8f0" />
  <rect x="182" y="160" width="20" height="8" rx="4" fill="#e2e8f0" />

  <!-- Torso (GVFC Kit) -->
  <rect x="158" y="58" width="32" height="58" rx="10" fill="url(#kitGrad)" filter="url(#dropShadow)" />
  <circle cx="172" cy="68" r="3.5" fill="#e11d48" />

  <!-- Left Arm (support arm, resting comfortably) -->
  <path d="M 160 64 L 148 95 L 145 110" fill="none" stroke="url(#skinGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Axillary Towel Roll under Right Arm -->
  <rect x="182" y="75" width="9" height="16" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />

  <!-- Right Arm (Active External Rotation) -->
  <!-- Upper arm vertical against towel -->
  <path d="M 188 64 L 188 95" fill="none" stroke="url(#skinGrad)" stroke-width="9" stroke-linecap="round" />
  <!-- Elbow joint at 90 deg -->
  <circle cx="188" cy="95" r="5.5" fill="#ea580c" opacity="0.8" />
  <!-- Forearm rotating outward from torso to lateral position -->
  <path d="M 188 95 L 222 96" fill="none" stroke="url(#skinGrad)" stroke-width="8.5" stroke-linecap="round" />
  <!-- Hand gripping band -->
  <circle cx="224" cy="96" r="5" fill="#fba771" />
  <!-- Band extended to hand -->
  <path d="M 150 97 L 224 96" fill="none" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round" />

  <!-- Kinetic Rotation Arc Arrow -->
  <path d="M 198 88 A 20 20 0 0 1 224 88" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-dasharray="3,3" />
  <polygon points="226,85 231,89 226,93" fill="#0284c7" />

  <!-- Neck & Head -->
  <line x1="174" y1="58" x2="174" y2="50" stroke="url(#skinGrad)" stroke-width="7" stroke-linecap="round" />
  <circle cx="174" cy="40" r="13" fill="url(#skinGrad)" filter="url(#dropShadow)" />
  <!-- Hair bun -->
  <circle cx="181" cy="35" r="8" fill="#475569" />

  <!-- Badges / Indicators -->
  <g transform="translate(10, 15)">
    <rect width="120" height="22" rx="6" fill="#0284c7" fill-opacity="0.9" />
    <text x="60" y="15" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">ROTAÇÃO EXTERNA c/ BANDA</text>
  </g>
  <g transform="translate(210, 135)">
    <rect width="100" height="28" rx="6" fill="#0f172a" fill-opacity="0.85" />
    <text x="50" y="13" font-family="sans-serif" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">TOALHA AXILAR</text>
    <text x="50" y="23" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Cotovelo a 90° Estável</text>
  </g>
</svg>