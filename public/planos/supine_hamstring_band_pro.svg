<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Gym floor -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(205, 10)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#ef4444" />
    <text x="14" y="8" fill="#334155" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">ALONGAMENTO ISQUIOS C/ BANDA</text>
  </g>

  
  <!-- Solo com colchonete -->
  <rect x="30" y="142" width="260" height="6" rx="3" fill="#0284c7" />

  <!-- Atleta deitada de costas -->
  <!-- Cabeça e tronco no chão -->
  <circle cx="65" cy="132" r="9" fill="#f6ad55" />
  <path d="M72 136 L150 136" stroke="#1e3a8a" stroke-width="14" stroke-linecap="round" />

  <!-- Perna no chão estendida -->
  <path d="M150 136 L230 136" stroke="#475569" stroke-width="10" stroke-linecap="round" />
  <ellipse cx="232" cy="136" rx="6" ry="3" fill="#0f172a" />

  <!-- Perna em elevação dinâmica com banda no pé -->
  <g>
    <!-- Rotação da perna de 20° a 88° -->
    <animateTransform attributeName="transform" type="rotate" values="0, 150, 136; -70, 150, 136; 0, 150, 136" dur="2.6s" repeatCount="indefinite" />
    <path d="M150 136 L220 136" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    <ellipse cx="222" cy="136" rx="7" ry="4" fill="#0284c7" />
  </g>

  <!-- Banda elástica puxada pelas mãos da atleta -->
  <path d="M110 130 Q160 80 200 70" stroke="#ea580c" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M110 130 Q160 110 220 136; M110 130 Q145 90 172 70; M110 130 Q160 110 220 136" dur="2.6s" repeatCount="indefinite" />
  </path>
  <!-- Braços da atleta segurando a banda -->
  <path d="M95 136 L115 125" stroke="#f6ad55" stroke-width="6" stroke-linecap="round" />

  <text x="210" y="45" fill="#ea580c" font-size="8.5" font-weight="900" font-family="Inter, sans-serif">AMPLITUDE SEGURA</text>

</svg>