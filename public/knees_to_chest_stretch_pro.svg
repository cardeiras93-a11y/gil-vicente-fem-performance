<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,162 10,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="148" rx="80" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Cabeça e Ombros no Solo -->
  <circle cx="82" cy="136" r="8" fill="#d97706" />
  <path d="M75,134 C75,128 88,128 88,134 Z" fill="#78350f" />

  <!-- Costas no Tapete com Lombar Apoiada -->
  <path d="M90,135 L145,137 L142,146 L88,144 Z" fill="url(#kitGrad)" />

  <!-- Bacia e Glúteos Ligeiramente Elevados (Flexão Suave) -->
  <path d="M142,135 C154,130 162,118 156,108 L142,118 C144,126 138,135 142,135 Z" fill="#0f172a" />

  <!-- Coxas puxadas ao peito -->
  <path d="M152,110 L130,88 C126,84 120,90 124,96 L144,116 Z" fill="#d97706" />
  <!-- Canelas e Pés dobrados -->
  <path d="M126,88 L152,80 C156,79 158,85 154,88 L132,96 Z" fill="#b45309" />
  <ellipse cx="156" cy="82" rx="4" ry="3" fill="#ffffff" />

  <!-- Braços a abraçar as canelas -->
  <path d="M112,130 Q122,94 138,86" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round" fill="none" />
  <ellipse cx="138" cy="86" rx="4" ry="4" fill="#d97706" />

  <!-- Foco de Descompressão Lombar -->
  <ellipse cx="138" cy="138" rx="10" ry="5" fill="#38bdf8" opacity="0.45" />

  <!-- Seta de Tração Suave dos Joelhos ao Peito -->
  <g filter="url(#dropShadow)">
    <path d="M146,74 L126,92" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="125,86 120,96 131,93" fill="#2563eb" />
  </g>
</svg>