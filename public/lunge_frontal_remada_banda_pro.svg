<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="postGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes frontFootStep {
      0%, 100% {
        /* De pé atrás (início do movimento) */
        transform: translate(52px, -12px);
      }
      45%, 65% {
        /* Avança o pé no solo e apoia firme em lunge frontal */
        transform: translate(0px, 0px);
      }
    }
    @keyframes backFootPivot {
      0%, 100% {
        /* De pé com calcanhar mais baixo */
        transform: rotate(-15deg);
      }
      45%, 65% {
        /* Em lunge: apoio firme na ponta do pé com calcanhar elevado */
        transform: rotate(25deg);
      }
    }
    @keyframes lungeTorsoSink {
      0%, 100% {
        /* De pé mais elevado e recuado */
        transform: translate(28px, -18px);
      }
      45%, 65% {
        /* Afunda no lunge frontal a 90 graus */
        transform: translate(0px, 0px);
      }
    }
    @keyframes bandRowPullDynamic {
      0%, 100% {
        /* Braço estendido à frente */
        transform: translateX(-16px);
      }
      45%, 65% {
        /* Remada tracionada com cotovelo atrás */
        transform: translateX(14px);
      }
    }
    @keyframes bandStretchCycle {
      0%, 100% {
        transform: scaleX(0.85);
      }
      45%, 65% {
        transform: scaleX(1.15);
      }
    }
    @keyframes footStepFloorArrow {
      0%, 100% {
        transform: translateX(20px);
        opacity: 0.3;
      }
      45%, 65% {
        transform: translateX(0px);
        opacity: 1;
      }
    }
    .anim-front-leg-step {
      animation: frontFootStep 3s ease-in-out infinite;
    }
    .anim-back-foot-pivot {
      transform-origin: 230px 146px;
      animation: backFootPivot 3s ease-in-out infinite;
    }
    .anim-lunge-body-sink {
      animation: lungeTorsoSink 3s ease-in-out infinite;
    }
    .anim-arm-row-dynamic {
      animation: bandRowPullDynamic 3s ease-in-out infinite;
    }
    .anim-band-dynamic {
      transform-origin: 27px 74px;
      animation: bandStretchCycle 3s ease-in-out infinite;
    }
    .anim-foot-arrow {
      animation: footStepFloorArrow 3s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-front-leg-step, .anim-back-foot-pivot, .anim-lunge-body-sink, .anim-arm-row-dynamic, .anim-band-dynamic, .anim-foot-arrow {
        animation: none !important;
      }
    }
  </style>

  <!-- Fundo do Ginásio -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1" />

  <!-- Poste / Rack de Ancoragem da Banda (À Esquerda) -->
  <rect x="20" y="24" width="14" height="124" rx="2" fill="url(#postGrad)" filter="url(#dropShadow)" />
  <circle cx="27" cy="45" r="1.5" fill="#94a3b8" />
  <circle cx="27" cy="60" r="1.5" fill="#94a3b8" />
  <circle cx="27" cy="74" r="5" fill="#0284c7" />
  <circle cx="27" cy="74" r="2.5" fill="#ffffff" />
  <circle cx="27" cy="90" r="1.5" fill="#94a3b8" />
  <circle cx="27" cy="105" r="1.5" fill="#94a3b8" />
  <circle cx="27" cy="120" r="1.5" fill="#94a3b8" />

  <!-- Sombras no Solo dos Pés -->
  <ellipse cx="132" cy="150" rx="18" ry="4.5" fill="#0f172a" opacity="0.25" />
  <ellipse cx="232" cy="149" rx="14" ry="3.5" fill="#0f172a" opacity="0.18" />

  <!-- Posição de Saída Tracejada do Pé (Ghosting do Pé Inicial em Pé) -->
  <g opacity="0.25">
    <rect x="180" y="144" width="16" height="5" rx="2.5" stroke="#94a3b8" stroke-dasharray="3,2" fill="none" />
  </g>

  <!-- Banda Elástica Dinâmica com Tração Contínua -->
  <g class="anim-band-dynamic">
    <path d="M27,74 Q88,74 150,74" stroke="#0284c7" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M27,74 Q88,76 150,76" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.9" />
  </g>

  <!-- PÉ TRASEIRO COM PIVÔ DINÂMICO NO METATARSO -->
  <g class="anim-back-foot-pivot">
    <ellipse cx="230" cy="146" rx="4.5" ry="3" fill="#ffffff" />
    <rect x="227" y="142" width="8" height="6" rx="1.5" fill="#ffffff" />
    <rect x="229" y="143" width="6" height="2" fill="#ef4444" />
  </g>

  <!-- PERNA E PÉ DA FRENTE DINÂMICOS (PASSO EM FRENTE NO SOLO & RETORNO) -->
  <g class="anim-front-leg-step">
    <!-- Canela e Pé da frente -->
    <path d="M132,114 L132,148" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="123" y="146" width="18" height="5" rx="2.5" fill="#ffffff" />
    <rect x="125" y="147" width="14" height="2" fill="#ef4444" />
  </g>

  <!-- CORPO DINÂMICO QUE AFUNDA EM LUNGE FRONTAL & REMADA -->
  <g class="anim-lunge-body-sink">
    <!-- Perna Traseira (Conecta anca ao pé de trás) -->
    <path d="M182,108 L218,126 L230,146" stroke="#b45309" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Coxa Dianteira (Conecta anca ao joelho da frente) -->
    <path d="M166,108 L132,114" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <!-- Destaque Muscular Quadricípite Dianteiro (Desaceleração Excêntrica 3s) -->
    <ellipse cx="146" cy="112" rx="9" ry="4" fill="#ef4444" opacity="0.8" />

    <!-- Bacia / Calções -->
    <path d="M162,96 L188,96 L184,115 L160,115 Z" fill="#0f172a" />

    <!-- Tronco Vertical e Alinhado (Camisola Gil Vicente FC) -->
    <path d="M164,58 L186,58 L182,98 L162,98 Z" fill="url(#kitGrad)" />

    <!-- Cabeça e Cabelo (Perfil virado para a ESQUERDA) -->
    <circle cx="172" cy="44" r="8" fill="#d97706" />
    <path d="M166,40 C166,32 178,32 178,40 L176,48 L170,48 Z" fill="#78350f" />
    <path d="M177,41 Q188,43 186,49" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Braço Direito (Guarda / Equilíbrio) -->
    <path d="M172,64 L160,76 L168,84" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- BRAÇO ESQUERDO QUE PUXA A REMADA AO TRONCO -->
    <g class="anim-arm-row-dynamic">
      <!-- Mão a segurar o punho da banda -->
      <ellipse cx="150" cy="74" rx="4.5" ry="4" fill="#0f172a" />
      <!-- Braço e antebraço que puxam a remada -->
      <path d="M150,74 L174,72 L194,76" stroke="#d97706" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="194" cy="76" r="4.5" fill="#d97706" />
      <!-- Destaque Retração Escapular / Dorsal -->
      <circle cx="178" cy="72" r="4.5" fill="#ef4444" opacity="0.85" />
    </g>
  </g>

  <!-- Vetores de Força & Controlo Dinâmicos -->
  <g filter="url(#dropShadow)">
    <!-- Seta do Passo Frontal no Solo (Mostra o avanço e regresso do pé!) -->
    <g class="anim-foot-arrow">
      <line x1="175" y1="158" x2="136" y2="158" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="140,154 132,158 140,162" fill="#2563eb" />
      <text x="132" y="172" fill="#1e3a8a" font-size="8" font-weight="900" letter-spacing="0.5">PASSO FRONTAL</text>
    </g>

    <!-- Seta Dinâmica da Remada -->
    <line x1="148" y1="65" x2="182" y2="65" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="178,61 187,65 178,69" fill="#2563eb" />
    <text x="156" y="58" fill="#1e3a8a" font-size="8" font-weight="900" letter-spacing="0.5">REMADA</text>

    <!-- Seta de Desaceleração Excêntrica -->
    <line x1="112" y1="114" x2="112" y2="134" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="108,129 112,137 116,129" fill="#2563eb" />
    <text x="96" y="108" fill="#2563eb" font-size="7.5" font-weight="900">3s EXC.</text>
  </g>
</svg>
