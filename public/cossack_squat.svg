<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="225" fill="url(#bgGrad)" />
  <rect x="20" y="180" width="360" height="15" rx="4" fill="url(#matGrad)" />
  
  <!-- Cossack Squat: Perna Esquerda fletida profunda, Perna Direita estendida de lado com dedos para cima -->
  <!-- Cabeça -->
  <circle cx="150" cy="80" r="14" fill="#cbd5e1" />
  <!-- Tronco inclinado -->
  <path d="M145,95 L175,130 L155,145 L130,110 Z" fill="#1e40af" />
  <!-- Braços à frente para equilíbrio -->
  <path d="M145,105 L110,105" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
  <path d="M150,110 L120,115" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
  
  <!-- Perna Esquerda (Flexão Profunda do Joelho) -->
  <!-- Coxa -->
  <path d="M165,135 L120,155" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" />
  <!-- Joelho dobrado e Canela -->
  <circle cx="118" cy="155" r="8" fill="#38bdf8" />
  <path d="M118,155 L135,180" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
  <ellipse cx="140" cy="180" rx="10" ry="4" fill="#cbd5e1" />
  
  <!-- Perna Direita (Estendida Lateralmente - Destaque Adutor em Tensão) -->
  <path d="M165,135 L310,175" stroke="#ef4444" stroke-width="14" stroke-linecap="round" />
  <!-- Pé com dedos apontados ao teto -->
  <path d="M310,175 L325,160" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
  
  <!-- Badges -->
  <rect x="20" y="16" width="135" height="24" rx="6" fill="#1e3a8a" opacity="0.9" />
  <text x="28" y="32" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">COSSACK SQUAT</text>
  
  <rect x="235" y="16" width="145" height="24" rx="6" fill="#7f1d1d" opacity="0.9" />
  <text x="243" y="32" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">JOELHO & ADUTOR</text>
</svg>
