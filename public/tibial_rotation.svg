<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="benchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="225" fill="url(#bgGrad)" />
  <!-- Banco onde está sentada -->
  <rect x="50" y="120" width="110" height="60" rx="4" fill="url(#benchGrad)" stroke="#475569" stroke-width="1" />
  
  <!-- Atleta Sentada -->
  <circle cx="105" cy="70" r="14" fill="#cbd5e1" />
  <!-- Tronco vertical -->
  <path d="M95,85 L125,85 L120,135 L90,135 Z" fill="#1e40af" />
  
  <!-- Coxa horizontal apoiada (femur fixo pelas mãos) -->
  <path d="M115,130 L210,130" stroke="#3b82f6" stroke-width="15" stroke-linecap="round" />
  <!-- Mãos a segurar a coxa para travar a anca -->
  <ellipse cx="170" cy="120" rx="10" ry="7" fill="#cbd5e1" />
  <path d="M115,95 L170,120" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
  
  <!-- Articulação do Joelho a 90° -->
  <circle cx="210" cy="130" r="10" fill="#38bdf8" />
  
  <!-- Canela / Tíbia Vertical -->
  <path d="M210,130 L210,195" stroke="#ef4444" stroke-width="13" stroke-linecap="round" />
  <!-- Pé com calcanhar no chão -->
  <ellipse cx="210" cy="195" rx="8" ry="4" fill="#38bdf8" />
  
  <!-- Arco Duplo de Rotação (Interna e Externa) -->
  <path d="M185,185 C195,175 225,175 235,185" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" />
  <polygon points="183,180 183,190 190,185" fill="#38bdf8" />
  <polygon points="237,180 237,190 230,185" fill="#38bdf8" />
  
  <!-- Badges -->
  <rect x="20" y="16" width="145" height="24" rx="6" fill="#1e3a8a" opacity="0.9" />
  <text x="28" y="32" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">ROTAÇÃO DA TÍBIA</text>
  
  <rect x="225" y="16" width="155" height="24" rx="6" fill="#7f1d1d" opacity="0.9" />
  <text x="233" y="32" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">ARTICULAÇÃO JOELHO</text>
</svg>
