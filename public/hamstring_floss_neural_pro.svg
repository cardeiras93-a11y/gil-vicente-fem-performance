<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Gym floor -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(205, 10)">
    <rect x="0" y="0" width="106" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="12" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="9" font-weight="900" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.5">LIVE LOOP • 60fps</text>
  </g>

  <!-- Title indicator -->
  <g transform="translate(14, 18)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#ef4444" />
    <text x="14" y="8" fill="#334155" font-size="9" font-weight="800" font-family="Inter, system-ui, sans-serif">SLUMP FLOSS NEURAL</text>
  </g>

  
  <!-- Banco estável -->
  <rect x="90" y="105" width="80" height="12" rx="2" fill="#334155" />
  <rect x="100" y="117" width="8" height="31" fill="#475569" />
  <rect x="152" y="117" width="8" height="31" fill="#475569" />

  <!-- Atleta sentada executando onda neural contínua (extensão joelho + flexão/extensão cervical) -->
  <g transform="translate(130, 105)">
    <!-- Tronco curvado em slump -->
    <path d="M-15 0 C-20 -25, -15 -45, 0 -50" stroke="#1e3a8a" stroke-width="14" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M-15 0 C-20 -25, -15 -45, 0 -50; M-15 0 C-10 -25, -5 -45, 10 -55; M-15 0 C-20 -25, -15 -45, 0 -50" dur="2.8s" repeatCount="indefinite" />
    </path>

    <!-- Cabeça com flexão/extensão alternada -->
    <circle cx="2" cy="-60" r="9" fill="#f6ad55">
      <animate attributeName="cy" values="-60;-66;-60" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="2;12;2" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <!-- Coxa apoiada no banco -->
    <path d="M-10 0 L25 0" stroke="#0f172a" stroke-width="13" stroke-linecap="round" />

    <!-- Perna estendendo ritmicamente no ar -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="90, 25, 0; 8, 25, 0; 90, 25, 0" dur="2.8s" repeatCount="indefinite" />
      <path d="M25 0 L65 0" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
      <path d="M65 0 L68 -10" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Perna de apoio no chão -->
    <path d="M-10 0 L-10 43" stroke="#475569" stroke-width="10" stroke-linecap="round" />
    <ellipse cx="-7" cy="43" rx="7" ry="3" fill="#0284c7" />
  </g>

  <!-- Indicador de Deslizamento Nervoso -->
  <g transform="translate(210, 80)">
    <text x="0" y="0" fill="#0284c7" font-size="8.5" font-weight="900" font-family="Inter, sans-serif">FLOSS NEURAL</text>
    <text x="0" y="12" fill="#64748b" font-size="7.5" font-weight="700" font-family="Inter, sans-serif">N. Ciático Livre</text>
  </g>

</svg>