<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(210, 10)">
    <rect x="0" y="0" width="102" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, sans-serif" font-weight="900" text-anchor="middle">CALF RAISE</text>
  </g>


  <ellipse cx="160" cy="154" rx="35" ry="6" fill="#0f172a" opacity="0.22" />
  <line x1="130" y1="148" x2="190" y2="148" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -24; 0 -24; 0 0" keyTimes="0; 0.42; 0.65; 1" dur="2.4s" repeatCount="indefinite" />
    <line x1="160" y1="75" x2="160" y2="140" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <ellipse cx="160" cy="75" rx="9" ry="8" fill="#0f172a" />
    <path d="M152,38 L168,38 L165,75 L155,75 Z" fill="url(#kitGrad)" />
    <circle cx="160" cy="26" r="7.5" fill="#d97706" />
    <ellipse cx="160" cy="142" rx="5" ry="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <ellipse cx="160" cy="105" rx="7" ry="14" fill="#ef4444">
      <animate attributeName="opacity" values="0.3; 1; 1; 0.3" dur="2.4s" repeatCount="indefinite" />
    </ellipse>
  </g>

</svg>
