<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,160 10,160" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <ellipse cx="160" cy="154" rx="75" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Rolo de Espuma (Foam Roller) nos Gémeos com Oscilação -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -12,0; 0,0" dur="2.2s" repeatCount="indefinite" />
    <!-- Rolo Cilíndrico com Textura -->
    <rect x="180" y="132" width="22" height="16" rx="4" fill="url(#rollerGrad)" filter="url(#dropShadow)" />
    <line x1="184" y1="133" x2="184" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="191" y1="133" x2="191" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="198" y1="133" x2="198" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Atleta Sentada com Apoio das Mãos e Bacia Elevada (Deslize Antero-Posterior) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 12,0; 0,0" dur="2.2s" repeatCount="indefinite" />

    <!-- Mãos de Apoio Atrás do Tronco -->
    <path d="M72,105 L65,138" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <circle cx="65" cy="140" r="3.5" fill="#d97706" />

    <!-- Tronco e Cabeça -->
    <circle cx="95" cy="80" r="8" fill="#d97706" />
    <path d="M90,76 C90,70 100,70 100,76 L98,82 L92,82 Z" fill="#78350f" />
    <path d="M82,88 C82,82 108,82 108,88 L104,122 C96,124 88,124 82,122 Z" fill="url(#kitGrad)" />

    <!-- Bacia / Calções Ligeiramente Elevados do Solo -->
    <path d="M92,120 L122,118 L116,134 L92,134 Z" fill="#0f172a" />

    <!-- Perna Ativa (Estendida sobre o Rolo) -->
    <!-- Coxa -->
    <path d="M116,124 L168,126" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
    <!-- Gémeo sobre o Rolo -->
    <path d="M168,126 L228,134" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <ellipse cx="230" cy="133" rx="4.5" ry="3.5" fill="#ffffff" />

    <!-- Perna Oposta Cruzada / Dobrada a Dar Suporte e Pressão -->
    <path d="M116,120 L150,110 L168,138" stroke="#b45309" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="168" cy="139" r="3.5" fill="#ffffff" />
  </g>

  <!-- Vetores de Deslize Miofascial e Ponto de Pressão -->
  <g filter="url(#dropShadow)">
    <path d="M172,118 L212,118" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.1s" repeatCount="indefinite" />
    </path>
    <polygon points="174,115 168,118 174,121" fill="#38bdf8" />
    <polygon points="210,115 216,118 210,121" fill="#38bdf8" />
    <!-- Ponto Miofascial -->
    <circle cx="192" cy="130" r="5" fill="#ef4444" opacity="0.6">
      <animate attributeName="r" values="3; 6; 3" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 0.8; 0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
  <!-- Live Loop Indicator -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.88" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>