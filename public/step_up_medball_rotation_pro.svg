<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="medBallGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes stepUpDrive {
      0%, 100% {
        transform: translate(0px, 0px);
      }
      50% {
        transform: translate(14px, -14px);
      }
    }
    @keyframes medballRotation {
      0%, 100% {
        /* No início da subida: bola centrada junto ao peito */
        transform: rotate(-12deg) translate(-4px, -2px);
      }
      50% {
        /* No topo da caixa: rotação dinâmica pronunciada dos braços sobre a coxa dianteira */
        transform: rotate(24deg) translate(10px, 4px);
      }
    }
    @keyframes stepArrowDrive {
      0%, 100% {
        transform: translateY(0px);
        opacity: 0.6;
      }
      50% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }
    @keyframes rotArrowSwing {
      0%, 100% {
        transform: rotate(-8deg);
        opacity: 0.5;
      }
      50% {
        transform: rotate(14deg);
        opacity: 1;
      }
    }
    .anim-step-body {
      animation: stepUpDrive 2.6s ease-in-out infinite;
    }
    .anim-medball-arms {
      transform-origin: 126px 60px;
      animation: medballRotation 2.6s ease-in-out infinite;
    }
    .anim-step-arrow {
      animation: stepArrowDrive 2.6s ease-in-out infinite;
    }
    .anim-rot-arrow-swing {
      transform-origin: 151px 78px;
      animation: rotArrowSwing 2.6s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-step-body, .anim-medball-arms, .anim-step-arrow, .anim-rot-arrow-swing {
        animation: none !important;
      }
    }
  </style>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1" />

  <!-- Caixa de Pliometria / Step Box Firme -->
  <rect x="155" y="102" width="75" height="46" rx="4" fill="url(#boxGrad)" filter="url(#dropShadow)" />
  <rect x="151" y="99" width="83" height="6" rx="2" fill="#0f172a" />
  <text x="192" y="128" fill="#64748b" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">BOX 40CM</text>

  <!-- Sombra no Solo -->
  <ellipse cx="115" cy="151" rx="24" ry="5" fill="#0f172a" opacity="0.2" />
  <ellipse cx="192" cy="151" rx="42" ry="6" fill="#0f172a" opacity="0.25" />

  <!-- Perna Superior no Topo da Caixa (Pé Fixo na Caixa) -->
  <rect x="172" y="96" width="18" height="5" rx="2.5" fill="#ffffff" />
  <rect x="174" y="97" width="14" height="2" fill="#ef4444" />

  <!-- Perna Traseira no Chão (Pé de Saída) -->
  <rect x="110" y="144" width="14" height="5" rx="2.5" fill="#ffffff" />

  <!-- SEGMENTO DINÂMICO QUE SOBE NA CAIXA -->
  <g class="anim-step-body">
    <!-- Perna Traseira no Chão (Impulso) -->
    <path d="M110,95 L112,120 L115,146" stroke="#b45309" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Perna Dianteira em Extensão -->
    <path d="M125,95 L156,76 L180,98" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bacia / Calções -->
    <path d="M108,86 L134,86 L130,102 L106,102 Z" fill="#0f172a" />

    <!-- Tronco Alinhado -->
    <path d="M114,52 L138,50 L134,88 L110,88 Z" fill="url(#kitGrad)" />

    <!-- Cabeça e Cabelo -->
    <circle cx="128" cy="38" r="8" fill="#d97706" />
    <path d="M122,34 C122,26 134,26 134,34 L132,42 L124,42 Z" fill="#78350f" />

    <!-- BRAÇOS E MEDICINE BALL COM ROTAÇÃO DINÂMICA DESTACADA -->
    <g class="anim-medball-arms">
      <!-- Braço Esquerdo (Trás) -->
      <path d="M118,60 L136,70 L152,68" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
      <!-- Braço Direito (Frente) -->
      <path d="M126,58 L142,66 L154,64" stroke="#d97706" stroke-width="5.5" stroke-linecap="round" />

      <!-- Medicine Ball com Rotação e Costuras -->
      <circle cx="156" cy="65" r="11" fill="url(#medBallGrad)" filter="url(#dropShadow)" />
      <path d="M148,61 Q156,65 164,61" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8" />
      <path d="M148,69 Q156,65 164,69" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8" />
      <circle cx="156" cy="65" r="3" fill="#ffffff" opacity="0.4" />
    </g>

    <!-- Seta Dinâmica de Rotação do Tronco e Braços -->
    <g filter="url(#dropShadow)" class="anim-rot-arrow-swing">
      <path d="M134,78 A 20 20 0 0 0 168,78" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <polygon points="167,74 174,79 167,84" fill="#38bdf8" />
      <text x="136" y="92" fill="#0284c7" font-size="7.5" font-weight="900">ROTAÇÃO</text>
    </g>
  </g>

  <!-- Seta Dinâmica de Subida Vertical -->
  <g filter="url(#dropShadow)" class="anim-step-arrow">
    <line x1="162" y1="88" x2="162" y2="68" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="159,71 162,64 165,71" fill="#2563eb" />
  </g>
</svg>
