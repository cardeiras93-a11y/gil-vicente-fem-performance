<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="35,122 285,122 305,162 15,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="150" rx="55" ry="7" fill="#0f172a" opacity="0.2" />

  <!-- Perna de Apoio Unipodal (Joelho destrancado a 15° Estável) -->
  <path d="M150,82 L158,114 L154,146" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="150" y="144" width="18" height="6" rx="3" fill="#ffffff" />
  <!-- Ativação Isquios + Glúteo na Perna de Apoio -->
  <line x1="146" y1="86" x2="153" y2="112" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

  <!-- Perna Livre Estendida Horizontalmente ("Avião" em linha com o tronco) -->
  <path d="M142,78 L80,76" stroke="#b45309" stroke-width="8" stroke-linecap="round" />
  <rect x="72" y="72" width="10" height="14" rx="3" fill="#ffffff" />

  <!-- Calções e Tronco Horizontal em T -->
  <path d="M138,70 L160,70 L158,86 L136,84 Z" fill="#0f172a" />
  <path d="M158,70 L214,70 L214,84 L158,84 Z" fill="url(#kitGrad)" />

  <!-- Cabeça Olhando para o Chão (Cervical Neutra) -->
  <circle cx="226" cy="76" r="8" fill="#d97706" />
  <path d="M220,70 C222,64 232,66 232,72 Z" fill="#78350f" />

  <!-- Braço Contralateral Segurando o Haltere -->
  <path d="M202,82 L198,122" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
  <g filter="url(#dropShadow)">
    <rect x="186" y="118" width="7" height="16" rx="2" fill="#0f172a" />
    <rect x="203" y="118" width="7" height="16" rx="2" fill="#0f172a" />
    <line x1="193" y1="126" x2="203" y2="126" stroke="#94a3b8" stroke-width="4" />
  </g>

  <!-- Linha Tracejada de Equilíbrio Horizontal em "T" -->
  <line x1="76" y1="62" x2="232" y2="62" stroke="#0d9488" stroke-width="2" stroke-dasharray="4,3" />
</svg>
