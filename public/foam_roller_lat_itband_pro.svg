<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,160 10,160" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <ellipse cx="160" cy="154" rx="75" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Rolo de Espuma sob a Face Lateral da Coxa -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -14,0; 0,0" dur="2.4s" repeatCount="indefinite" />
    <rect x="145" y="132" width="24" height="16" rx="4" fill="url(#rollerGrad)" filter="url(#dropShadow)" />
    <line x1="150" y1="133" x2="150" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="157" y1="133" x2="157" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="164" y1="133" x2="164" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Atleta em Decúbito Lateral com Apoio de Antebraço e Perna Cruzada à Frente -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 14,0; 0,0" dur="2.4s" repeatCount="indefinite" />

    <!-- Antebraço no Solo em Prancha Lateral -->
    <path d="M68,136 L88,136 L98,116" stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="68" cy="136" r="3.5" fill="#d97706" />

    <!-- Tronco Lateral e Cabeça -->
    <circle cx="92" cy="100" r="8" fill="#d97706" />
    <path d="M87,96 C87,90 97,90 97,96 L95,102 L89,102 Z" fill="#78350f" />
    <path d="M96,108 L138,114 L134,126 L94,122 Z" fill="url(#kitGrad)" />

    <!-- Bacia / Calções -->
    <path d="M134,114 L160,116 L156,128 L132,126 Z" fill="#0f172a" />

    <!-- Perna Inferior (IT-Band Diretamente no Rolo de Forma Contínua) -->
    <path d="M156,122 L224,130" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <ellipse cx="226" cy="130" rx="4.5" ry="3.5" fill="#ffffff" />

    <!-- Perna Superior Cruzada à Frente com Pé no Chão para Alívio e Condução de Carga -->
    <path d="M152,116 L175,98 L184,136" stroke="#b45309" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="184" cy="138" r="4" fill="#ffffff" />
  </g>

  <!-- Linha da Fáscia Ílio-Tibial com Vetores -->
  <g filter="url(#dropShadow)">
    <path d="M135,106 L175,106" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.2s" repeatCount="indefinite" />
    </path>
    <polygon points="137,103 131,106 137,109" fill="#38bdf8" />
    <polygon points="173,103 179,106 173,109" fill="#38bdf8" />
    <!-- TFL / Ponto Gatilho da Banda -->
    <circle cx="156" cy="122" r="5" fill="#ef4444" opacity="0.65">
      <animate attributeName="r" values="3; 6; 3" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
  <!-- Live Loop Indicator -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.88" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>