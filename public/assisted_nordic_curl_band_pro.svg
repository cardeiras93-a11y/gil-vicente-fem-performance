<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(210, 10)">
    <rect x="0" y="0" width="102" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, sans-serif" font-weight="900" text-anchor="middle">NORDIC CURL</text>
  </g>


  <rect x="70" y="146" width="180" height="4" rx="2" fill="#0284c7" />
  <rect x="65" y="125" width="22" height="24" rx="4" fill="#1e293b" />
  <circle cx="76" cy="138" r="5" fill="#94a3b8" />
  <path d="M45,85 L140,88" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round">
    <animate attributeName="d" values="M45,85 L150,55; M45,85 L185,105; M45,85 L185,105; M45,85 L150,55" keyTimes="0; 0.5; 0.65; 1" dur="3.4s" repeatCount="indefinite" />
  </path>
  <line x1="75" y1="140" x2="98" y2="140" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
  <circle cx="98" cy="140" r="5" fill="#0f172a" />

  <!-- Descida Excêntrica Ampla de Nordic Curl -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 98 140; 45 98 140; 45 98 140; 0 98 140" keyTimes="0; 0.5; 0.65; 1" dur="3.4s" repeatCount="indefinite" />
    <path d="M98,140 L126,98" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
    <line x1="99" y1="135" x2="124" y2="100" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3; 1; 1; 0.3" keyTimes="0; 0.5; 0.65; 1" dur="3.4s" repeatCount="indefinite" />
    </line>
    <ellipse cx="128" cy="95" rx="8" ry="7" fill="#0f172a" />
    <path d="M125,92 L152,50 L166,54 L134,95 Z" fill="url(#kitGrad)" />
    <path d="M148,58 L175,76" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="162" cy="40" r="8" fill="#d97706" />
    <path d="M158,35 C158,30 168,30 168,35 L166,42 L160,42 Z" fill="#78350f" />
  </g>

</svg>
