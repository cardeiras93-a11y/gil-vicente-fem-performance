<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,162 10,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="148" rx="80" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Cabeça e Ombros -->
  <circle cx="82" cy="136" r="8" fill="#d97706" />
  <path d="M75,134 C75,128 88,128 88,134 Z" fill="#78350f" />

  <!-- Tronco Supino -->
  <path d="M90,135 L146,137 L142,146 L88,144 Z" fill="url(#kitGrad)" />
  <path d="M142,135 L160,125 L154,138 Z" fill="#0f172a" />

  <!-- Coxa Suporte (Perna de Baixo) a 60° -->
  <path d="M158,126 L182,92" stroke="#b45309" stroke-width="8" stroke-linecap="round" />
  <path d="M182,92 L202,112" stroke="#92400e" stroke-width="7" stroke-linecap="round" />

  <!-- Perna Cruzada em Figura 4 (Tornozelo sobre o Joelho) -->
  <path d="M154,124 L142,98" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <!-- Canela Cruzada na Horizontal -->
  <path d="M142,98 L180,94" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <ellipse cx="182" cy="94" rx="4" ry="3" fill="#ffffff" />

  <!-- Braços a puxar por trás da coxa -->
  <path d="M110,134 Q140,118 168,106" stroke="#1e3a8a" stroke-width="5.5" stroke-linecap="round" fill="none" />

  <!-- Ponto de Foco Glúteo / Piriforme / Sacroilíaca -->
  <circle cx="150" cy="116" r="7" fill="#ef4444" opacity="0.75" />

  <!-- Seta de Tração Posterior -->
  <g filter="url(#dropShadow)">
    <path d="M178,82 L160,94" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="160,88 154,98 165,95" fill="#2563eb" />
  </g>
</svg>