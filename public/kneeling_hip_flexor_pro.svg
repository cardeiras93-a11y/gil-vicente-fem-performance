<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,162 10,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="148" rx="80" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Perna de Trás Ajoelhada (Extensão da Anca) -->
  <line x1="126" y1="110" x2="120" y2="142" stroke="#b45309" stroke-width="8" stroke-linecap="round" />
  <line x1="120" y1="142" x2="90" y2="142" stroke="#b45309" stroke-width="6" stroke-linecap="round" />

  <!-- Bacia em Retroversão Pélvica (Encolhe a anca, alivia a lombar) -->
  <path d="M120,105 C122,96 142,96 148,106 L144,116 C136,118 122,118 120,105 Z" fill="#0f172a" />

  <!-- Tronco Vertical Firme -->
  <path d="M128,68 L144,68 L142,106 L124,106 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo -->
  <circle cx="136" cy="54" r="8" fill="#d97706" />
  <path d="M130,52 C130,46 142,46 142,52 Z" fill="#78350f" />

  <!-- Braço no Flanco / Anca -->
  <path d="M140,72 L150,86 L142,96" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Perna da Frente a 90° -->
  <path d="M145,108 L186,108" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <path d="M186,108 L188,142" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <rect x="180" y="138" width="18" height="6" rx="3" fill="#ffffff" />

  <!-- Foco Psoas / Flexor Anterior -->
  <ellipse cx="132" cy="112" rx="6" ry="10" fill="#ef4444" opacity="0.6" />

  <!-- Seta de Retroversão Pélvica e Alívio da Lordose Lombar -->
  <g filter="url(#dropShadow)">
    <path d="M116,92 Q124,88 128,96" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="124,98 129,103 133,96" fill="#2563eb" />
    <line x1="120" y1="72" x2="120" y2="102" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2" />
  </g>
</svg>