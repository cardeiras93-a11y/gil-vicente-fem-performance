<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,162 10,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="148" rx="85" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Pés e Calcanhares dobrados no solo -->
  <ellipse cx="78" cy="140" rx="12" ry="5" fill="#e2e8f0" />
  <path d="M72,138 L92,136" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

  <!-- Coxas sentadas sobre os calcanhares -->
  <path d="M82,138 L114,136 L124,142 L84,142 Z" fill="#b45309" />
  <!-- Bacia / Glúteos colados aos calcanhares -->
  <path d="M78,132 C78,118 96,114 112,122 L110,138 C94,142 80,140 78,132 Z" fill="#0f172a" />

  <!-- Coluna Lombar e Torácica em Flexão Suave e Descompressão -->
  <path d="M106,120 C120,118 152,120 186,132 L182,142 C150,132 120,130 102,134 Z" fill="url(#kitGrad)" />

  <!-- Cabeça apoiada junto ao solo -->
  <circle cx="198" cy="136" r="8" fill="#d97706" />
  <path d="M192,134 C192,128 204,128 205,134 Z" fill="#78350f" />

  <!-- Braços estendidos à frente no tapete -->
  <path d="M178,132 L248,138" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" />
  <path d="M182,136 L254,141" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
  <!-- Mãos espalmadas à frente -->
  <ellipse cx="256" cy="140" rx="6" ry="3" fill="#d97706" />

  <!-- Área Lombar Focada (Luz de Descompressão) -->
  <ellipse cx="118" cy="122" rx="10" ry="6" fill="#38bdf8" opacity="0.4" />

  <!-- Setas de Alongamento Axial (Braços para a frente, Bacia para trás) -->
  <g filter="url(#dropShadow)">
    <path d="M220,126 L248,126" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="246,122 254,126 246,130" fill="#2563eb" />
    <path d="M88,112 L68,118" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="72,113 62,120 70,123" fill="#2563eb" />
  </g>
</svg>