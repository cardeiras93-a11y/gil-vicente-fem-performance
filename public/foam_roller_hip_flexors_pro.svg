<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="135" x2="320" y2="135" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="30,122 285,122 305,160 10,160" fill="url(#matGrad)" filter="url(#dropShadow)" />

  <ellipse cx="160" cy="154" rx="75" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Rolo de Espuma sob a Crista Ilíaca Anterior / Flexor da Anca -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -10,0; 0,0" dur="2.0s" repeatCount="indefinite" />
    <rect x="135" y="132" width="22" height="16" rx="4" fill="url(#rollerGrad)" filter="url(#dropShadow)" />
    <line x1="139" y1="133" x2="139" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="146" y1="133" x2="146" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="153" y1="133" x2="153" y2="147" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Atleta Semi-Inclinada em Prancha Baixa a Libertar os Flexores da Anca -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 10,0; 0,0" dur="2.0s" repeatCount="indefinite" />

    <!-- Apoio dos Antebraços -->
    <path d="M55,136 L75,136 L88,118" stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="55" cy="136" r="3.5" fill="#d97706" />

    <!-- Tronco e Cabeça -->
    <circle cx="80" cy="102" r="8" fill="#d97706" />
    <path d="M75,98 C75,92 85,92 85,98 L83,104 L77,104 Z" fill="#78350f" />
    <path d="M84,106 L130,112 L126,124 L82,120 Z" fill="url(#kitGrad)" />

    <!-- Bacia Inclinada Sobre o Rolo no Ponto do Psoas/Reto -->
    <path d="M124,112 L150,116 L144,128 L122,124 Z" fill="#0f172a" />

    <!-- Perna Ativa Estendida -->
    <path d="M144,122 L200,126" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <ellipse cx="202" cy="126" rx="4" ry="3" fill="#ffffff" />

    <!-- Perna Oposta Fletida ao Lado em Posição de Rã para Ajustar Pressão -->
    <path d="M140,118 L168,110 L185,135" stroke="#b45309" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="185" cy="136" r="3.5" fill="#ffffff" />
  </g>

  <!-- Ponto de Pressão Flexor -->
  <g filter="url(#dropShadow)">
    <circle cx="146" cy="122" r="5.5" fill="#ef4444" opacity="0.7">
      <animate attributeName="r" values="3.5; 6.5; 3.5" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="1.3s" repeatCount="indefinite" />
    </circle>
    <path d="M130,104 L160,104" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.1s" repeatCount="indefinite" />
    </path>
    <polygon points="132,101 126,104 132,107" fill="#38bdf8" />
    <polygon points="158,101 164,104 158,107" fill="#38bdf8" />
  </g>
  <!-- Live Loop Indicator -->
  <g transform="translate(10, 160)">
    <rect width="66" height="15" rx="4" fill="#0f172a" opacity="0.88" />
    <circle cx="7" cy="7.5" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="11" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" letter-spacing="0.5">LIVE LOOP</text>
  </g>
</svg>