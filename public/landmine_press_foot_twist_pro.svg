<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes landminePress {
      0%, 100% {
        transform: rotate(-7deg);
      }
      50% {
        transform: rotate(3deg);
      }
    }
    @keyframes footTwist {
      0%, 100% {
        transform: rotate(-10deg);
      }
      50% {
        transform: rotate(15deg);
      }
    }
    @keyframes pressArrowPulse {
      0%, 100% {
        transform: translate(0, 0);
        opacity: 0.6;
      }
      50% {
        transform: translate(8px, -6px);
        opacity: 1;
      }
    }
    .anim-bar-press {
      transform-origin: 82px 142px;
      animation: landminePress 2.5s ease-in-out infinite alternate;
    }
    .anim-foot-twist {
      transform-origin: 186px 146px;
      animation: footTwist 2.5s ease-in-out infinite alternate;
    }
    .anim-press-arrow {
      animation: pressArrowPulse 2.5s ease-in-out infinite alternate;
    }
    @media (prefers-reduced-motion: reduce), print {
      *, .anim-bar-press, .anim-foot-twist, .anim-press-arrow {
        animation: none !important;
      }
    }
  </style>

  <!-- Fundo Ginásio Luminoso -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1" />

  <!-- Base Landmine no Solo (Frente/Esquerda) -->
  <rect x="70" y="142" width="26" height="10" rx="3" fill="#0f172a" filter="url(#dropShadow)" />
  <circle cx="82" cy="144" r="5" fill="#334155" />
  <rect x="78" y="137" width="10" height="9" rx="2" transform="rotate(-38 82 142)" fill="#1e293b" />

  <!-- Sombra no Solo dos Pés da Atleta -->
  <ellipse cx="132" cy="151" rx="16" ry="4.5" fill="#0f172a" opacity="0.25" />
  <ellipse cx="188" cy="149" rx="14" ry="4" fill="#0f172a" opacity="0.22" />

  <!-- Perna Anterior Esquerda (Fixa e estável na frente) -->
  <path d="M144,106 L134,126 L132,148" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="123" y="146" width="18" height="5" rx="2.5" fill="#ffffff" />
  <rect x="125" y="147" width="14" height="2" fill="#ef4444" />

  <!-- Calções / Bacia -->
  <path d="M136,92 L172,92 L168,112 L138,112 Z" fill="#0f172a" />

  <!-- Tronco (Visão Frontal - Camisola Gil Vicente FC) -->
  <path d="M138,58 L170,56 L168,96 L136,96 Z" fill="url(#kitGrad)" />
  <path d="M142,58 L152,58 L150,75 L140,75 Z" fill="#ef4444" opacity="0.85" />

  <!-- Cabeça e Cabelo (Visão Frontal) -->
  <circle cx="154" cy="42" r="8" fill="#d97706" />
  <path d="M147,38 C147,30 161,30 161,38 L160,45 L148,45 Z" fill="#78350f" />
  <path d="M161,40 Q169,43 167,49" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Braço Esquerdo de Guarda -->
  <path d="M140,64 L126,76 L134,84" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <ellipse cx="134" cy="84" rx="3.5" ry="3.5" fill="#d97706" />

  <!-- PERNA POSTERIOR COM PIVÔ / FOOT TWIST DINÂMICO -->
  <g class="anim-foot-twist">
    <path d="M166,106 L178,126 L186,146" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="186" cy="146" rx="4" ry="3" fill="#ffffff" />
    <rect x="183" y="141" width="7" height="7" rx="1.5" transform="rotate(30 186 144)" fill="#ffffff" />
    <rect x="185" y="142" width="5" height="2" transform="rotate(30 186 144)" fill="#ef4444" />
  </g>

  <!-- BARRA LANDMINE & BRAÇO DIREITO DINÂMICOS (PRESS POTENTE) -->
  <g class="anim-bar-press">
    <!-- Barra Olímpica do Landmine -->
    <line x1="82" y1="142" x2="218" y2="34" stroke="url(#barGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
    <!-- Anilha Olímpica -->
    <rect x="196" y="44" width="8" height="28" rx="2" transform="rotate(38 200 58)" fill="#1e293b" />
    <circle cx="204" cy="55" r="3" fill="#ef4444" />

    <!-- Braço Direito a Empurrar a Barra -->
    <path d="M166,62 L185,52 L212,39" stroke="#d97706" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="212" cy="39" rx="4.5" ry="4.5" fill="#d97706" />

    <!-- Destaque Muscular no Deltoide & Core -->
    <circle cx="172" cy="60" r="4.5" fill="#ef4444" opacity="0.8" />
  </g>

  <!-- Destaque no Core Rotacional -->
  <circle cx="158" cy="80" r="4" fill="#ef4444" opacity="0.7" />

  <!-- Vetores de Movimento & Rotação -->
  <g filter="url(#dropShadow)">
    <!-- Seta de Rotação do Pé Traseiro (Foot Twist) -->
    <path d="M174,142 A 12 12 0 0 1 198,136" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="198,133 203,138 197,141" fill="#2563eb" />
    <text x="170" y="162" fill="#1e3a8a" font-size="8" font-weight="900" letter-spacing="0.5">PIVÔ / TWIST</text>

    <!-- Seta Dinâmica de Aceleração do Press -->
    <g class="anim-press-arrow">
      <line x1="206" y1="44" x2="236" y2="24" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="231,21 241,21 237,30" fill="#2563eb" />
      <text x="218" y="16" fill="#1e3a8a" font-size="8" font-weight="900" letter-spacing="0.5">PRESS</text>
    </g>
  </g>
</svg>
