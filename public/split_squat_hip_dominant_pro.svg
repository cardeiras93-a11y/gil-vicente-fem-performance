<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="machGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do Ginásio & Linha de Solo -->
  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge LIVE ANIMADO -->
  <g transform="translate(210, 10)">
    <rect x="0" y="0" width="102" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="10" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1; 0.2; 1" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3.5" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="58" y="14" fill="#38bdf8" font-size="8" font-family="-apple-system, sans-serif" font-weight="900" text-anchor="middle">SPLIT SQUAT</text>
  </g>


  <ellipse cx="160" cy="154" rx="75" ry="7" fill="#0f172a" opacity="0.22" />

  <!-- Pés Fixos no Solo -->
  <ellipse cx="192" cy="150" rx="9" ry="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <ellipse cx="106" cy="148" rx="6" ry="4" fill="#64748b" />

  <!-- Perna e Tronco em Movimento Real de Agachamento Búlgaro / Split Squat -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -24; 0 0; 0 0; 0 -24" keyTimes="0; 0.4; 0.7; 1" dur="2.6s" repeatCount="indefinite" />
    
    <!-- Tronco Ereto -->
    <path d="M150,55 L168,55 L164,95 L152,95 Z" fill="url(#kitGrad)" />
    <circle cx="159" cy="42" r="7.5" fill="#d97706" />
    <ellipse cx="158" cy="95" rx="11" ry="8" fill="#0f172a" />

    <!-- Coxa Avançada fletindo a 90° -->
    <line x1="160" y1="95" x2="192" y2="116" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" />
    <circle cx="192" cy="116" r="5" fill="#0f172a" />
    <line x1="192" y1="116" x2="192" y2="150" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />

    <!-- Coxa Posterior descendo até perto do chão -->
    <line x1="154" y1="95" x2="130" y2="124" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <circle cx="130" cy="124" r="5" fill="#0f172a" />
    <line x1="130" y1="124" x2="108" y2="148" stroke="#d97706" stroke-width="7" stroke-linecap="round" />

    <!-- Haltere nas Mãos em Contrapeso -->
    <line x1="160" y1="75" x2="160" y2="112" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />
    <rect x="154" y="108" width="12" height="15" rx="2" fill="#1e293b" />
    <rect x="157" y="105" width="6" height="21" rx="1.5" fill="#475569" />

    <!-- Mini-Banda nos Joelhos sob Tensão Máxima -->
    <line x1="130" y1="124" x2="192" y2="116" stroke="#ea580c" stroke-width="5" stroke-linecap="round">
      <animate attributeName="stroke-width" values="4; 7; 7; 4" keyTimes="0; 0.4; 0.7; 1" dur="2.6s" repeatCount="indefinite" />
    </line>
  </g>

</svg>
