<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="1" />

  <!-- Sombra no solo -->
  <ellipse cx="160" cy="150" rx="45" ry="6" fill="#0f172a" opacity="0.2" />

  <!-- Pernas em Pé com Base Estável (Largura da Bacia) -->
  <line x1="152" y1="102" x2="148" y2="145" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" />
  <line x1="168" y1="102" x2="172" y2="145" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <rect x="142" y="142" width="16" height="5" rx="2.5" fill="#ffffff" />
  <rect x="168" y="142" width="16" height="5" rx="2.5" fill="#ffffff" />

  <!-- Calções / Bacia -->
  <path d="M148,88 L172,88 L170,104 L150,104 Z" fill="#0f172a" />

  <!-- Tronco Vertical Neutro (Sem Balanço Lombar) -->
  <path d="M148,52 L172,52 L170,90 L150,90 Z" fill="url(#kitGrad)" />

  <!-- Cabeça e Cabelo -->
  <circle cx="160" cy="40" r="8" fill="#d97706" />
  <path d="M154,36 C154,30 166,30 166,36 Z" fill="#78350f" />

  <!-- Braço Esquerdo (Na Fase Inicial Descendente) -->
  <line x1="148" y1="56" x2="142" y2="78" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
  <line x1="142" y1="78" x2="140" y2="102" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="140" cy="104" r="4" fill="#0f172a" />

  <!-- Braço Direito (Em Flexão Máxima com Supinação da Palma para Cima) -->
  <line x1="172" y1="56" x2="174" y2="82" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
  <line x1="174" y1="82" x2="162" y2="60" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" />

  <!-- Haltere Direito Fletido no Topo (Horizontal pela Supinação) -->
  <line x1="152" y1="58" x2="172" y2="58" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
  <circle cx="152" cy="58" r="4" fill="#334155" />
  <circle cx="172" cy="58" r="4" fill="#334155" />

  <!-- Destaque Muscular Bicípite Braquial Contraído no Topo -->
  <ellipse cx="171" cy="70" rx="5" ry="7" fill="#ef4444" opacity="0.85" />

  <!-- Seta Curva de Flexão com Rotação em Supinação -->
  <g filter="url(#dropShadow)">
    <path d="M185,96 Q192,76 172,66" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="178,65 168,66 174,72" fill="#2563eb" />
  </g>
</svg>