<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="225" fill="url(#bgGrad)" />
  
  <!-- Diagrama de Joelho em Flexão com Alívio Intra-articular -->
  <!-- Fémur (Osso da Coxa) -->
  <path d="M120,80 L220,135" stroke="#3b82f6" stroke-width="26" stroke-linecap="round" />
  
  <!-- Tíbia (Canela) Fletida para trás -->
  <path d="M220,135 L130,175" stroke="#3b82f6" stroke-width="22" stroke-linecap="round" />
  
  <!-- Rótula (Patela) na frente -->
  <circle cx="232" cy="122" r="13" fill="#cbd5e1" stroke="#38bdf8" stroke-width="3" />
  <text x="250" y="126" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">RÓTULA LIVRE</text>
  
  <!-- Elemento de Descompressão (Toalha/Banda Elástica na Fossa Poplítea) -->
  <circle cx="195" cy="148" r="16" fill="#f59e0b" stroke="#fbbf24" stroke-width="3" />
  <text x="182" y="152" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="900">GAP</text>
  
  <!-- Setas de Descompressão da Articulação (Espaço aberto) -->
  <path d="M180,110 L165,95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <polygon points="163,101 160,90 171,95" fill="#38bdf8" />
  <path d="M175,170 L160,185" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <polygon points="171,185 160,190 163,179" fill="#38bdf8" />
  
  <text x="75" y="140" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">DESCOMPRESSÃO</text>
  
  <!-- Badges -->
  <rect x="20" y="16" width="165" height="24" rx="6" fill="#1e3a8a" opacity="0.9" />
  <text x="28" y="32" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">DESCOMPRESSÃO JOELHO</text>
  
  <rect x="235" y="16" width="145" height="24" rx="6" fill="#7f1d1d" opacity="0.9" />
  <text x="243" y="32" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">MENISCO & RÓTULA</text>
</svg>
