<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="130" x2="320" y2="130" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="35,122 285,122 305,162 15,162" fill="url(#matGrad)" filter="url(#dropShadow)" />
  <ellipse cx="160" cy="150" rx="65" ry="8" fill="#0f172a" opacity="0.2" />

  <!-- Perna de Trás em B-Stance (Apenas ponta do pé para equilíbrio) -->
  <path d="M132,86 L116,118 L104,144" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <ellipse cx="104" cy="146" rx="6" ry="3" fill="#e2e8f0" />

  <!-- Perna Principal da Frente (Joelho semi-fletido a 20° fixo, Isquiotibiais em Tensão) -->
  <path d="M136,86 L154,116 L152,146" stroke="#d97706" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="148" y="144" width="18" height="6" rx="3" fill="#ffffff" />

  <!-- Destaque de Tensão Excêntrica nos Isquiotibiais e Glúteo -->
  <line x1="134" y1="92" x2="148" y2="114" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

  <!-- Calções Recuados em Dobradiça da Anca (Hip Hinge) -->
  <path d="M124,74 L148,78 L142,94 L120,88 Z" fill="#0f172a" />

  <!-- Tronco Inclinado com Coluna Neutra -->
  <path d="M142,76 L194,58 L198,72 L146,90 Z" fill="url(#kitGrad)" />

  <!-- Cabeça Alinhada com a Coluna -->
  <circle cx="206" cy="56" r="8" fill="#d97706" />
  <path d="M200,51 C202,45 212,47 212,53 Z" fill="#78350f" />

  <!-- Braço Vertical Segurando os Halteres Próximos à Canela -->
  <path d="M184,68 L180,114" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
  <g filter="url(#dropShadow)">
    <rect x="168" y="110" width="7" height="16" rx="2" fill="#0f172a" />
    <rect x="185" y="110" width="7" height="16" rx="2" fill="#0f172a" />
    <line x1="175" y1="118" x2="185" y2="118" stroke="#94a3b8" stroke-width="4" />
  </g>

  <!-- Setas de Dobradiça da Anca (Anca para trás) -->
  <g filter="url(#dropShadow)">
    <path d="M114,80 L94,80" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="96,76 88,80 96,84" fill="#2563eb" />
  </g>
</svg>
