<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gymFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="kitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#gymFloor)" />
  <line x1="0" y1="148" x2="320" y2="148" stroke="#cbd5e1" stroke-width="1" />

  <!-- Sombra no Solo (Pé de Apoio) -->
  <ellipse cx="140" cy="151" rx="20" ry="5" fill="#0f172a" opacity="0.22" />
  <ellipse cx="198" cy="149" rx="14" ry="4" fill="#0f172a" opacity="0.12" />

  <!-- Cabeça e Cabelo (Postura Vertical Firme) -->
  <circle cx="145" cy="38" r="8" fill="#d97706" />
  <path d="M139,34 C139,26 151,26 151,34 L149,42 L141,42 Z" fill="#78350f" />

  <!-- Tronco Vertical (Equilíbrio e Pelve Nivelada) -->
  <path d="M134,50 L156,50 L152,88 L136,88 Z" fill="url(#kitGrad)" />

  <!-- Braços nas Ancas (Postura de Controlo Pélvico) -->
  <path d="M136,56 L124,68 L136,76" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M154,56 L166,68 L154,76" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bacia / Calções -->
  <path d="M134,86 L154,86 L150,102 L132,102 Z" fill="#0f172a" />
  <!-- Destaque no Glúteo Médio / Abdutor Ativo -->
  <circle cx="151" cy="94" r="4.5" fill="#ef4444" opacity="0.8" />

  <!-- Perna de Apoio Esquerda (Vertical, micro-fletida) -->
  <path d="M138,102 L138,146" stroke="#b45309" stroke-width="7.5" stroke-linecap="round" />
  <rect x="132" y="144" width="16" height="5" rx="2.5" fill="#ffffff" />
  <rect x="134" y="145" width="12" height="2" fill="#ef4444" />

  <!-- Perna Ativa Direita em Abdução Lateral (30°) -->
  <path d="M148,102 L192,138" stroke="#d97706" stroke-width="7.5" stroke-linecap="round" />
  <rect x="188" y="134" width="16" height="5" rx="2.5" transform="rotate(32 196 136)" fill="#ffffff" />
  <rect x="190" y="135" width="12" height="2" transform="rotate(32 196 136)" fill="#ef4444" />

  <!-- Mini-Band / Banda Elástica nos Tornozelos (Em Tensão Máxima) -->
  <path d="M138,136 L186,132" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
  <path d="M138,136 L186,132" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Vetores de Abdução Lateral e Estabilidade -->
  <g filter="url(#dropShadow)">
    <!-- Vetor Lateral da Perna -->
    <path d="M165,116 Q185,118 200,124" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="198,120 206,126 197,128" fill="#2563eb" />
    <!-- Seta de Resistência Elástica -->
    <line x1="172" y1="134" x2="152" y2="135" stroke="#0284c7" stroke-width="2" stroke-dasharray="2,2" />
    <polygon points="155,132 148,135 155,138" fill="#0284c7" />
  </g>
</svg>
